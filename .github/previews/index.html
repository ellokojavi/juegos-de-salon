<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos de Salón · previews</title>
<script>
  // A lab link pointed here (`…/juegos-de-salon-previews/?key=…`) saves the key for every preview at
  // once, even with no PR open (D-429). It is checked, as always, by labs-puerta.js when a preview's
  // lab opens; a key that isn't valid is dropped there.
  (function () {
    try {
      var q = new URLSearchParams(location.search), key = q.get('key');
      if (key === null) return;
      history.replaceState(null, '', location.pathname);
      if (key) { localStorage.setItem('juegos-de-salon:labs-llave', key); window.keySaved = true; }
    } catch (e) { /* no storage: nothing saved */ }
  })();
</script>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5">
<p id="saved" hidden><strong>✅ Lab key saved in this browser.</strong> Every PR preview will show the lab from now on.</p>
<p>Previews of the open pull requests of Juegos de Salón, one folder per branch. To play, go to
<a href="https://juegosdesalon.cl/">juegosdesalon.cl</a>.</p>
<script>if (window.keySaved) document.getElementById('saved').hidden = false;</script>
</body>
</html>
