# The CI failure log (D-518): when a PR's `tests` or `end-to-end` run ends, this records it on the
# `failure-log` branch, not on main (main only takes PRs with green checks, D-216) and not in
# Firebase (it is CI data, not player data). A red run adds one record per failing test, with its
# signature; a green one closes that PR's open records: flaky if it is the same commit, fixed by
# that commit otherwise. `node tools/agents/failures.mjs check` (and `processes.mjs check`) reads it.
# The code that runs is main's (workflow_run always checks out the default branch), and the log's
# text is only data for failures.mjs: never pasted into a shell line.

name: Failure log

on:
  workflow_run:
    workflows: [Tests, End to end]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

# One writer at a time, none cancelled: each one adds to the same file
concurrency:
  group: failure-log
  cancel-in-progress: false

jobs:
  log:
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The log branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin failure-log; then
            git worktree add -q store FETCH_HEAD
          else
            git worktree add -q --detach store
            git -C store checkout -q --orphan failure-log
            git -C store rm -rq .
            echo '{ "records": [] }' > store/failures.json
          fi

      - name: Record
        run: |
          case "$WORKFLOW" in Tests) CHECK=tests ;; *) CHECK=end-to-end ;; esac
          ARGS=(--store store/failures.json --check "$CHECK" --commit "$SHA" --branch "$BRANCH")
          [ -n "$PR" ] && ARGS+=(--pr "$PR")
          if [ "$CONCLUSION" = failure ]; then
            gh run view "$RUN" -R "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/run.log" || true
            node tools/agents/failures.mjs capture --log "$RUNNER_TEMP/run.log" --run "$RUN" "${ARGS[@]}"
          else
            node tools/agents/failures.mjs link "${ARGS[@]}"
          fi
          node tools/agents/failures.mjs prune --store store/failures.json --archive store/archive.json

      # A push that loses the race with another run rebases on it and tries again
      - name: Save
        run: |
          cd store
          git add -A
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -qm "Failure log: $WORKFLOW $CONCLUSION, run $RUN"
          for i in 1 2 3; do
            git push -q origin HEAD:failure-log && exit 0
            git pull -q --rebase origin failure-log || true
          done
          exit 1
