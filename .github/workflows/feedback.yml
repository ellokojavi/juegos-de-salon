# The 🐞 feedback as issues (D-275): by hand only, a fallback. The Mac mini's `feedback-watch` job
# uploads them every 5 minutes (D-382), since GitHub ran the 15-minute schedule about 4 times a day.
# It uploads to GitHub the new reports of
# `feedback/` in Firebase, with the `feedback` label, so the processes agent handles them in its
# round. As an issue, each report reaches the owner by email and stays linked to its reply and its
# fix, even though the round (on the Mac mini, D-276) could read Firebase directly. The node is
# read without a key.

name: Feedback

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agents/feedback.mjs sync
