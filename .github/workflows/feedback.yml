# The 🐞 feedback as issues (D-275): every 15 minutes it uploads to GitHub the new reports of
# `feedback/` in Firebase, with the `feedback` label, so the processes agent handles them in its
# round. As an issue, each report reaches the owner by email and stays linked to its reply and its
# fix, even though the round (on the Mac mini, D-276) could read Firebase directly. The node is
# read without a key.

name: Feedback

on:
  schedule:
    # GitHub delays and sometimes skips schedules (with '41 * * * *' it ran about 4 times a day):
    # asking every 15 minutes leaves it at a while, not hours (D-306)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agents/feedback.mjs sync
