# Opens the processes agent's one-tap decisions issue (D-273) with the workflows bot, not the
# owner's account: GitHub notifies no one of what their own account does, and this way the owner
# gets the email. Launched by `node tools/agents/processes.mjs decide <file.json>`.

name: Decide

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Issue title'
        required: true
      body:
        description: 'Body, with the checkboxes and the actions block (built by processes.mjs)'
        required: true

permissions:
  issues: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The texts go through environment variables, never pasted into the script
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --label processes --body "$BODY"
