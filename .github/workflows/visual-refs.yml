# Makes the visual check's references on GitHub's runner (#1249, step 15): run it by hand on a PR's
# branch ("Run workflow", that branch) and it commits tools/e2e/visual/ref/*.png as the runner renders
# them. The runner is where the `end-to-end` check compares, so its pixels are the reference; one made
# on another machine can differ in the emoji font or Chrome's build. A commit pushed with the workflow's
# token starts no checks: push anything after it (or re-run end-to-end) to compare against it.
name: Visual references

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'One game (its folder, e.g. hangman); empty for all'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Serve the site
        run: |
          python3 -m http.server 8765 -d public > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ > /dev/null && exit 0; sleep 0.5; done
          echo "::error::the server did not come up"; exit 1
      # The same Chrome as e2e.yml
      - name: Chrome
        run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
      - name: References
        env:
          PART: ${{ inputs.part }}
        run: node tools/e2e/visual.mjs "$RUNNER_TEMP/visual" --update ${PART:+--part "$PART"}
      - name: Commit
        env:
          PART: ${{ inputs.part }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add tools/e2e/visual/ref
          git diff --cached --quiet && { echo "The references already match the runner."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Visual references from the runner${PART:+ ($PART)}"
          git push -q origin "HEAD:$BRANCH"
