# Sends La Copa's notifications to the phones of those who asked for them (D-224): every 15 minutes
# it runs tools/push/notify.mjs, which checks what is due (a day that opens, a deadline that closes,
# La Gran Final, the closing, a sign-up) and sends it by Web Push.
#
# It needs two GitHub secrets, which the owner loads:
#   FIREBASE_ADMIN_JSON  the service account key (the same as publish.yml's, D-218)
#   VAPID_PRIVADA        the notifications' private key (uploaded by `node tools/push/vapid.mjs`, D-223)
# Without either of them it warns and ends green: there is nothing to send.
#
# GitHub may delay a scheduled run a few minutes: the notifications do not depend on the exact minute.

name: Notifications

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  # To send now (Actions → Notifications → Run workflow), see what it would send or send a test one
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only say what it would send, without sending or recording anything'
        type: boolean
        default: false
      test:
        description: 'Code of a cup (5 letters): sends a test notification to each phone with notifications in it'
        type: string
        default: ''

permissions:
  contents: read

# One round at a time: two together could send the same notification twice
concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Send the notifications that are due
        env:
          KEY_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
          # The secret keeps its Spanish name (owner's decision, D-316)
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          TEST: ${{ inputs.test }}
        run: |
          if [ -z "$KEY_JSON" ] || [ -z "$VAPID_PRIVADA" ]; then
            echo "::warning::The FIREBASE_ADMIN_JSON or VAPID_PRIVADA secrets are missing: no notifications are sent (see tools/push/vapid.mjs)"
            exit 0
          fi
          umask 077
          printf '%s' "$KEY_JSON" > "$RUNNER_TEMP/key.json"
          export FIREBASE_KEY="$RUNNER_TEMP/key.json"
          if [ -n "$TEST" ]; then
            node tools/push/notify.mjs $DRY_RUN --test "$TEST"
          else
            node tools/push/notify.mjs $DRY_RUN
          fi
