# One-tap decisions (D-273): the processes agent opens an issue with checkboxes
# (`processes` label): Yes / No, or Yes, in Labs / Yes, and publish / No when the Yes changes something (D-409); when the owner checks one, this does what the checkbox says, with no model
# in between. The rules of who and what are in tools/agents/approve.mjs and its test.
# A decision settled with `processes.mjs settle` (D-411) counts as made: a box checked on it
# afterwards carries nothing out.
#
# A merge made with the workflow token does not wake publish.yml: that is why `merge` runs it
# by hand afterwards (workflow_dispatch does work with this token), and publish.yml runs the
# end-to-end tests before publishing (D-302).

name: Approve

on:
  issues:
    types: [edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: write   # approve-pr: the owner-approval status (docs/LANES.md)

# One decision at a time per issue, and the running one is not cancelled
concurrency:
  group: approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    # The first filter, so as not to start a machine for every edit of any issue. `procesos` is
    # the label's name before D-316, for issues opened before it was renamed
    if: github.event.sender.login == 'ellokojavi' && (contains(github.event.issue.labels.*.name, 'processes') || contains(github.event.issue.labels.*.name, 'procesos'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agents/approve.mjs
