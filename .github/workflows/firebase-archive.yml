# Moves what nobody reads any more out of the live Firebase tree into archive/ (D-476, #848 step 3):
# finished Cups ended more than two years ago with their podium saved, stats days older than two
# years, and daily tables (records/*/d<day>) and Uno al día day starts older than 35 days.
# tools/firebase/archive.mjs copies each node, reads the copy back and compares it, and only then
# deletes the live one. Running it twice moves nothing new.
#
# It only moves things once the owner sets the repository variable FIREBASE_ARCHIVE_APPLY to
# "true" (Settings → Secrets and variables → Actions → Variables), after reading a dry run; until
# then every night is a dry run that says what it would move.
# It needs the FIREBASE_ADMIN_JSON secret (the same as publish.yml's, D-218); without it, it warns
# and ends green.

name: Firebase archive

on:
  schedule:
    # After the stats names retention (uad-rebuild, 08:23 UTC), so archived days carry no names
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only say what it would move'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: firebase-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Archive old nodes
        env:
          KEY_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
          SWITCH: ${{ vars.FIREBASE_ARCHIVE_APPLY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "::warning::The FIREBASE_ADMIN_JSON secret is missing: nothing is archived"
            exit 0
          fi
          umask 077
          printf '%s' "$KEY_JSON" > "$RUNNER_TEMP/key.json"
          export FIREBASE_KEY="$RUNNER_TEMP/key.json"
          APPLY=""
          if [ "$SWITCH" = "true" ] && [ "$DRY_RUN" != "true" ]; then APPLY="--apply"; fi
          node tools/firebase/archive.mjs $APPLY
