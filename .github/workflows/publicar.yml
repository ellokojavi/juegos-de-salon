# Publica el sitio en GitHub Pages en cada fusión a main (D-192). Se publica solo public/ —sin las
# pruebas—: docs/, tools/, marketing/ y lo demás del repo no son parte del sitio. La versión se
# estampa aquí, en la copia que se publica (D-205).
# Antes corren las pruebas (pruebas.yml): con una en rojo, el sitio publicado no cambia.
#
# Requiere, una sola vez, Settings → Pages → Source: "GitHub Actions" (no "Deploy from a branch").
# El dominio juegosdesalon.cl se configura ahí mismo y se mantiene; public/CNAME queda por si acaso.

name: Publicar

on:
  push:
    branches: [main]
  # Para volver a publicar a mano (Actions → Publicar → Run workflow)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, y la que está saliendo no se corta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  # Las reglas de Firebase se publican solas (D-218), antes que el sitio: el código nuevo puede
  # necesitarlas. `reglas.mjs publicar` no sube nada si ya están, y las verifica después de subirlas;
  # si Firebase las rechaza, el sitio no se publica. Necesita el secreto FIREBASE_ADMIN_JSON (la
  # llave de la cuenta de servicio); sin él, avisa y sigue, y las reglas se publican a mano.
  reglas:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publicar las reglas de Firebase
        env:
          LLAVE_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
        run: |
          if [ -z "$LLAVE_JSON" ]; then
            echo "::warning::Falta el secreto FIREBASE_ADMIN_JSON: si este cambio tocó las reglas, publícalas a mano (node tools/firebase/reglas.mjs publicar)"
            exit 0
          fi
          umask 077
          printf '%s' "$LLAVE_JSON" > "$RUNNER_TEMP/llave.json"
          FIREBASE_LLAVE="$RUNNER_TEMP/llave.json" node tools/firebase/reglas.mjs publicar

  publicar:
    needs: [pruebas, reglas]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio (public/ sin las pruebas)
        run: rsync -a --exclude='*.test.mjs' public/ _site/

      # La versión no está en git: se estampa aquí, solo en la copia que se publica (D-205). El
      # número sale de la primera entrada de CHANGELOG.md, y la clave de caché lleva el commit.
      - name: Estampar la versión
        run: python3 tools/release/set-version.py --sitio _site --commit "$GITHUB_SHA"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicar
        uses: actions/deploy-pages@v4

      # C-11: se da por publicada cuando el sitio sirve la versión nueva, no cuando termina la subida
      - name: Comprobar que el sitio sirve la versión nueva
        env:
          URL: ${{ steps.publicar.outputs.page_url }}
        run: |
          clave="$(python3 tools/release/set-version.py --version)-${GITHUB_SHA:0:7}"
          for i in $(seq 1 20); do
            if curl -sfL "${URL}?t=$(date +%s)" | grep -q "base.css?v=$clave"; then
              echo "publicada: $clave"; exit 0
            fi
            sleep 15
          done
          echo "::error::$URL no sirve $clave después de 5 minutos"; exit 1
