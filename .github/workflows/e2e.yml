# The end-to-end tests in Chrome, on every PR and on every merge to main (D-193). On main
# publish.yml calls them before publishing (D-302): if they fail, the site does not change.
# The scripts go in even groups (D-307), one job per group and all at once: tools/e2e/groups.mjs
# builds them with how long each script took (durations.json), so none goes over ~4.5 min and they
# fit at once in the 20 runners. Within the group, each script runs alone, with its second attempt
# if it fails (D-299) and its row in the summary table. Those that open rooms in the production
# Firebase stay out and are run by hand: tools/e2e/ci.mjs decides the list, so a new script gets
# in by itself. Each passing run leaves the mark of the tree it tested, so publish.yml does not
# test it twice (D-308).
# The job `end-to-end` is a required check on main (D-216).

name: End to end

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A new push to the same PR cancels the previous run. Called from publish.yml, `github.workflow`
# is "Publish": that way a manual run on main does not cancel the one about to publish
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    # Reading the PR's commits and the marks of those that passed (D-392)
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      groups: ${{ steps.list.outputs.groups }}
      tree: ${{ steps.list.outputs.tree }}
      since: ${{ steps.list.outputs.since }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # In a PR that touches nothing of the browser (documentation, marketing, the agents, the
      # workshop no script imports, the rules and the other workflows; tools/e2e/changes.mjs) there
      # are no groups and no script runs: the check goes green in seconds (D-205, D-299). The tree
      # is that of what is tested (in a PR, the test merge with main that GitHub builds)
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            # Only what changed since the PR's last commit that passed (D-392); the whole PR on its
            # first push, after a force push, or when asking fails
            node tools/e2e/since-passed.mjs --pr "$PR" --head "$HEAD" > "$RUNNER_TEMP/changes"
            echo "groups=$(node tools/e2e/ci.mjs --groups --changes "$RUNNER_TEMP/changes")" >> "$GITHUB_OUTPUT"
            # The PR's test scope in the run's summary: what runs, and through what each file reaches (D-378)
            node tools/e2e/ci.mjs --scope --changes "$RUNNER_TEMP/changes" > /dev/null || true
          else
            echo "groups=$(node tools/e2e/ci.mjs --groups)" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: list
    if: needs.list.outputs.groups != '[]'
    runs-on: ubuntu-latest
    # A group takes ~4.5 min; the cap leaves room for a long second attempt
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.list.outputs.groups) }}
    name: ${{ matrix.group.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The scripts have port 8765 fixed (ES modules need HTTP, not file://).
      # The site is public/ (D-192)
      - name: Serve the site
        run: |
          python3 -m http.server 8765 -d public > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ > /dev/null && exit 0; sleep 0.5; done
          echo "::error::the server did not come up"; exit 1

      # The runner's Chrome; without a sandbox because Ubuntu 24.04 does not let it create its own without root
      - name: Chrome
        run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
          # The first start on a freshly booted runner is slow: it is paid here, not in the test
          timeout 60 "$RUNNER_TEMP/chrome" --headless=new --dump-dom about:blank > /dev/null 2>&1 || true

      # One after another, each with its second attempt if it fails (CI_RETRIES, D-299): if it
      # passes on the second, it stays green with a ⚠️ "Flaky" warning naming it. The run summary
      # has the table with each script, its time and its result.
      - name: Scripts
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
          CI_RETRIES: 1
          SCRIPTS: ${{ matrix.group.scripts }}
        run: node tools/e2e/ci.mjs $SCRIPTS

      # The screenshots of what failed or passed on the second attempt, each script in its folder
      # (ci.mjs deletes those of what passed on the first), to look at them without repeating the run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-g${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7

  # A single check that sums up all the scripts (D-216): it is the one `main` requires alongside
  # `tests`, so a PR's auto-merge waits for all of them to pass. Without scripts (a PR that only
  # brings documentation), it is enough for `list` to come out green.
  end-to-end:
    needs: [list, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - run: |
          echo "list: ${{ needs.list.result }} · scripts: ${{ needs.e2e.result }}"
          [ "${{ needs.list.result }}" = success ] || exit 1
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac
          echo "tested" > "$RUNNER_TEMP/mark"
      # The mark of the tree that passed, with real scripts: publish.yml looks for it so as not to
      # repeat the end-to-end run on the same thing (tools/e2e/already-tested.mjs, D-308). Not after
      # an incremental run (D-392): it tested only the last push, so it cannot vouch for the whole
      # tree, and publish.yml then runs the whole suite before publishing
      - if: needs.e2e.result == 'success' && needs.list.outputs.since == ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tree-${{ needs.list.outputs.tree }}
          path: ${{ runner.temp }}/mark
          retention-days: 7
      # The mark of the PR's commit that passed, with or without scripts: the next push to the PR
      # tests only what changed since it (tools/e2e/since-passed.mjs, D-392)
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-head-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/mark
          retention-days: 14
      # Wakes the PR's session (D-323): with auto-merge on, this check passing is the merge, so it
      # comments that it merges now, then holds the check two minutes so the PR is still open when
      # the app's monitor reads it (it reads every so often, not at once). It has to be here, inside the check: the PR is still open
      # (auto-merge waits for it), and the app's monitor stops listening once a PR is closed. Not
      # on forks (their token can't comment), and a failure here never turns the check red.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/checkout@v4
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node tools/release/merge-report.mjs --ready

  # On main nobody watches the check: if it comes out red, it opens an issue (or comments on the
  # one already open) with the scripts that failed and the link to the run, where their
  # screenshots are (D-205). On main it runs inside publish.yml, so that red also stops the
  # publication (D-302). Also on a manual run (Actions → End to end → Run workflow).
  notify:
    needs: [list, e2e]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="main is red: end-to-end"
          failed=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- `" + .name + "`"')
          body=$(printf 'The end-to-end tests failed on `main` after merging %s.\n\n%s\n\nRun and screenshots: %s\n\nIf it ran inside Publish, the site was not published: the previous version stays until main is green again (D-302).' \
            "${GITHUB_SHA:0:7}" "$failed" "$RUN_URL")
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  # And if main goes green again, it closes that issue: it used to stay open days after being fixed (D-273).
  close-notice:
    needs: [list, e2e]
    if: needs.e2e.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The Spanish title is the one used before D-316, so issues opened before it close too
          for title in "main is red: end-to-end" "main en rojo: Punta a punta"; do
            for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
              gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "main is green again at ${GITHUB_SHA:0:7}: $RUN_URL"
            done
          done
