# Las pruebas de punta a punta en Chrome, en cada PR y en cada fusión a main (D-193). En main las
# llama publicar.yml antes de publicar (D-302): si fallan, el sitio no cambia.
# Los guiones van en grupos parejos (D-307), un job por grupo y todos a la vez: los arma
# tools/e2e/grupos.mjs con lo que tardó cada guion (duraciones.json), para que ninguno pase de
# ~4,5 min y quepan de una en los 20 runners. Dentro del grupo, cada guion corre solo, con su
# segundo intento si falla (D-299) y su fila en la tabla del resumen. Los que abren salas en el
# Firebase de producción quedan fuera y siguen a mano: la lista la decide tools/e2e/ci.mjs, así
# que un guion nuevo entra solo. Cada corrida que pasa deja la marca del árbol que probó, para
# que publicar.yml no lo pruebe dos veces (D-308).

name: Punta a punta

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Un push nuevo al mismo PR cancela la corrida anterior. Llamado desde publicar.yml, `github.workflow`
# es "Publicar": así una corrida a mano en main no cancela la que está por publicar
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      grupos: ${{ steps.lista.outputs.grupos }}
      arbol: ${{ steps.lista.outputs.arbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # En un PR que no toca nada del navegador (documentación, marketing, los agentes, el taller que
      # ningún guion importa, las reglas y los otros workflows; tools/e2e/cambios.mjs) no hay grupos
      # y no corre ningún guion: el check queda en verde en segundos (D-205, D-299). El árbol es el
      # de lo que se prueba (en un PR, el merge de prueba con main que arma GitHub)
      - id: lista
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "arbol=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/cambios"
            echo "grupos=$(node tools/e2e/ci.mjs --grupos --cambios "$RUNNER_TEMP/cambios")" >> "$GITHUB_OUTPUT"
          else
            echo "grupos=$(node tools/e2e/ci.mjs --grupos)" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: lista
    if: needs.lista.outputs.grupos != '[]'
    runs-on: ubuntu-latest
    # Un grupo dura ~4,5 min; el tope deja lugar para un segundo intento largo
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        grupo: ${{ fromJson(needs.lista.outputs.grupos) }}
    name: ${{ matrix.grupo.nombre }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Los guiones tienen fijo el puerto 8765 (los módulos ES necesitan HTTP, no file://).
      # El sitio es public/ (D-192)
      - name: Servir el sitio
        run: |
          python3 -m http.server 8765 -d public > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ > /dev/null && exit 0; sleep 0.5; done
          echo "::error::el servidor no levantó"; exit 1

      # El Chrome del runner; sin sandbox porque Ubuntu 24.04 no deja crear el suyo sin root
      - name: Chrome
        run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
          # El primer arranque en un runner recién encendido es lento: se paga aquí, no en la prueba
          timeout 60 "$RUNNER_TEMP/chrome" --headless=new --dump-dom about:blank > /dev/null 2>&1 || true

      # Uno tras otro, cada uno con su segundo intento si falla (CI_REINTENTOS, D-299): si pasa al
      # segundo, queda en verde con un aviso ⚠️ "Intermitente" que lo nombra. El resumen de la
      # corrida trae la tabla con cada guion, su tiempo y su resultado.
      - name: Guiones
        env:
          SALIDA_E2E: ${{ runner.temp }}/e2e
          CI_REINTENTOS: 1
          GUIONES: ${{ matrix.grupo.guiones }}
        run: node tools/e2e/ci.mjs $GUIONES

      # Las capturas de lo que falló o pasó al segundo intento, cada guion en su carpeta (ci.mjs
      # borra las de lo que pasó al primero), para mirarlas sin repetir la corrida
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-g${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7

  # Un solo check que resume todos los guiones (D-216): es el que `main` exige junto a `pruebas`,
  # así el auto-merge de un PR espera a que pasen todos. Sin guiones (un PR que solo trae
  # documentación), basta con que `lista` salga en verde.
  punta-a-punta:
    needs: [lista, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lista: ${{ needs.lista.result }} · guiones: ${{ needs.e2e.result }}"
          [ "${{ needs.lista.result }}" = success ] || exit 1
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac
          echo "probado" > "$RUNNER_TEMP/marca"
      # La marca del árbol que pasó, con guiones de verdad: publicar.yml la busca para no repetir
      # la punta a punta sobre lo mismo (tools/e2e/ya-probado.mjs, D-308)
      - if: needs.e2e.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-arbol-${{ needs.lista.outputs.arbol }}
          path: ${{ runner.temp }}/marca
          retention-days: 7

  # En main nadie mira el check: si sale en rojo, abre un issue (o comenta el que ya está abierto)
  # con los guiones que fallaron y el link a la corrida, donde están sus capturas (D-205). En main
  # corre dentro de publicar.yml, así que ese rojo también frena la publicación (D-302). También
  # en una corrida a mano (Actions → Punta a punta → Run workflow).
  avisar:
    needs: [lista, e2e]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="main en rojo: Punta a punta"
          fallaron=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- `" + .name + "`"')
          cuerpo=$(printf 'Las pruebas de punta a punta fallaron en `main` después de fusionar %s.\n\n%s\n\nCorrida y capturas: %s\n\nSi corrió dentro de Publicar, el sitio no se publicó: sigue la versión anterior hasta que main vuelva a verde (D-302).' \
            "${GITHUB_SHA:0:7}" "$fallaron" "$CORRIDA")
          abierto=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" -R "$GITHUB_REPOSITORY" --body "$cuerpo"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"
          fi

  # Y si main vuelve a verde, cierra ese issue: antes quedaba abierto días después de arreglado (D-273).
  cerrar-aviso:
    needs: [lista, e2e]
    if: needs.e2e.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="main en rojo: Punta a punta"
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "main volvió a verde en ${GITHUB_SHA:0:7}: $CORRIDA"
          done
