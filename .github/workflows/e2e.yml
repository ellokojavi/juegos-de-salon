# Las pruebas de punta a punta en Chrome, en cada PR y en cada fusión a main (D-179).
# Cada guion de tools/e2e/ corre en su propio job, en paralelo. Los que abren salas en el
# Firebase de producción quedan fuera y siguen a mano: la lista la decide tools/e2e/ci.mjs,
# así que un guion nuevo entra solo.

name: Punta a punta

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo al mismo PR cancela la corrida anterior
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      guiones: ${{ steps.lista.outputs.guiones }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: lista
        run: echo "guiones=$(node tools/e2e/ci.mjs --lista)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        guion: ${{ fromJson(needs.lista.outputs.guiones) }}
    name: ${{ matrix.guion }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Los guiones tienen fijo el puerto 8765 (los módulos ES necesitan HTTP, no file://)
      - name: Servir el sitio
        run: |
          python3 -m http.server 8765 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ > /dev/null && exit 0; sleep 0.5; done
          echo "::error::el servidor no levantó"; exit 1

      # El Chrome del runner; sin sandbox porque Ubuntu 24.04 no deja crear el suyo sin root
      - name: Chrome
        run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"

      - name: ${{ matrix.guion }}
        env:
          SALIDA_E2E: ${{ runner.temp }}/e2e
        run: node tools/e2e/ci.mjs ${{ matrix.guion }}

      # Las capturas de lo que falló, para mirarlas sin repetir la corrida
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.guion }}
          path: ${{ runner.temp }}/e2e
          retention-days: 7
