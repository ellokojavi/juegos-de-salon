# Las pruebas de punta a punta en Chrome, en cada PR y en cada fusión a main (D-193).
# Cada guion de tools/e2e/ corre en su propio job, en paralelo, y los largos se reparten en partes
# (`cup/torneo.mjs:copa`): el job más lento marca cuánto espera el PR. Los que abren salas en el
# Firebase de producción quedan fuera y siguen a mano: la lista la decide tools/e2e/ci.mjs,
# así que un guion nuevo entra solo.

name: Punta a punta

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo al mismo PR cancela la corrida anterior
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      guiones: ${{ steps.lista.outputs.guiones }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # En un PR que solo trae documentación (docs/, marketing/, .claude/, los .md) la lista sale
      # vacía y no corre ningún guion: el check queda en verde en segundos (D-205)
      - id: lista
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/cambios"
            echo "guiones=$(node tools/e2e/ci.mjs --lista --cambios "$RUNNER_TEMP/cambios")" >> "$GITHUB_OUTPUT"
          else
            echo "guiones=$(node tools/e2e/ci.mjs --lista)" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: lista
    if: needs.lista.outputs.guiones != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        guion: ${{ fromJson(needs.lista.outputs.guiones) }}
    name: ${{ matrix.guion }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Los guiones tienen fijo el puerto 8765 (los módulos ES necesitan HTTP, no file://).
      # El sitio es public/ (D-192)
      - name: Servir el sitio
        run: |
          python3 -m http.server 8765 -d public > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ > /dev/null && exit 0; sleep 0.5; done
          echo "::error::el servidor no levantó"; exit 1

      # El Chrome del runner; sin sandbox porque Ubuntu 24.04 no deja crear el suyo sin root
      - name: Chrome
        run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
          # El primer arranque en un runner recién encendido es lento: se paga aquí, no en la prueba
          timeout 60 "$RUNNER_TEMP/chrome" --headless=new --dump-dom about:blank > /dev/null 2>&1 || true

      - name: ${{ matrix.guion }}
        env:
          SALIDA_E2E: ${{ runner.temp }}/e2e
        run: node tools/e2e/ci.mjs ${{ matrix.guion }}

      # Las capturas de lo que falló, para mirarlas sin repetir la corrida. El nombre de un
      # artefacto no admite "/" ni ":", y los guiones van en carpetas por juego, con su parte
      # (cup/torneo.mjs:copa)
      - if: failure()
        env:
          GUION: ${{ matrix.guion }}
        run: echo "ARTEFACTO=capturas-${GUION//[\/:]/-}" >> "$GITHUB_ENV"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # Un solo check que resume todos los guiones (D-216): es el que `main` exige junto a `pruebas`,
  # así el auto-merge de un PR espera a que pasen todos. Sin guiones (un PR que solo trae
  # documentación), basta con que `lista` salga en verde.
  punta-a-punta:
    needs: [lista, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lista: ${{ needs.lista.result }} · guiones: ${{ needs.e2e.result }}"
          [ "${{ needs.lista.result }}" = success ] || exit 1
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # En main nadie mira el check: si sale en rojo, abre un issue (o comenta el que ya está abierto)
  # con los guiones que fallaron y el link a la corrida, donde están sus capturas (D-205). No frena
  # la publicación, que corre aparte en publicar.yml.
  avisar:
    needs: [lista, e2e]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="main en rojo: Punta a punta"
          fallaron=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- `" + .name + "`"')
          cuerpo=$(printf 'Las pruebas de punta a punta fallaron en `main` después de fusionar %s.\n\n%s\n\nCorrida y capturas: %s\n\nEl sitio ya se publicó (publicar.yml no las espera): revisar si lo publicado está roto (D-205).' \
            "${GITHUB_SHA:0:7}" "$fallaron" "$CORRIDA")
          abierto=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" -R "$GITHUB_REPOSITORY" --body "$cuerpo"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"
          fi
