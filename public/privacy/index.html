<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Privacidad 🔒 · Juegos de Salón</title>
  <meta name="description" content="Qué datos guarda Juegos de Salón, para qué, dónde y por cuánto tiempo, y cómo pedir que los borremos.">
  <link rel="canonical" href="https://juegosdesalon.cl/privacy/">
  <!-- Sin destello de idioma (D-194): si el idioma elegido no es el español, no se pinta hasta tener sus textos -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* sin almacenamiento: se pinta como siempre */ }
    })();
  </script>
  <link rel="manifest" href="../manifest.webmanifest">
  <script>
    // El manifest del idioma elegido, antes de que el navegador lo lea: cambiarlo después no siempre alcanza (D-222)
    (function () {
      try {
        var l = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('juegos-de-salon:lang') || '').toLowerCase();
        var m = document.querySelector('link[rel="manifest"]');
        if (m && /^(en|pt|de)$/.test(l)) m.href = m.href.replace(/manifest\.webmanifest$/, 'manifest.' + l + '.webmanifest');
      } catch (_) { /* queda el del español */ }
    })();
  </script>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <script src="../assets/js/vigia.js"></script>
  <link rel="preload" href="../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .pv { display: grid; gap: 14px; }
    .pv-icon { display: block; font-size: 3.4rem; line-height: 1.1; }
    .pv .panel h2 { margin: 0 0 8px; font: 900 1.15rem var(--font-body); }
    .pv .panel p { margin: 0 0 8px; line-height: 1.5; }
    .pv .panel p:last-child { margin-bottom: 0; }
    .pv ul { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 8px; line-height: 1.5; }
    .pv a { color: var(--cyan); overflow-wrap: anywhere; }
    .pv-pie { text-align: center; font-size: 0.9rem; }
  </style>
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Juegos de Salón">
  <script type="module">import '../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu">‹ Menú</a>
      <div class="tools"><div id="lang-slot"></div></div>
    </div>
    <header class="intro-hero center">
      <span class="pv-icon" aria-hidden="true">🔒</span>
      <h1 class="display display--lg rainbow" id="pv-h1">Privacidad</h1>
      <p class="sub muted" id="pv-lead"></p>
    </header>
    <div class="pv" id="pv"></div>
  </main>

  <!-- The texts live in texts.js, in the four languages (D-463, C-3) -->
  <script type="module">
    import { el } from '../assets/js/ui.js';
    import { getLang, langToggle, applyStatic, COMMON } from '../assets/js/i18n.js';
    import { trackVisit } from '../assets/js/transport/stats.js';
    import { TEXTS, CONTACT } from './texts.js';

    trackVisit(); // the site's traffic (D-208); it also tells the watcher the page started (D-251)
    const lang = getLang();
    document.documentElement.lang = lang;
    const C = COMMON[lang] || COMMON.es, T = TEXTS[lang] || TEXTS.es;
    applyStatic(C);
    document.title = `${T.title} 🔒 · ${C.appTitle}`;
    document.getElementById('btn-menu').textContent = `‹ ${C.menu}`;
    document.getElementById('lang-slot').append(langToggle());
    document.getElementById('pv-h1').textContent = T.title;
    document.getElementById('pv-lead').textContent = T.lead;

    /** A text with the contact address as a mailto link. */
    const texto = s => String(s).split(CONTACT).flatMap((part, i) => (i ? [el('a', { href: `mailto:${CONTACT}` }, CONTACT), part] : [part]));
    document.getElementById('pv').append(
      ...T.sections.map(s => el('section', { class: 'panel' },
        el('h2', {}, s.h),
        ...(s.p || []).map(p => el('p', {}, ...texto(p))),
        s.items ? el('ul', {}, ...s.items.map(i => el('li', {}, ...texto(i)))) : null)),
      el('p', { class: 'muted pv-pie' }, ...texto(T.who), el('br'), T.updated));
  </script>
</body>
</html>
