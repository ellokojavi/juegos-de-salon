<script>
'use strict';
/**
 * ⚖️ Tembleque — lab prototype. Shapes ride a rail over a plank balanced on a rock; a tap drops the one
 * in the claw. They never
 * stop coming, quicker each time, and they pile up. Each one that ends in the water costs one of three
 * lives; a plank that leans too far tips over and ends the game at once. The score is how many pieces are
 * on the pile, plus one for each that left the plank level (a perfect one).
 *
 * Three parts: the physics (rigid bodies, pure), the game (the pile, the claw, the score, pure) and the
 * view (canvas, sound, input). The first two run on a fixed step and use only + − × ÷ and sqrt, like
 * Tren en Vilo's engine, so one seed and the same taps give the same game in every browser.
 *
 * The pile can grow without end because only its top is simulated piece by piece: once a piece is
 * buried and at rest it is welded to the plank (physics: `mkPart`; game: `weld`).
 */

/* ================================================================== */
/* Physics: convex polygons and circles, sequential impulses           */
/* ================================================================== */
const DT = 1 / 120, GRAV = 1100, ITER = 10, SLOP = 0.5, BETA = 0.2, MAX_BIAS = 70, REST_V = 70, ROLL = 5.5;
const PI = 3.141592653589793, C30 = 0.8660254037844386;

/** A convex polygon from its points: centred on its centroid, clockwise on screen (y down), with its outward normals. */
function mkPoly(pts) {
  const n = pts.length; let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n], k = x1 * y2 - x2 * y1; a += k; cx += (x1 + x2) * k; cy += (y1 + y2) * k; }
  cx /= 3 * a; cy /= 3 * a; a /= 2;
  const p = pts.map(([x, y]) => [x - cx, y - cy]);
  if (a < 0) { p.reverse(); a = -a; }
  let inertia = 0, r = 0; const nrm = [];
  for (let i = 0; i < n; i++) {
    const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % n], k = x1 * y2 - x2 * y1;
    inertia += k * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
    const ex = x2 - x1, ey = y2 - y1, l = Math.sqrt(ex * ex + ey * ey); nrm.push([ey / l, -ex / l]);
    r = Math.max(r, Math.sqrt(x1 * x1 + y1 * y1));
  }
  return { kind: 'poly', p, nrm, area: a, inertia: inertia / 12, r };
}
const mkCircle = r => ({ kind: 'circle', r, area: PI * r * r, inertia: PI * r * r * r * r / 2 });
const rect = (w, h) => Object.assign(mkPoly([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]), { w, h });
const tri = s => mkPoly([[0, -s * C30], [s / 2, 0], [-s / 2, 0]]);
/** Half a disc, flat side down, in steps of 30°. */
const dome = r => mkPoly([[-1, 0], [-C30, -0.5], [-0.5, -C30], [0, -1], [0.5, -C30], [C30, -0.5], [1, 0]].map(([x, y]) => [x * r, y * r]));

/**
 * A piece made of several convex shapes that are one rigid body (an L: no single convex shape is one).
 * `subs`: each shape and where its centre is; `outline`: the whole piece's outline, for drawing.
 * Everything ends up measured from the piece's centre of mass.
 */
function mkCompound(subs, outline) {
  let area = 0, cx = 0, cy = 0, inertia = 0, r = 0;
  for (const u of subs) { area += u.shape.area; cx += u.x * u.shape.area; cy += u.y * u.shape.area; }
  cx /= area; cy /= area;
  const out = subs.map(u => { const lx = u.x - cx, ly = u.y - cy; inertia += u.shape.inertia + u.shape.area * (lx * lx + ly * ly); return { shape: u.shape, lx, ly }; });
  const line = outline.map(([x, y]) => { const px = x - cx, py = y - cy; r = Math.max(r, Math.sqrt(px * px + py * py)); return [px, py]; });
  return { kind: 'compound', subs: out, outline: line, area, inertia, r };
}
/** An L: a bar of three squares of side a with one more at its foot, to the right or (`flip`) to the left. */
const ele = (a, flip) => {
  const f = flip ? -1 : 1;
  return mkCompound([{ shape: rect(a, 3 * a), x: 0, y: 0 }, { shape: rect(a, a), x: f * a, y: a }],
    [[-0.5, -1.5], [0.5, -1.5], [0.5, 0.5], [1.5, 0.5], [1.5, 1.5], [-0.5, 1.5]].map(([x, y]) => [f * x * a, y * a]));
};

/** A T: a bar of three squares of side a with one more standing on its middle. */
const te = a => mkCompound([{ shape: rect(3 * a, a), x: 0, y: 0 }, { shape: rect(a, a), x: 0, y: -a }],
  [[-1.5, 0.5], [-1.5, -0.5], [-0.5, -0.5], [-0.5, -1.5], [0.5, -1.5], [0.5, -0.5], [1.5, -0.5], [1.5, 0.5]].map(([x, y]) => [x * a, y * a]));
/** A Z: two bars of two squares, the lower one a square to the right or (`flip`) to the left. */
const zeta = (a, flip) => {
  const f = flip ? -1 : 1;
  return mkCompound([{ shape: rect(2 * a, a), x: -f * a / 2, y: -a / 2 }, { shape: rect(2 * a, a), x: f * a / 2, y: a / 2 }],
    [[-1.5, -1], [0.5, -1], [0.5, 0], [1.5, 0], [1.5, 1], [-0.5, 1], [-0.5, 0], [-1.5, 0]].map(([x, y]) => [f * x * a, y * a]));
};
/** A cross: five squares of side a. */
const cruz = a => mkCompound([{ shape: rect(3 * a, a), x: 0, y: 0 }, { shape: rect(a, a), x: 0, y: -a }, { shape: rect(a, a), x: 0, y: a }],
  [[-0.5, -1.5], [0.5, -1.5], [0.5, -0.5], [1.5, -0.5], [1.5, 0.5], [0.5, 0.5], [0.5, 1.5], [-0.5, 1.5], [-0.5, 0.5], [-1.5, 0.5], [-1.5, -0.5], [-0.5, -0.5]].map(([x, y]) => [x * a, y * a]));
/** A regular hexagon of radius r, resting on a flat side. */
const hexa = r => mkPoly([[r, 0], [r / 2, r * C30], [-r / 2, r * C30], [-r, 0], [-r / 2, -r * C30], [r / 2, -r * C30]]);

/** A body. Mass is density × area / 1000. One of several shapes carries them as `parts` (see mkPart), with the ids right after its own. */
function mkBody(id, shape, x, y, { density = 1, fr = 0.35, re = 0 } = {}) {
  const m = density * shape.area / 1000, n = shape.p ? shape.p.length : 0;

    if (speed.fps < speed.trial.fps * 1.15) { quality = speed.trial.q; resize(); speed.done = true; }
    speed.trial = null; return;
  }
  if (speed.fps >= 48) { speed.slowSince = 0; return; }
  if (!speed.slowSince) { speed.slowSince = ts; return; }
  if (ts - speed.slowSince < 1500 || quality <= 0.5) return;
  speed.trial = { at: ts, fps: speed.fps, q: quality }; quality = quality > 0.75 ? 0.75 : 0.5; speed.slowSince = 0; resize();
}

function press() {
