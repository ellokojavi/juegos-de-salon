<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tembleque ⚖️ · Juegos de Salón</title>
  <!-- Out of the lab (D-517's way): no lab door and no noindex; until flags/wobbles is on for this visitor,
       game.js sends them to the home page (as ¡Al toque! did) -->
  <!-- No language flash (D-194): the page waits for the chosen language's texts, 1.5 s at most -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* no storage: it paints as always */ }
    })();
    // Offline mode (D-538): a phone already offline paints its first frame in the offline palette,
    // with no flash of the normal one (offline-ui.js takes over once the page has loaded)
    (function () {
      try {
        var f = localStorage.getItem('juegos-de-salon:offline-forced');
        if (localStorage.getItem('juegos-de-salon:offline-flag') === '1' && f !== '0' && (f === '1' || navigator.onLine === false)) document.documentElement.classList.add('offline', 'offline-shell');
      } catch (_) { /* no storage: it paints as always */ }
    })();
  </script>
  <!-- generated: og · rewritten by node tools/release/og.mjs cards -->
  <meta name="description" content="Apila piezas en la balanza sin que se caigan, en modo fácil o difícil. Un jugador, 1–5 min. Gratis, sin instalar y sin cuenta.">

  <!-- /generated -->
  <link rel="manifest" href="../manifest.webmanifest">
  <script>
    // The chosen language's manifest, before the browser reads it (D-222)
    (function () {
      try {
        var l = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('juegos-de-salon:lang') || '').toLowerCase();
        var m = document.querySelector('link[rel="manifest"]');
        if (m && /^(en|pt)$/.test(l)) m.href = m.href.replace(/manifest\.webmanifest$/, 'manifest.' + l + '.webmanifest');
      } catch (_) { /* the Spanish one stays */ }
    })();
  </script>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <script src="../assets/js/vigia.js"></script>
  <link rel="preload" href="../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/ranking.css">
  <link rel="stylesheet" href="style.css">

  <script type="module">import '../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">⚖️ Tembleque</span><span id="sound-slot"></span></div>
    </div>

    <!-- ============ COVER: the two levels ============ -->
    <section class="screen stack active" id="screen-intro">
      <div class="intro-hero">
        <span class="icon">⚖️</span>
        <h1 class="display display--xl rainbow wb-title" data-i18n="title">Tembleque</h1>
        <p class="lead" data-i18n="lead"></p>
        <!-- The cover's picture: a loop of the level the lever shows, recorded from the real game (easy, the plank; hard, the disc) -->
        <div class="wb-pic" id="pic"></div>
        <div id="lang-slot"></div>
      </div>
      <div class="stack">
        <div class="modes" id="modes"></div>
        <!-- The rules go after the main action (U-39): folded by default (D-550), the goal first and three points (U-18) -->
        <details class="panel">
          <summary><span data-i18n="howTitle"></span></summary>
          <ol class="how" id="how"></ol>
        </details>
        <!-- The player's account (D-212): only signing in on the cover, the «👤 Entrar» dialog (C-8); the tables are on each level's result -->
        <div class="stack" id="rk-slot"></div>
      </div>
      <div id="pie" class="pie"></div>
    </section>
  </main>

  <script type="module">import './game.js';</script>
</body>
</html>
