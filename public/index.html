  <style>
    .hero { text-align: center; padding: 28px 0 18px; }

    @container (max-width: 380px) {

    /* `animation: slideUp` anima opacity hasta 1 y con `both` lo deja puesto: sin apagar la

    .game-card.soon { pointer-events: none; animation: none; }

    .game-card h2 .nuevo {

    /* Filtros (D-142, D-149): el tipo de juego, en fichas que se prenden y se apagan. */

    .filtros .ficha-fav[hidden] { display: none !important; }

      /* The cards as they looked on the last visit, drawn before any module arrives (the owner's
         request, D-435; for everyone since 2026-10-23): the page's module saves a copy
         of the list once drawn, and here it comes back at once. It is a link like any other card,
         so a game opens even before the modules arrive. The copy counts only for the same version,
         language and day (a ✨ Nuevo or Uno al día's state changes with the date) and with no
         filter in the link; the module draws the real cards over it in the same instant. */
      (function () {
        try {
          var m = document.getElementById('importmap'), d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
          var v = m ? ((m.textContent.match(/\?v=([^"]+)/) || [])[1] || '') : '';
          var l = (new URLSearchParams(location.search).get('lang') || '').toLowerCase() || localStorage.getItem('juegos-de-salon:lang') || 'es';
          var hoy = d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
          // Today played or not is part of the key: a copy drawn before playing would show ▶ Jugar hoy
          // after it, and its tap would roll the die again
          var uad = JSON.parse(localStorage.getItem('juegos-de-salon:uno-al-dia') || 'null');
          var k = [v, l, hoy, uad && uad.dias && uad.dias[hoy] ? 1 : 0].join('|');
          window.__fotoPortada = { k: k };
          var f = JSON.parse(localStorage.getItem('juegos-de-salon:portada-foto') || 'null');
          if (!f || f.k !== k || typeof f.html !== 'string' || /[?&](type|tipo|daily)=/.test(location.search)) return;
          var g = document.getElementById('games');
          // The copy's words wrap as the drawn ones do (German hyphenates by the page's language)
          if (/^(es|en|pt)$/.test(l)) document.documentElement.lang = l;
          g.innerHTML = f.html;

          // carried out by the real card when it arrives, instead of doing nothing (U-12)
          var c = g.querySelector('button#btn-uad-chip');

        } catch (_) { /* without storage the list arrives with the modules, as always */ }
      })();

    // It still plays in Uno al día and La Copa, and 🎲 still draws it (D-188)
    const JUEGOS_PORTADA = PORTADA.filter(g => g.id !== 'letras');
    const app = compartirApp({ C: T, lang, juegos: JUEGOS_PORTADA.filter(g => g.available).length });
    // The sheet with the vertical video in every language, on the Spanish or English tab (D-410)
    document.getElementById('share-slot').append(
      botonCompartirPortada({ C: T, app, url: homeUrl(lang), icono: ICONO_COMPARTIR, lang, tap: () => SFX.tap() }));
    // La imagen se baja antes, y solo donde se va a mandar: al tocar "Invitar a jugar", el menú del
    // sistema tiene que abrirse enseguida (Safari lo niega si el toque quedó atrás)
    if (comparteArchivos()) (window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => app.imagen());

    // The windows the home page opens on its own: the recap (D-423, D-424), the splash (D-351) and the
    // install bubble (D-232), through one gate that opens at most one per visit (D-431, in the lab)
    import('./assets/js/home-windows.js').then(({ startHomeWindows }) => startHomeWindows({ lang, T, url: homeUrl(lang), tap: () => SFX.tap() })).catch(() => {});
    // The lab's experiments bar (D-363): opened from /labs/home/ with ?lab, on the real home page
    // Only for lab key holders, like everything still in development (D-395)
    // The experiments' bar, only with a lab key (D-395). lab: #seccion-portada
    if (param('lab') !== null) import('./assets/js/lab-access.js').then(({ labAccess }) => labAccess()).then(yes => yes && import('./labs/home/experiments.js').then(({ drawBar }) => drawBar())).catch(() => {});

    // The copy of the list the next visit draws at once (D-435): only of the whole list, never a
    // filtered or searched one, nor one drawn with ?daily=
    const FOTO = 'juegos-de-salon:portada-foto';
    const guardarFoto = () => {
      try {
        const k = window.__fotoPortada?.k;
        // Never from a link that changes the layout (?daily=button puts Uno al día next to the die)
        if (k && param('daily') === null && !list.querySelector('[hidden], .reserva')) localStorage.setItem(FOTO, JSON.stringify({ k, html: list.innerHTML }));
      } catch (_) { /* without storage, every visit waits for the modules, as before */ }
    };

    // 1) Lo importante primero: la lista de juegos, con los de La Copa al final (D-142).
    const list = document.getElementById('games');
    // The last visit's copy (the script under #games, D-435): the real cards take its place in
    // this same task, so nothing blinks. Its Uno al día card stays until the real one arrives, as
    // the empty card does without a copy.
    const uadFoto = list.classList.contains('foto') ? list.querySelector('#btn-uno-al-dia') : null;
    list.replaceChildren();
    const marcados = new Set(favoritos());
    const botonFavorito = (g, card) => {
      const b = el('button', { type: 'button', class: 'fav', 'data-id': g.id, style: card.getAttribute('style'),
        'aria-label': T.favorite.replace('{juego}', pickLang(g.name, lang)), title: T.favorite.replace('{juego}', pickLang(g.name, lang)) });
      const pintar = () => { const on = marcados.has(g.id); b.textContent = on ? '★' : '☆'; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); };
      b.addEventListener('click', () => {
        if (alternarFavorito(g.id)) marcados.add(g.id); else marcados.delete(g.id);
        pintar();
        if (b.classList.contains('on')) { b.classList.remove('salta'); void b.offsetWidth; b.classList.add('salta'); }
        document.dispatchEvent(new CustomEvent('favoritos'));
      });
      pintar();
      return b;
    };
    // The 🔥 "Popular" label on the top three (D-361; for everyone since D-369)
    const top = populares();
    const tarjetas = JUEGOS_PORTADA.map((g, i) => {
      const [, max] = rangoJugadores(g.players);
      // Un juego que no está disponible se ve, pero no se abre: sin href, ni con el teclado (C-5)
      const card = el('a', { class: 'game-card' + (g.available ? '' : ' soon') + (g.torneo ? ' torneo' : ''), href: g.available ? g.path : null, 'aria-disabled': g.available ? null : 'true', 'data-id': g.id, style: `animation-delay:${i * 60}ms` },
        el('div', { class: 'emoji' }, el('span', { class: con('', g.emoji) }, g.emoji)),
        el('div', { class: 'texto' },
          // "Próximamente" va pegado al nombre: abajo, entre las píldoras, no se veía
          el('h2', {}, el('span', {}, pickLang(g.name, lang)), !g.available && el('span', { class: 'proximamente' }, T.soon),
            // A new game says so for a week (D-333, D-507)
            g.available && esNuevo(g) && el('span', { class: 'nuevo' }, el('span', {}, T.newGame)),
            top.has(g.id) && el('span', { class: 'popular' }, el('span', {}, '🔥 '), el('span', {}, T.popularGame))),
          el('div', { class: 'tag' }, pickLang(g.tagline, lang)),
        ),
        el('div', { class: 'meta' },
          // La palabra va aparte: la tarjeta alta la esconde a la vista para que quepa en una línea
          g.players && el('span', {}, `👥 ${g.players}`, el('span', { class: 'unidad' }, ` ${max === 1 ? T.player : T.players}`)),
          g.duration && el('span', {}, `⏱ ${g.duration} ${g.durationUnit ? pickLang(g.durationUnit, lang) : T.minutes}`),
          // Lo que por ahora se juega solo en español lo dice antes de abrirlo (D-98)
          g.available && g.idiomas && !g.idiomas.includes(lang) && el('span', { class: 'idioma' }, `🇪🇸 ${T.onlySpanish}`),
        ),
        el('div', { class: 'go' }, '›'),
      );
      // La ⭐ de favorito (D-238) va al lado de la tarjeta y no adentro: un botón dentro de un link
      // no se puede tocar sin abrir el juego. La Copa no lleva: es una semana con amigos, no una partida
      if (!g.available || g.torneo) { list.append(card); return { g, card, caja: card }; }
      const caja = el('div', { class: 'game-slot' }, card, botonFavorito(g, card));
      list.append(caja);
      return { g, card, caja };
    });


    // Juego al azar (D-188): always from every game on the home page, whatever filter is on; only
    // `alAzar` leaves some out (La Copa, and the games that need a group, D-374)
    document.getElementById('azar-slot').append(botonAzar({ lang, candidatos: () => PORTADA }));
    // Uno al día (D-230): el juego de hoy, el mismo para todos. Va en una tarjeta de media fila junto
    // a La Copa (D-239, lo que eligió el dueño); ?daily=button lo pone al lado del dado, como antes
    // The row is drawn now, with an empty card in One a Day's place, so La Copa does not first show
    // at full width and then jump when the modules arrive
    const copa = tarjetas.find(t => t.g.torneo)?.card;
    // null (never false) without one, so `reserva?.remove()` holds with ?daily=button
    const reserva = !['button', 'off'].includes(param('daily')) && copa
      ? (uadFoto || el('div', { class: 'game-card alta uad-card reserva', 'aria-hidden': 'true' }, el('div', { class: 'emoji' }, el('span', {}, '📅')))) : null;
    if (reserva) {
      const fila = el('div', { class: 'fila-alta' });
      copa.replaceWith(fila);
      copa.classList.add('alta');
      fila.append(copa, reserva);
    }
    // La Copa's card says what to do today (flag copa-hoy): ▶ Jugar hoy with a day to play. lab: #seccion-copa-hoy
    // With today's day played, Día N en Xh Ym (flag copa-espera). lab: #seccion-copa-espera
    // The top bar's buttons as pills of one height (flag home-pill-bar, #1027). lab: #seccion-home-pill-bar
    import('./assets/js/flags.js').then(({ flag }) => flag('home-pill-bar')).then(on => on && document.documentElement.classList.add('pill-bar')).catch(() => {});
    if (copa) import('./assets/js/flags.js').then(({ flag }) => flag('copa-hoy')).then(on => on && import('./assets/js/cup-today.js'))
      .then(m => m && import('./assets/js/flags.js').then(({ flag }) => flag('copa-espera')).then(wait => m.decorateCupCard(copa, { lang, wait }))).catch(() => {});
    const uadListo = Promise.all([import('./assets/js/uno-al-dia.js'), import('./assets/js/uno-al-dia-ui.js')]).then(([{ formaAcceso, estado }, { botonUnoAlDia, tarjetaUnoAlDia }]) => {
      if (formaAcceso() === 'off') { reserva?.remove(); return; }
      import('./assets/js/uno-al-dia-avisos.js').then(Av => Av.globo()).catch(() => {});
      if (formaAcceso() === 'card' && reserva) {
        const card = tarjetaUnoAlDia({ lang, alTocar: () => SFX.tap() });
        reserva.replaceWith(card);
        // Back from today's game (bfcache) brings the page as it was, ▶ Jugar hoy included: once
        // today is played the card is drawn again, with its place
        let actual = card;
        addEventListener('pageshow', e => {
          if (!e.persisted || actual.classList.contains('hecho') || !estado().dia) return;
          const nueva = tarjetaUnoAlDia({ lang, alTocar: () => SFX.tap() });
          actual.replaceWith(nueva); actual = nueva;
          import('./assets/js/uad-place.js').then(({ refreshPlace }) => refreshPlace(nueva, { lang, alTocar: () => SFX.tap() })).then(() => guardarFoto()).catch(() => {});
        });
        // A tap on the copy's ▶ chip before the modules arrived: carried out now
        if (window.__fotoPortada?.chip) { window.__fotoPortada.chip = false; card.querySelector('button#btn-uad-chip')?.click(); }
        // The month's place fresh from the server, once the page is drawn (D-435): until it
        // answers, the chip shows the last one cached
        (window.requestIdleCallback || (f => setTimeout(f, 300)))(() => import('./assets/js/uad-place.js')
          .then(({ refreshPlace }) => refreshPlace(card, { lang, alTocar: () => SFX.tap() })).then(cambio => cambio && guardarFoto()).catch(() => {}));
      } else {
        reserva?.remove();
        const slot = document.getElementById('azar-slot');
        slot.classList.add('con-uad');
        // En la misma fila, los dos con etiqueta corta: "Al azar" y "Uno al día" (decisión del dueño)
        const azar = slot.querySelector('.btn-azar span:last-child');
        if (azar) azar.textContent = (AZAR[lang] || AZAR.es).corto;
        slot.append(botonUnoAlDia({ lang, alTocar: () => SFX.tap() }));
      }
    // Without the modules (offline, an error) the empty card goes away and La Copa takes the row
    }).catch(() => reserva?.remove());
    uadListo.then(() => guardarFoto());
    // A ⭐ marked or unmarked shows on the next visit's copy too
    document.addEventListener('favoritos', () => uadListo.then(guardarFoto));

    // Filtro por tipo (D-142, D-149): la lista ya es larga. Va en la URL (?type=logic, en inglés
    // como las rutas: D-214), así volver desde un juego lo deja como estaba y un link filtrado se
    // puede compartir. Cuántos juegan no se filtra: cada juego pregunta su modo adentro.
    // "⭐ Favoritos" (D-238) es una ficha más, al principio, y solo con algún favorito marcado:
    // ?type=favorites en un celular sin favoritos muestra todos, sin ruido.
    try {
      const q = new URLSearchParams(location.search);
      const pedido = q.get('type') || TIPOS_VIEJOS[q.get('tipo')];
      const FAV = 'favorites';
      const hayFavoritos = () => tarjetas.some(t => t.caja !== t.card && marcados.has(t.g.id));
      // "✨ Nuevos" and "🔥 Populares" (D-362; for everyone since D-369)
      const NEW = 'new', POP = 'popular';
      const top3 = populares();
      const atajo = { [NEW]: g => g.available && esNuevo(g), [POP]: g => top3.has(g.id) };
      const tieneAtajo = k => JUEGOS_PORTADA.some(atajo[k]);
      const filtro = { tipo: TIPOS[pedido] || (pedido === FAV && hayFavoritos()) || (atajo[pedido] && tieneAtajo(pedido)) ? pedido : null };
      // The search (D-390, for everyone since D-403): the games "see them all" filtered, or null with nothing typed
      const busca = { ids: null, clear: () => {} };
      const caben = ({ g, card, caja }) => (!busca.ids || busca.ids.has(g.id)) && (!filtro.tipo
        || (filtro.tipo === FAV ? caja !== card && marcados.has(g.id) : atajo[filtro.tipo] ? atajo[filtro.tipo](g) : (g.tipos || []).includes(filtro.tipo)));
      const caja = document.getElementById('filtros');
      caja.setAttribute('aria-label', T.filters);
      const tipos = el('div', { class: 'tipos', role: 'group', 'aria-label': T.filters });
      const cuenta = document.getElementById('filtros-cuenta');
      const botones = [];
      const fav = el('button', { type: 'button', class: 'ficha-fav', 'data-tipo': FAV, 'aria-label': T.favorites, title: T.favorites, onClick: () => { filtro.tipo = filtro.tipo === FAV ? null : FAV; aplicar(); } }, el('span', { class: 'ficha-emoji', 'aria-hidden': 'true' }, '⭐'), el('span', {}, T.favorites));
      const favs = el('div', { class: 'favs' }, fav);
      botones.push(fav);
      // Solo los tipos que tiene algún juego que se puede abrir: así la lista nunca queda vacía
      for (const [id, t] of Object.entries(TIPOS)) {
        if (!JUEGOS_PORTADA.some(g => g.available && (g.tipos || []).includes(id))) continue;
        const b = el('button', { type: 'button', 'data-tipo': id, onClick: () => { filtro.tipo = filtro.tipo === id ? null : id; aplicar(); } }, el('span', { class: 'ficha-emoji', 'aria-hidden': 'true' }, t.emoji), el('span', {}, pickLang(t.name, lang)));
        tipos.append(b); botones.push(b);
      }
      const atajos = el('div', { class: 'atajos', role: 'group', 'aria-label': T.filters });
      for (const [k, emoji, texto] of [[NEW, '✨', T.filterNew], [POP, '🔥', T.filterPopular]]) {
        const b = el('button', { type: 'button', 'data-tipo': k, hidden: !tieneAtajo(k), onClick: () => { filtro.tipo = filtro.tipo === k ? null : k; aplicar(); } }, el('span', { class: 'ficha-emoji', 'aria-hidden': 'true' }, emoji), el('span', {}, texto));
        atajos.append(b); botones.push(b);
      }
      atajos.hidden = ![NEW, POP].some(tieneAtajo);
      caja.append(favs, atajos, tipos);
      const limpiar = () => { filtro.tipo = null; busca.clear(); aplicar(); };
      // Dónde va ⭐ Favoritos (D-241): se prueba de la forma más completa a la más corta y queda la
      // primera que cabe sin que la fila se desborde. Se mide en vez de fijar un ancho: el largo de
      // los tipos cambia con el idioma y con las fuentes de cada celular.
      const acomodarFav = () => {
        const hay = hayFavoritos();
        fav.hidden = !hay;
        // With ✨ Nuevo and 🔥 Populares (D-362), ⭐ goes first in their row, with its name if it fits (D-364)
        const conFila = hay && [NEW, POP].some(tieneAtajo);
        // In that row: with its name; with its name and less air; the ⭐ alone
        const formas = hay ? [...(conFila ? [['atajos', false, false], ['atajos', false, true], ['atajos', true, true]] : []), ['fila', false], ['fila', true], ['linea', false]] : [['linea', false]];
        for (const [donde, sola, justa = sola] of formas) {
          if (donde === 'atajos') { if (fav.parentNode !== atajos) atajos.prepend(fav); }
          else if (donde === 'fila') { if (fav.parentNode !== tipos) tipos.prepend(fav); }
          else if (fav.parentNode !== favs) favs.append(fav);
          fav.classList.toggle('sola', sola);
          tipos.classList.toggle('apretada', donde === 'fila' && sola);
          atajos.classList.toggle('apretada', donde === 'atajos' && justa);
          const fila = donde === 'atajos' ? atajos : tipos;
          if (donde === 'linea' || fila.scrollWidth <= fila.clientWidth + 0.5) break;
        }
        favs.hidden = !hay || fav.parentNode !== favs;
        atajos.hidden = ![NEW, POP].some(tieneAtajo) && fav.parentNode !== atajos;
      };
      const aplicar = (primera = false) => {
        for (const b of botones) {
          const on = b.dataset.tipo === filtro.tipo;
          b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        let n = 0;
        for (const t of tarjetas) {
          const ve = caben(t);
          // Las que vuelven a aparecer entran escalonadas desde arriba, no con el retraso de su lugar original
          if (!primera && ve && t.card.hidden) for (const x of [t.card, t.caja.querySelector('.fav')]) if (x) x.style.animationDelay = `${n * 40}ms`;
          t.card.hidden = t.caja.hidden = !ve;
          if (ve) n++;
        }
        acomodarFav();
        const filtrado = !!filtro.tipo || !!busca.ids;
        cuenta.hidden = !filtrado || n === 0;
        cuenta.replaceChildren(el('span', {}, T.shown.replace('{n}', n).replace('{total}', tarjetas.length)),
          el('button', { class: 'link-btn', type: 'button', onClick: limpiar }, T.clearFilters));
        // ?jugadores= era el filtro de cuántos juegan (D-142): un link viejo lo pierde sin ruido.
        // ?tipo= es el nombre de antes de D-214: se reescribe como ?type=
        const url = new URL(location.href);
        for (const k of ['jugadores', 'tipo', 'type']) url.searchParams.delete(k);
        if (filtro.tipo) url.searchParams.set('type', filtro.tipo);
        // Without the empty `=` URLSearchParams adds to flags: `?test&lab`, not `?test=&lab=`
        history.replaceState(history.state, '', url.pathname + url.search.replace(/=(?=&|$)/g, '') + url.hash);
      };
      aplicar(true);
      // The 🔎 search, for everyone (D-403): loaded after the list is drawn, so it never delays it
      import('./assets/js/search.js').then(({ drawSearch }) => {
        Object.assign(busca, drawSearch({ into: caja, lang, games: JUEGOS_PORTADA, pickName: pickLang, onChange: ids => { busca.ids = ids; aplicar(); } }));
      }).catch(e => console.warn('búsqueda:', e));
      // Marcar el primero hace aparecer la ficha; desmarcar estando en Favoritos no saca la tarjeta
      // de la vista (se puede volver a marcar), salvo que ya no quede ninguno: ahí se ven todos
      document.addEventListener('favoritos', () => {
        if (filtro.tipo === FAV && !hayFavoritos()) { filtro.tipo = null; aplicar(); }
        else acomodarFav();
      });
      // Al girar el celular o cuando terminan de cargar las fuentes, puede que ahora quepa (o no)
      let anchoVisto = 0;
      new ResizeObserver(() => { const w = Math.round(caja.clientWidth); if (w !== anchoVisto) { anchoVisto = w; acomodarFav(); } }).observe(caja);
      document.fonts?.ready.then(acomodarFav);
      // Pegados arriba (ver .filtros-barra): la marca invisible de su lugar de siempre dice si se
      // pasó de largo. Al cambiar de tipo estando pegados, la lista vuelve a empezar justo debajo.
      const barra = document.getElementById('filtros-barra');
      const marca = document.getElementById('filtros-marca');
      barra.prepend(el('button', { type: 'button', class: 'barra-titulo', 'aria-label': T.appTitle, onClick: () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }) },
        el('span', { 'aria-hidden': 'true' }, '🎲'), el('span', {}, T.appTitle)));
      // The menu sticks below the space for the title (D-369): it floats once its mark passes that line
      const tope = parseFloat(getComputedStyle(barra).top) || 0;
      new IntersectionObserver(([e]) => barra.classList.toggle('pegada', !e.isIntersecting && e.boundingClientRect.top < tope), { rootMargin: `${-tope}px 0px 0px 0px` }).observe(marca);
      // A short result would not let the page scroll that far, and the menu would drop back to its
      // place on its own (D-371): an empty space under the list keeps it floating, and it shrinks as
      // the player scrolls up, so the menu leaves only then. It never grows on a scroll.
      const relleno = el('div', { class: 'filtros-relleno', 'aria-hidden': 'true' });
      document.getElementById('games').after(relleno);
      const sobra = () => Math.max(0, Math.ceil(window.scrollY + innerHeight - (document.documentElement.scrollHeight - relleno.offsetHeight)));
      window.addEventListener('scroll', () => {
        if (relleno.offsetHeight && sobra() < relleno.offsetHeight) relleno.style.height = `${sobra()}px`;
      }, { passive: true });
      barra.addEventListener('click', e => {
        if (!e.target.closest('button') || e.target.closest('.barra-titulo') || !barra.classList.contains('pegada')) return;
        const tope = parseFloat(getComputedStyle(barra).top) || 0;
        // Rounded up: the page scrolls by whole pixels, and half a pixel short the menu dropped too
        const y = Math.ceil(marca.getBoundingClientRect().top + window.scrollY - tope);
        relleno.style.height = '0px';
        relleno.style.height = `${Math.max(0, Math.ceil(y + innerHeight - document.documentElement.scrollHeight))}px`;
        window.scrollTo({ top: y });
      });
      window.__portada = { get filtro() { return { ...filtro }; }, get visibles() { return tarjetas.filter(t => !t.card.hidden).map(t => t.g.id); }, get favoritos() { return [...marcados]; } };
    } catch (e) { console.warn('filtros del menú:', e); }

    // 2) Decoraciones: si algo falla aquí, el menú sigue funcionando.
    try {
      // Emoji del encabezado: el dado se transforma suavemente en otros emojis festivos cada 3 segundos.
      const heroEmojis = ['🎲', '🍻', '🎯', '🍸', '🎈', '🍣', '🃏', '🎉', '🥳', '🍕', '🎤', '🔢', '🍹', '🕺', '🎊'];
      const heroEl = document.getElementById('hero-emoji');
      let heroIdx = 0;
      // In a season (season.js) its template's emojis take turns with the dice's: 🎃 → 🎲 → 👻 → 🍻 …
      season.then(s => {
        if (!s?.hero?.length) return;
        const mix = heroEmojis.flatMap((e, i) => (i < s.hero.length ? [s.hero[i], e] : [e]));
        heroEmojis.splice(0, heroEmojis.length, ...mix);
        heroEl.textContent = heroEmojis[heroIdx = 0];
      });
      setInterval(() => {
        if (document.hidden) return;
        heroEl.classList.add('out');
        setTimeout(() => { heroIdx = (heroIdx + 1) % heroEmojis.length; heroEl.textContent = heroEmojis[heroIdx]; heroEl.classList.remove('out'); }, 350);
      }, 3000);
      // Mensajes rotativos del pie: uno al azar al cargar, luego uno nuevo cada 10 segundos con fundido.
      // 150 frases por idioma, barajadas en cada carga para que cada visita empiece distinto.
      const msgs = (FRASES[lang] || [T.footer]).slice().sort(() => Math.random() - 0.5);
      const msgEl = document.getElementById('footer-msg');
      let idx = 0;
      msgEl.textContent = msgs[idx];
      if (msgs.length > 1) setInterval(() => {
        if (document.hidden) return;
        msgEl.classList.add('out');
        setTimeout(() => { idx = (idx + 1) % msgs.length; msgEl.textContent = msgs[idx]; msgEl.classList.remove('out'); }, 500);
      }, 10000);
    } catch (e) { console.warn('decoraciones del menú:', e); }
  </script>
