  <style>
    .hero { text-align: center; padding: 28px 0 18px; }
    .hero .emoji { font-size: 3.2rem; display: block; margin-bottom: 6px; }
    .emoji-swap { display: inline-block; transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
    .emoji-swap.out { opacity: 0; transform: scale(0.3) rotate(-40deg); }
    .hero .sub { color: var(--muted); font-weight: 700; margin-top: 10px; }
    .games { display: grid; gap: 14px; margin-top: 10px; container-type: inline-size; }
    .game-card {
      display: grid; grid-template-columns: 64px 1fr auto; column-gap: 14px; align-items: center;
      grid-template-areas: "emoji texto ir" "emoji meta ir";
      text-decoration: none; color: var(--ink);
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius);
      padding: 16px; transition: transform 0.12s, border-color 0.2s;
      animation: slideUp 0.4s ease-out both;
    }
    .game-card:active { transform: scale(0.98); }
    .game-card .emoji {
      font-size: 2.6rem; width: 64px; height: 64px; display: grid; place-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
      border-radius: 18px; grid-area: emoji;
    }
    .game-card .texto { grid-area: texto; align-self: end; }
    .game-card h2 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; }
    .game-card .tag { color: var(--muted); font-size: 0.95rem; margin: 2px 0 6px; }
    .game-card .meta { grid-area: meta; align-self: start; display: flex; flex-wrap: wrap; gap: 6px; }
    .game-card .meta span { font-size: 0.78rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,0.25); white-space: nowrap; }
    .game-card .meta span .unidad { padding: 0; background: none; font: inherit; border-radius: 0; }
    .game-card .go { grid-area: ir; font-family: var(--font-display); font-size: 2rem; color: var(--yellow); }
    /* En una tarjeta angosta (un celular de 360 px, o uno más ancho con la letra agrandada) las
       píldoras no caben al lado del emoji: jugadores y duración se partían en dos líneas. Ahí
       bajan a su propia fila, de borde a borde, y la flecha sigue al lado del nombre. Se mide la
       tarjeta y no la pantalla: el zoom de accesibilidad de Android achica el ancho en px. */
    @container (max-width: 380px) {
      .game-card { grid-template-areas: "emoji texto ir" "meta meta meta"; row-gap: 10px; }
      .game-card .texto { align-self: center; }
      .game-card .tag { margin-bottom: 0; }
    }
    /* `animation: slideUp` anima opacity hasta 1 y con `both` lo deja puesto: sin apagar la
       animación, el opacity: 0.55 de acá quedaba tapado y la tarjeta se veía intacta aunque no
       se pudiera tocar (D-88). */
    .game-card.soon { pointer-events: none; animation: none; }
    /* Se apaga todo menos "Próximamente", que es lo que explica por qué no se abre */
    .game-card.soon .emoji, .game-card.soon .tag, .game-card.soon .meta, .game-card.soon h2 > span:first-child { opacity: 0.55; }
    .game-card.soon .go { visibility: hidden; }
    .game-card h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
    .game-card h2 .proximamente {
      font: 900 0.78rem var(--font-body); letter-spacing: 0; text-transform: none; white-space: nowrap;
      padding: 3px 9px; border-radius: 999px; background: var(--yellow); color: #3a1200;
    }
    /* Filtros (D-142, D-149): el tipo de juego, en fichas que se prenden y se apagan. */
    .filtros { display: grid; gap: 10px; margin-top: 4px; }
    .filtros > * { min-width: 0; }
    .filtros .tipos button {
      min-height: 44px; cursor: pointer; font: 900 0.9rem var(--font-body);
      border-radius: 999px; transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    /* Los tipos van siempre en una fila (D-144): si no caben con el emoji al lado, el emoji sube
       arriba del nombre, como una barra de pestañas. */
    .filtros { container-type: inline-size; }
    .filtros .tipos { display: flex; gap: 8px; justify-content: center; }
    .filtros .tipos button {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
      background: var(--glass); border: 1px solid var(--glass-border); color: var(--ink); padding: 6px 14px;
    }
    @container (max-width: 520px) {
      .filtros .tipos { gap: 6px; }
      .filtros .tipos button { flex: 1 1 auto; flex-direction: column; gap: 0; padding: 6px 6px; border-radius: 18px; font-size: 0.8rem; line-height: 1.15; }
      .filtros .tipos button .ficha-emoji { font-size: 1.15rem; }
    }
    /* A 320 px (284 de caja) las cuatro fichas pedían 299: se salían por la derecha y quedaban
       pegadas al borde, sin el margen de la izquierda (U-11). Menos aire adentro, y cabe. */
    @container (max-width: 300px) {
      .filtros .tipos { gap: 4px; }
      .filtros .tipos button { padding: 6px 3px; }
    }
    .filtros .tipos button.on { background: var(--cyan); border-color: transparent; color: #03302c; }
    .filtros button:active { transform: scale(0.96); }
    .filtros-cuenta { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; align-items: center; color: var(--muted); font-weight: 700; font-size: 0.9rem; margin: 0; min-height: 44px; }
    .filtros-cuenta[hidden] { display: none; }
    /* Una línea que se apaga en las puntas: acá terminan los filtros y empiezan los juegos */
    .filtros-fin { border: 0; height: 1px; margin: 12px 6% 4px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent); }
    /* Al bajar por la lista, los filtros se quedan pegados arriba: cambiar de tipo no obliga a
       volver a subir. Sin fondo mientras están en su lugar; pegados, toman el del sitio. */
    .filtros-barra {
      position: sticky; top: var(--safe-top); z-index: 5;
      margin: 0 -18px; padding: 8px 18px;
    }
    /* El fondo es una sola capa que sube hasta tapar también la franja de la muesca, para que las
       tarjetas no se vean pasar por detrás de la hora: con una capa aparte para la franja, el
       desenfoque no le llegaba y se leían las tarjetas, o quedaba una costura de dos colores (U-12). */
    .filtros-barra::before {
      content: ''; position: absolute; z-index: -1; inset: calc(-1 * var(--safe-top)) 0 0 0;
      border-radius: 0 0 20px 20px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
      background: rgba(21, 7, 38, 0.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 24px rgba(0, 0, 0, 0.35);
    }
    .filtros-barra.pegada::before { opacity: 1; }
    .link-btn { background: none; border: 0; color: var(--yellow); font: 900 0.9rem var(--font-body); text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 6px; }
    .game-card[hidden] { display: none; }
    /* La Copa es otra cosa que una partida: una semana con amigos. Su tarjeta lo dice con un
       degradé que se mueve despacio (dorado, rosa, morado) y un borde dorado, para invitar a armar
       una. Con "reducir movimiento" el degradé queda quieto. */
    .game-card.torneo {
      border-color: rgba(255, 210, 63, 0.55);
      background: linear-gradient(115deg, rgba(255, 210, 63, 0.42), rgba(255, 46, 136, 0.45) 30%, rgba(138, 77, 255, 0.48) 55%, rgba(255, 122, 26, 0.42) 80%, rgba(255, 210, 63, 0.42)) 0% 50% / 300% 300%;
      box-shadow: 0 0 26px rgba(255, 210, 63, 0.25);
      animation: slideUp 0.4s ease-out both, copaFondo 7s ease-in-out infinite alternate;
    }
    .game-card.torneo .tag { color: rgba(255, 255, 255, 0.88); }
    .game-card.torneo .meta span { background: rgba(0, 0, 0, 0.32); }
    @keyframes copaFondo { to { background-position: 100% 50%; } }
    .game-card .meta span.idioma { background: rgba(46, 230, 214, 0.18); }
    footer { margin-top: auto; padding-top: 28px; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .footer-msg { min-height: 3.2em; font-size: 1rem; line-height: 1.5; color: var(--ink); opacity: 0.9; transition: opacity 0.5s ease, transform 0.5s ease; font-weight: 700; }
    .footer-msg.out { opacity: 0; transform: translateY(6px); }
    /* Juego al azar (D-188): el botón bajo la bajada y el dado que rueda sobre la portada */
    .azar-slot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
    .btn-azar {
      display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 22px 8px 16px; cursor: pointer;
      font: 400 1.35rem var(--font-display); letter-spacing: 0.06em; color: #3a1200;
      background: linear-gradient(180deg, #ffe27a, var(--yellow)); border: 0; border-radius: 999px;
      box-shadow: 0 4px 0 #c99a00, 0 8px 22px rgba(255, 210, 63, 0.3); transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-azar:active { transform: translateY(3px); box-shadow: 0 1px 0 #c99a00, 0 4px 12px rgba(255, 210, 63, 0.3); }
    .btn-azar-dado { font-size: 1.5rem; display: inline-block; transition: transform 0.4s; }
    .btn-azar:hover .btn-azar-dado { transform: rotate(-25deg); }
    /* Uno al día (D-230): a la derecha de "Al azar", en una línea, con la racha en una píldora */
    .btn-uad {
      position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 18px; cursor: pointer;
      color: #fff; background: linear-gradient(180deg, #ff5fa5, var(--pink)); border: 0; border-radius: 999px;
      box-shadow: 0 4px 0 #a3104f, 0 8px 22px rgba(255, 46, 136, 0.3); transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-uad:active { transform: translateY(3px); box-shadow: 0 1px 0 #a3104f, 0 4px 12px rgba(255, 46, 136, 0.3); }
    .btn-uad.hecho { color: #05302b; background: linear-gradient(180deg, #7ff5ea, var(--cyan)); box-shadow: 0 4px 0 #149a8f, 0 8px 22px rgba(46, 230, 214, 0.25); }
    .btn-uad-titulo { display: inline-flex; gap: 8px; align-items: center; font: 400 1.25rem/1.1 var(--font-display); letter-spacing: 0.06em; }
    .btn-uad-racha { font: 900 0.8rem/1 var(--font-body); padding: 4px 7px; border-radius: 999px; background: rgba(0, 0, 0, 0.22); white-space: nowrap; }
    .btn-uad-punto {
      position: absolute; top: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--lime); box-shadow: 0 0 0 2px var(--bg2), 0 0 10px var(--lime); animation: uadPulso 1.6s ease-in-out infinite;
    }
    @keyframes uadPulso { 50% { transform: scale(1.3); } }
    /* Al lado del dado (lo elegido): los dos botones se achican para caber en una fila, también a 320 px */
    .azar-slot.con-uad { flex-wrap: nowrap; gap: 8px; }
    .azar-slot.con-uad .btn-azar { flex: 0 1 auto; min-width: 0; gap: 6px; padding: 8px 16px 8px 12px; font-size: clamp(1.05rem, 4.8vw, 1.3rem); white-space: nowrap; }
    .azar-slot.con-uad .btn-azar-dado { font-size: 1.3rem; }
    .azar-slot.con-uad .btn-uad { flex: 0 1 auto; min-width: 0; gap: 6px; padding: 8px 14px 8px 12px; }
    .azar-slot.con-uad .btn-uad-titulo { gap: 6px; font-size: clamp(1.05rem, 4.8vw, 1.3rem); white-space: nowrap; }
    /* En 340 px o menos ("Spiel des Tages" con la racha), todo un poco más apretado */
    @media (max-width: 340px) {
      .azar-slot.con-uad { gap: 6px; }
      .azar-slot.con-uad .btn-azar { padding: 8px 12px 8px 9px; font-size: 0.95rem; gap: 4px; }
      .azar-slot.con-uad .btn-azar-dado { font-size: 1.1rem; }
      .azar-slot.con-uad .btn-uad { padding: 8px 9px; gap: 4px; }
      .azar-slot.con-uad .btn-uad-titulo { font-size: 0.95rem; gap: 4px; }
      .azar-slot.con-uad .btn-uad-racha { padding: 3px 5px; font-size: 0.72rem; }
    }
    /* La otra forma, a prueba en /labs/: una fila de dos tarjetas altas, La Copa y Uno al día */
    .fila-alta { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; }
    .game-card.alta { position: relative; grid-template-columns: 1fr; grid-template-areas: "emoji" "texto" "meta"; row-gap: 8px; align-content: start; justify-items: start; text-align: left; padding: 14px 12px; font: inherit; cursor: pointer; }
    .game-card.alta .emoji { width: 52px; height: 52px; font-size: 2.1rem; border-radius: 15px; }
    .game-card.alta .texto { align-self: start; }
    .game-card.alta h2 { font-size: clamp(1.15rem, 5.4vw, 1.45rem); line-height: 1.05; }
    .game-card.alta .tag { font-size: 0.82rem; line-height: 1.3; margin: 4px 0 0; }
    .game-card.alta .go { display: none; }
    /* Jugadores y duración, en una sola línea: "👥 2–10 jugadores" no cabía al lado de "⏱ 7 días"
       en media fila, así que la palabra se esconde a la vista (el lector de pantalla la lee) */
    .game-card.alta .meta { flex-wrap: nowrap; gap: 5px; }
    .game-card.alta .meta span { font-size: 0.72rem; padding: 3px 7px; }
    .game-card.alta .meta span .unidad { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; padding: 0; }
    @media (max-width: 340px) { .game-card.alta .meta { gap: 4px; } .game-card.alta .meta span { padding: 3px 5px; font-size: 0.68rem; } }
    /* La Copa y Uno al día no son un juego más: el título va en color, dorado y celeste */
    .game-card.torneo h2 > span:first-child, .uad-card h2 > span:first-child {
      background: linear-gradient(180deg, #fff3b0, var(--yellow) 55%, var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35));
    }
    .uad-card h2 > span:first-child { background-image: linear-gradient(180deg, #d9fffb, var(--cyan) 60%, #19b8ab); }
    .uad-card { border-color: rgba(255, 46, 136, 0.6); background: linear-gradient(160deg, rgba(255, 95, 165, 0.42), rgba(138, 77, 255, 0.38)); box-shadow: 0 0 22px rgba(255, 46, 136, 0.22); color: var(--ink); }
    .uad-card.hecho { border-color: rgba(46, 230, 214, 0.6); background: linear-gradient(160deg, rgba(46, 230, 214, 0.32), rgba(138, 77, 255, 0.3)); }
    .uad-card .tag { color: rgba(255, 255, 255, 0.88); }
    .uad-card .meta .uad-card-estado { background: rgba(0, 0, 0, 0.32); white-space: normal; }
    .uad-card .btn-uad-punto { top: 10px; right: 10px; }
    @media (prefers-reduced-motion: reduce) { .btn-uad-punto { animation: none; } }
  </style>

<body>
  <main class="app">
    <div class="topbar" style="justify-content:flex-end"><div class="tools"><div id="lang-slot"></div><span id="sound-slot"></span><a class="icon-btn" id="btn-rankings" href="records/" title="Rankings" aria-label="Rankings" hidden>🏆</a><span id="share-slot"></span></div></div>
    <header class="hero">
      <span class="emoji bounce"><span class="emoji-swap" id="hero-emoji" aria-hidden="true">🎲</span></span>
      <h1 class="display display--xl rainbow" data-i18n="appTitle">Juegos de Salón</h1>
      <p class="sub" data-i18n="appSub">Juegos tradicionales llevados a tu celular para pasar el tiempo solo o con amigos.</p>
      <div class="azar-slot" id="azar-slot"></div>
    </header>

    <div class="filtros-marca" id="filtros-marca" aria-hidden="true"></div>
    <div class="filtros-barra" id="filtros-barra">
      <section class="filtros" id="filtros"></section>
      <p class="filtros-cuenta" id="filtros-cuenta" aria-live="polite" hidden></p>
    </div>
    <hr class="filtros-fin" aria-hidden="true">
    <section class="games" id="games" aria-label="Lista de juegos"></section>

    <footer>
      <p class="footer-msg" id="footer-msg" aria-live="polite">Toma con responsabilidad y con agua a mano. Si manejas, no tomas. 🚕</p>
      <p class="muted">v0.0.0 · <a href="https://github.com/ellokojavi/juegos-de-salon" style="color:inherit" data-i18n="code">código en GitHub</a></p>
    </footer>
  </main>

  <script type="module">
    import { PORTADA, TIPOS, TIPOS_VIEJOS, rangoJugadores } from './assets/js/games.js';
    import { sparkles, el, shareButton, con } from './assets/js/ui.js';
    import { compartirApp, comparteArchivos } from './assets/js/compartir.js';
    import { getLang, langToggle, applyStatic, pickLang, COMMON, homeUrl } from './assets/js/i18n.js';
    import { FRASES } from './assets/js/frases.js';
    import { SFX, soundToggle, initSound } from './assets/js/sound.js';
    import { botonAzar, TEXTOS as AZAR } from './assets/js/azar.js';
    import { trackVisit } from './assets/js/transport/stats.js';
    trackVisit(); // el tráfico del sitio (D-208)
    sparkles();
    initSound();
    document.getElementById('sound-slot').append(soundToggle());
    document.addEventListener('click', e => { if (e.target.closest('.game-card, .lang-toggle button, .filtros button, .link-btn')) SFX.tap(); });
    const lang = getLang();
    document.documentElement.lang = lang;
    const T = COMMON[lang];
    applyStatic(T);
    document.title = `${T.appTitle} 🎲`;
    document.getElementById('lang-slot').append(langToggle());
    // Los rankings (D-212): un botón en la barra, que la portada no tiene espacio para más
    // Mientras estén en el laboratorio, solo en los celulares que los activaron
    import('./assets/js/jugador.js').then(({ rankingsVisibles }) => {
      const b = document.getElementById('btn-rankings');
      for (const k of ['title', 'aria-label']) b.setAttribute(k, T.rk.rankings);
      b.hidden = !rankingsVisibles();
    }).catch(() => {});
    // Compartir la app: la portada del idioma en que se está mirando (D-74), con su tarjeta social
    // como imagen y un texto que dice lo que ella no (D-226)
    const app = compartirApp({ C: T, lang, juegos: PORTADA.filter(g => g.available).length });
    document.getElementById('share-slot').append(shareButton({
      title: app.titulo, text: app.texto, url: homeUrl(lang), label: T.share, imagen: app.imagen,
    }));
    // La imagen se baja antes, y solo donde se va a mandar: al tocar, el menú del sistema tiene que
    // abrirse enseguida (Safari lo niega si el toque quedó atrás)
    if (comparteArchivos()) (window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => app.imagen());

    // El globo que invita a agregar la app a inicio (D-232): sale un rato después, en un celular
    // que todavía no la abre instalada, hasta que lo cierran. Por ahora, en el laboratorio
    import('./assets/js/instalar.js').then(({ globoInstalar }) => globoInstalar({ T, url: homeUrl(lang), tap: () => SFX.tap() })).catch(() => {});

    // 1) Lo importante primero: la lista de juegos, con los de La Copa al final (D-142).
    const list = document.getElementById('games');
    const tarjetas = PORTADA.map((g, i) => {
      const [, max] = rangoJugadores(g.players);
      // Un juego que no está disponible se ve, pero no se abre: sin href, ni con el teclado (C-5)
      const card = el('a', { class: 'game-card' + (g.available ? '' : ' soon') + (g.torneo ? ' torneo' : ''), href: g.available ? g.path : null, 'aria-disabled': g.available ? null : 'true', 'data-id': g.id, style: `animation-delay:${i * 60}ms` },
        el('div', { class: 'emoji' }, el('span', { class: con('', g.emoji) }, g.emoji)),
        el('div', { class: 'texto' },
          // "Próximamente" va pegado al nombre: abajo, entre las píldoras, no se veía
          el('h2', {}, el('span', {}, pickLang(g.name, lang)), !g.available && el('span', { class: 'proximamente' }, T.soon)),
          el('div', { class: 'tag' }, pickLang(g.tagline, lang)),
        ),
        el('div', { class: 'meta' },
          // La palabra va aparte: la tarjeta alta la esconde a la vista para que quepa en una línea
          g.players && el('span', {}, `👥 ${g.players}`, el('span', { class: 'unidad' }, ` ${max === 1 ? T.player : T.players}`)),
          g.duration && el('span', {}, `⏱ ${g.duration} ${g.durationUnit ? pickLang(g.durationUnit, lang) : T.minutes}`),
          // Lo que por ahora se juega solo en español lo dice antes de abrirlo (D-98)
          g.available && g.idiomas && !g.idiomas.includes(lang) && el('span', { class: 'idioma' }, `🇪🇸 ${T.onlySpanish}`),
        ),
        el('div', { class: 'go' }, '›'),
      );
      list.append(card);
      return { g, card };
    });

    // Juego al azar (D-188): sale de las tarjetas que se ven, así respeta el filtro de tipo
    document.getElementById('azar-slot').append(botonAzar({
      lang, candidatos: () => tarjetas.filter(t => !t.card.hidden).map(t => t.g),
    }));
    // Uno al día (D-230): al lado, el juego de hoy, el mismo para todos. Por ahora, en el laboratorio
    // Va al lado del dado (lo que eligió el dueño); la tarjeta de media fila junto a La Copa se
    // puede probar desde /labs/
    import('./assets/js/uno-al-dia.js').then(async ({ unoAlDiaVisible, formaAcceso }) => {
      if (!unoAlDiaVisible() || formaAcceso() === 'no') return;
      import('./assets/js/uno-al-dia-avisos.js').then(Av => Av.globo()).catch(() => {});
      const { botonUnoAlDia, tarjetaUnoAlDia } = await import('./assets/js/uno-al-dia-ui.js');
      const copa = tarjetas.find(t => t.g.torneo)?.card;
      if (formaAcceso() === 'tarjeta' && copa) {
        const fila = el('div', { class: 'fila-alta' });
        copa.replaceWith(fila);
        copa.classList.add('alta');
        fila.append(copa, tarjetaUnoAlDia({ lang, alTocar: () => SFX.tap() }));
      } else {
        const slot = document.getElementById('azar-slot');
        slot.classList.add('con-uad');
        // En la misma fila, los dos con etiqueta corta: "Al azar" y "Uno al día" (decisión del dueño)
        const azar = slot.querySelector('.btn-azar span:last-child');
        if (azar) azar.textContent = (AZAR[lang] || AZAR.es).corto;
        slot.append(botonUnoAlDia({ lang, alTocar: () => SFX.tap() }));
      }
    }).catch(() => {});

    // Filtro por tipo (D-142, D-149): la lista ya es larga. Va en la URL (?type=logic, en inglés
    // como las rutas: D-214), así volver desde un juego lo deja como estaba y un link filtrado se
    // puede compartir. Cuántos juegan no se filtra: cada juego pregunta su modo adentro.
    try {
      const q = new URLSearchParams(location.search);
      const pedido = q.get('type') || TIPOS_VIEJOS[q.get('tipo')];
      const filtro = { tipo: TIPOS[pedido] ? pedido : null };
      const caben = ({ g }) => !filtro.tipo || (g.tipos || []).includes(filtro.tipo);
      const caja = document.getElementById('filtros');
      caja.setAttribute('aria-label', T.filters);
      const tipos = el('div', { class: 'tipos', role: 'group', 'aria-label': T.filters });
      const cuenta = document.getElementById('filtros-cuenta');
      const botones = [];
      // Solo los tipos que tiene algún juego que se puede abrir: así la lista nunca queda vacía
      for (const [id, t] of Object.entries(TIPOS)) {
        if (!PORTADA.some(g => g.available && (g.tipos || []).includes(id))) continue;
        const b = el('button', { type: 'button', 'data-tipo': id, onClick: () => { filtro.tipo = filtro.tipo === id ? null : id; aplicar(); } }, el('span', { class: 'ficha-emoji', 'aria-hidden': 'true' }, t.emoji), el('span', {}, pickLang(t.name, lang)));
        tipos.append(b); botones.push(b);
      }
      caja.append(tipos);
      const limpiar = () => { filtro.tipo = null; aplicar(); };
      const aplicar = (primera = false) => {
        for (const b of botones) {
          const on = b.dataset.tipo === filtro.tipo;
          b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        let n = 0;
        for (const t of tarjetas) {
          const ve = caben(t);
          // Las que vuelven a aparecer entran escalonadas desde arriba, no con el retraso de su lugar original
          if (!primera && ve && t.card.hidden) t.card.style.animationDelay = `${n * 40}ms`;
          t.card.hidden = !ve;
          if (ve) n++;
        }
        const filtrado = !!filtro.tipo;
        cuenta.hidden = !filtrado || n === 0;
        cuenta.replaceChildren(el('span', {}, T.shown.replace('{n}', n).replace('{total}', tarjetas.length)),
          el('button', { class: 'link-btn', type: 'button', onClick: limpiar }, T.clearFilters));
        // ?jugadores= era el filtro de cuántos juegan (D-142): un link viejo lo pierde sin ruido.
        // ?tipo= es el nombre de antes de D-214: se reescribe como ?type=
        const url = new URL(location.href);
        for (const k of ['jugadores', 'tipo', 'type']) url.searchParams.delete(k);
        if (filtro.tipo) url.searchParams.set('type', filtro.tipo);
        history.replaceState(history.state, '', url.pathname + url.search + url.hash);
      };
      aplicar(true);
      // Pegados arriba (ver .filtros-barra): la marca invisible de su lugar de siempre dice si se
      // pasó de largo. Al cambiar de tipo estando pegados, la lista vuelve a empezar justo debajo.
      const barra = document.getElementById('filtros-barra');
      const marca = document.getElementById('filtros-marca');
      new IntersectionObserver(([e]) => barra.classList.toggle('pegada', !e.isIntersecting && e.boundingClientRect.top < 0)).observe(marca);
      barra.addEventListener('click', e => {
        if (!e.target.closest('button') || !barra.classList.contains('pegada')) return;
        const tope = parseFloat(getComputedStyle(barra).top) || 0;
        window.scrollTo({ top: marca.getBoundingClientRect().top + window.scrollY - tope });
      });
      window.__portada = { get filtro() { return { ...filtro }; }, get visibles() { return tarjetas.filter(t => !t.card.hidden).map(t => t.g.id); } };
    } catch (e) { console.warn('filtros del menú:', e); }

    // 2) Decoraciones: si algo falla aquí, el menú sigue funcionando.
    try {
      // Emoji del encabezado: el dado se transforma suavemente en otros emojis festivos cada 3 segundos.
      const heroEmojis = ['🎲', '🍻', '🎯', '🍸', '🎈', '🍣', '🃏', '🎉', '🥳', '🍕', '🎤', '🔢', '🍹', '🕺', '🎊'];
      const heroEl = document.getElementById('hero-emoji');
      let heroIdx = 0;
      setInterval(() => {
        if (document.hidden) return;
        heroEl.classList.add('out');
        setTimeout(() => { heroIdx = (heroIdx + 1) % heroEmojis.length; heroEl.textContent = heroEmojis[heroIdx]; heroEl.classList.remove('out'); }, 350);
      }, 3000);
      // Mensajes rotativos del pie: uno al azar al cargar, luego uno nuevo cada 10 segundos con fundido.
      // 100 frases por idioma, barajadas en cada carga para que cada visita empiece distinto.
      const msgs = (FRASES[lang] || [T.footer]).slice().sort(() => Math.random() - 0.5);
      const msgEl = document.getElementById('footer-msg');
      let idx = 0;
      msgEl.textContent = msgs[idx];
      if (msgs.length > 1) setInterval(() => {
        if (document.hidden) return;
        msgEl.classList.add('out');
        setTimeout(() => { idx = (idx + 1) % msgs.length; msgEl.textContent = msgs[idx]; msgEl.classList.remove('out'); }, 500);
      }, 10000);
    } catch (e) { console.warn('decoraciones del menú:', e); }
  </script>
</body>
</html>
