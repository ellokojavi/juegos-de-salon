<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Línea de Tiempo ⏳ · Juegos de Salón</title>
  <!--
    Sin destello de idioma (D-194): el HTML trae los textos en español y los módulos los cambian
    al cargar. Si el idioma elegido es otro, la página no se pinta hasta que estén puestos: los
    módulos corren antes de DOMContentLoaded. El tope de 1,5 s la muestra igual si algo falla.
  -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* sin almacenamiento: se pinta como siempre */ }
    })();
  </script>
  <!-- generado: og · lo reescribe node tools/release/og.mjs tarjetas -->
  <meta name="description" content="Ubica los hitos en el orden correcto. Seis temáticas, de la historia al fútbol. 1–6 jugadores, 10–20 min. Gratis, sin instalar y sin cuenta.">
  <link rel="canonical" href="https://juegosdesalon.cl/timeline/">

  <meta property="og:site_name" content="Juegos de Salón">
  <meta property="og:url" content="https://juegosdesalon.cl/timeline/">

  <meta property="og:description" content="Ubica los hitos en el orden correcto. Seis temáticas, de la historia al fútbol. 1–6 jugadores, 10–20 min. Gratis, sin instalar y sin cuenta.">

  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">

  <meta name="twitter:image" content="https://juegosdesalon.cl/assets/og/linea-de-tiempo.jpg">
  <meta name="twitter:image:alt" content="Línea de Tiempo: Ubica los hitos en el orden correcto. Seis temáticas, de la historia al fútbol.">
  <!-- /generado -->
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/ranking.css">
  <link rel="stylesheet" href="../assets/css/linea.css">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <script type="module">import '../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">⏳ Línea de Tiempo</span><span id="sound-slot"></span></div>
    </div>

    <section class="screen active" id="screen-intro">
      <div class="intro-hero">
        <span class="icon">⏳</span>
        <h1 class="display display--xl rainbow" data-i18n="title">Línea de Tiempo</h1>
        <p class="lead" data-i18n="lead"></p>
        <div id="lang-slot" style="margin-top:6px"></div>
      </div>
      <div class="stack">
        <details class="panel">
          <summary data-i18n="howTitle">🧭 ¿Cómo se juega?</summary>
          <p class="muted" data-i18n-html="howText"></p>
        </details>
        <div id="resume-slot"></div>
        <div class="modes" id="modes"></div>
        <div class="stack" id="rk-slot"></div>
      </div>
    </section>

    <section class="screen" id="screen-setup">
      <h2 class="display display--lg center" data-i18n="setupTitle"></h2>
      <div class="panel" id="setup-form"></div>
      <div class="form-error" id="setup-error"></div>
      <div class="stack" id="setup-actions"></div>
    </section>

    <section class="screen" id="screen-lobby">
      <h2 class="display display--lg center" data-i18n="lobbyTitle"></h2>
      <div class="panel center" id="lobby-box"></div>
    </section>

    <section class="screen" id="screen-play">
      <div class="status"><div class="who" id="status-who"></div><div class="sub" id="status-sub"></div></div>
      <div class="score" id="score"></div>
      <div class="hand-title"><b id="hand-title"></b><small id="pool-left"></small></div>
      <div class="hand" id="hand"></div>
      <div class="line-wrap" id="line-wrap"><div class="line" id="line"></div></div>
      <div class="place-row" id="place-row"></div>
    </section>

    <!-- Jugar solo: la ⏳ Línea Relámpago de La Copa, montada por cup/games/solo.js (D-142) -->
    <section class="screen" id="screen-solo">
      <div class="solo-top"><b data-i18n="soloTitle"></b><span class="cron" id="solo-cron">0:00</span></div>
      <div id="solo-juego"></div>
    </section>

    <section class="screen" id="screen-solo-result">
      <div class="result-hero">
        <span class="trophy" id="sr-trophy">🏆</span>
        <h2 class="display display--lg" id="sr-title"></h2>
        <div class="puntos"><b id="sr-puntos"></b><small>/100</small></div>
        <p class="lead" id="sr-sub"></p>
        <p class="muted" id="sr-record"></p>
        <div class="tarjeta" id="sr-tarjeta"></div>
      </div>
      <details class="panel replay" id="sr-replay"><summary data-i18n="finalLine"></summary><div class="line" id="sr-line"></div></details>
      <div class="stack" id="sr-actions"></div>
    </section>

    <section class="screen" id="screen-result">
      <div class="result-hero"><span class="trophy" id="result-trophy">🏆</span><h2 class="display display--lg" id="result-title"></h2><p class="lead" id="result-sub"></p><p class="muted" id="result-note" hidden></p></div>
      <div class="panel"><p class="lead center" style="margin-bottom:4px" data-i18n="ranking"></p><ol class="ranking" id="result-ranking"></ol></div>
      <details class="panel replay" id="result-replay"><summary data-i18n="finalLine"></summary><div class="line" id="result-line"></div></details>
      <div class="stack" style="margin-top:14px" id="result-actions"></div>
    </section>
  </main>

  <div id="chat" hidden></div>
  <div class="handoff" id="handoff" hidden></div>
  <div class="cover" id="cover" hidden></div>
  <script type="module">import './game.js';</script>
</body>
</html>
