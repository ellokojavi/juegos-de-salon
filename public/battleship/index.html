<!DOCTYPE html>

  <meta charset="utf-8">

  <meta name="theme-color" content="#150726">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Batalla Naval ⚓ · Juegos de Salón</title>
  <!--
    Sin destello de idioma (D-194): el HTML trae los textos en español y los módulos los cambian
    al cargar. Si el idioma elegido es otro, la página no se pinta hasta que estén puestos: los
    módulos corren antes de DOMContentLoaded. El tope de 1,5 s la muestra igual si algo falla.
  -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* sin almacenamiento: se pinta como siempre */ }
    })();
  </script>
  <!-- generado: og · lo reescribe node tools/release/og.mjs tarjetas -->

  <meta property="og:image:height" content="630">

  <meta property="og:locale" content="es_CL">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">
  <meta property="og:locale:alternate" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Batalla Naval ⚓ · Juegos de Salón">
  <meta name="twitter:description" content="Hunde la flota del rival antes de que hunda la tuya. 1–2 jugadores, 10–20 min. Gratis, sin instalar y sin cuenta.">

  <!-- /generado -->
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/ranking.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">⚓ Batalla Naval</span><span id="sound-slot"></span></div>
    </div>

    <section class="screen active" id="screen-intro">
      <div class="intro-hero">
        <span class="icon">⚓</span>
        <h1 class="display display--xl rainbow" data-i18n="title">Batalla Naval</h1>
        <p class="lead" data-i18n="lead"></p>
        <div id="lang-slot" style="margin-top:6px"></div>
      </div>
      <div class="stack">
        <div class="panel">
          <p class="lead" style="margin-bottom:6px" data-i18n="howTitle"></p>
          <p class="muted" data-i18n-html="howText"></p>
        </div>
        <div id="resume-slot"></div>
        <div class="modes" id="modes"></div>
        <div class="stack" id="rk-slot"></div>
      </div>
    </section>

    <section class="screen" id="screen-setup">
      <h2 class="display display--lg center" data-i18n="setupTitle"></h2>
      <div class="panel" id="setup-form"></div>
      <div class="form-error" id="setup-error"></div>
      <div class="stack" id="setup-actions"></div>
    </section>

    <section class="screen" id="screen-lobby">
      <h2 class="display display--lg center" data-i18n="lobbyTitle"></h2>
      <div class="panel center" id="lobby-box"></div>
    </section>

    <section class="screen" id="screen-place">
      <div class="place-top"><h2 class="display display--md" id="place-title" style="margin:0"></h2><span class="count" id="place-count"></span></div>
      <p class="center muted" id="place-hint" style="margin:0 0 8px;font-size:0.9rem"></p>
      <div id="place-grid"></div>
      <div class="ships" id="place-ships"></div>
      <div class="place-actions" id="place-actions"></div>
      <div id="place-sail"></div>
      <p class="center muted" id="place-status"></p>
    </section>

    <section class="screen" id="screen-play">
      <div class="status"><div class="who" id="status-who"></div><div class="sub" id="status-sub"></div></div>
      <div class="score" id="score"></div>
      <div class="board-title" id="enemy-title"></div>
      <div id="enemy-grid" class="enemy"></div>
      <div class="fire-row" id="fire-row"></div>
      <div class="mine-wrap" id="mine-wrap"></div>
    </section>

    <section class="screen" id="screen-result">
      <div class="result-hero"><span class="trophy" id="result-trophy">🏆</span><h2 class="display display--lg" id="result-title"></h2><p class="lead" id="result-sub"></p></div>
      <div class="panel"><p class="lead center" style="margin-bottom:8px" data-i18n="fleetsWere"></p><div class="fleets" id="result-fleets"></div></div>
      <details class="panel replay" id="result-replay"><summary data-i18n="replayTitle"></summary><div class="shots" id="result-shots"></div></details>
      <div class="stack" style="margin-top:14px" id="result-actions"></div>
    </section>
  </main>

  <div id="chat" hidden></div>
  <div class="handoff" id="handoff" hidden></div>
  <div class="cover" id="cover" hidden></div>
  <script type="module">import './game.js';</script>
</body>
</html>
