<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>El Camaleón 🦎 · Juegos de Salón</title>
  <!-- A lab game (#898): behind the lab's door (D-281) and not indexed -->
  <script src="../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <!--
    Sin destello de idioma (D-194): el HTML trae los textos en español y los módulos los cambian
    al cargar. Si el idioma elegido es otro, la página no se pinta hasta que estén puestos: los
    módulos corren antes de DOMContentLoaded. El tope de 1,5 s la muestra igual si algo falla.
  -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* sin almacenamiento: se pinta como siempre */ }
    })();
  </script>
  <meta name="description" content="Todos saben la palabra secreta menos el camaleón. 3–8 jugadores, un celular.">
  <link rel="manifest" href="../../manifest.webmanifest">
  <script>
    // El manifest del idioma elegido, antes de que el navegador lo lea: cambiarlo después no siempre alcanza (D-222)
    (function () {
      try {
        var l = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('juegos-de-salon:lang') || '').toLowerCase();
        var m = document.querySelector('link[rel="manifest"]');
        if (m && /^(en|pt)$/.test(l)) m.href = m.href.replace(/manifest\.webmanifest$/, 'manifest.' + l + '.webmanifest');
      } catch (_) { /* queda el del español */ }
    })();
  </script>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <script src="../../assets/js/vigia.js"></script>
  <link rel="preload" href="../../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Juegos de Salón">
  <script type="module">import '../../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">🦎 El Camaleón</span><span id="sound-slot"></span></div>
    </div>

    <!-- ============ INTRO ============ -->
    <section class="screen active" id="screen-intro">
      <div class="intro-hero">
        <span class="lizard">🦎</span>
        <h1 class="display display--xl rainbow" data-i18n="title">El Camaleón</h1>
        <p class="lead" data-i18n="lead">Todos saben la palabra secreta menos uno. Descubran al camaleón antes de que se escape.</p>
        <div id="lang-slot" style="margin-top:6px"></div>
      </div>
      <div class="stack">
        <div id="resume-slot"></div>
        <button class="btn btn--yellow" id="btn-go-setup" data-i18n="goSetup">¡Armar la mesa!</button>
        <!-- The rules go after the main action (U-39); the goal first and three points (U-18) -->
        <div class="panel">
          <p class="lead" style="margin-bottom:6px" data-i18n="howTitle">🦎 Cómo se juega</p>
          <ol class="how">
            <li data-i18n="how1"></li>
            <li data-i18n="how2"></li>
            <li data-i18n="how3"></li>
          </ol>
          <p class="muted" style="margin:8px 0 0;font-size:0.9rem" data-i18n="scoring"></p>
        </div>
        <!-- Honest about where it comes from (D-286, D-289) -->
        <p class="muted center credito"><a href="https://bigpotato.co.uk/" target="_blank" rel="noopener" data-i18n="credit">Inspirado en The Chameleon, de Big Potato Games.</a></p>
      </div>
    </section>

    <!-- ============ SETUP ============ -->
    <section class="screen" id="screen-setup">
      <h2 class="display display--lg center" data-i18n="whoPlays">¿Quiénes juegan?</h2>
      <p class="setup-hint" data-i18n="setupHint"></p>
      <div class="players-form" id="players-form"></div>
      <div class="form-error" id="form-error"></div>
      <div class="stack" style="margin-top:8px">
        <button class="btn btn--ghost" id="btn-add-player" data-i18n="addPlayer">+ Agregar jugador</button>
        <button class="btn btn--yellow" id="btn-start" data-i18n="start">¡A jugar!</button>
      </div>
    </section>

    <!-- ============ TOPIC ============ -->
    <section class="screen" id="screen-topic">
      <p class="muted center round-label" id="topic-round"></p>
      <h2 class="display display--lg center" data-i18n="topicTitle">Elige el tema</h2>
      <div class="topics" id="topics"></div>
    </section>

    <!-- ============ CARD (one player at a time) ============ -->
    <section class="screen" id="screen-card">
      <div class="secret-card" id="card-face">
        <div class="card-topic" id="card-topic"></div>
        <div id="card-secret"></div>
        <button class="btn btn--yellow" id="btn-hide-card" data-i18n="hideCard">Listo, tapar</button>
      </div>
    </section>

    <!-- ============ TABLE: clues, vote, guess, result ============ -->
    <section class="screen" id="screen-table">
      <div class="table-head">
        <span class="muted" id="table-round"></span>
        <span class="topic-name" id="table-topic"></span>
      </div>
      <div class="grid" id="grid" data-tablero="palabras"></div>
      <div class="panel step" id="step"></div>
    </section>

    <!-- ============ END ============ -->
    <section class="screen" id="screen-end">
      <div class="finale">
        <span class="lizard">🦎</span>
        <div class="display display--md" id="end-title">—</div>
      </div>
      <div class="panel">
        <p class="lead center" style="margin-bottom:2px" data-i18n="scoreTitle">📊 Puntos</p>
        <ol class="ranking" id="end-ranking"></ol>
      </div>
      <div class="stack">
        <button class="btn btn--yellow" id="btn-again" data-i18n="again">¡Otra partida!</button>
        <button class="btn btn--ghost btn--sm" id="btn-change-players" data-i18n="changePlayers">Cambiar jugadores</button>
        <div id="end-exits"></div>
      </div>
    </section>
  </main>

  <div class="handoff" id="handoff" hidden></div>

  <script type="module">import './game.js';</script>
</body>
</html>
