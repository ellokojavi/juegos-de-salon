<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150726">
  <!-- El laboratorio no se anuncia: no está en el menú ni en los buscadores (D-101), y sin la llave no se entra (D-281) -->
  <script src="../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>El pie de la portada 🎲 · Laboratorio</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <script src="../../assets/js/vigia.js"></script>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    /* A sheet of footer variants for the home page: each frame is the end of the home page (the last
       game card, dimmed) and a footer with the rotating phrase, the options and the version. */
    .pie-hoja { display: grid; gap: 22px; }
    .pie-hoja > h1 { margin: 0; text-align: center; }
    .pie-op h2 { margin: 0; font: 1.5rem var(--font-display); letter-spacing: 0.04em; color: var(--yellow); }
    .pie-op > p { margin: 2px 0 10px; color: var(--muted); font-size: 0.9rem; }
    .pie-op .opinion { font-size: 0.82rem; margin-top: 8px; }
    .marco { border-radius: 22px; overflow: hidden; border: 1px solid var(--glass-border); background: linear-gradient(170deg, #2a0a4a, #150726 60%, #0b1e3f); padding: 14px 14px 18px; }
    .fantasma { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-border); opacity: 0.45; margin-bottom: 8px; }
    .fantasma b { font: 1.3rem var(--font-display); letter-spacing: 0.04em; } .fantasma span { font-size: 2rem; text-align: center; }
    .pie { text-align: center; color: var(--muted); font-size: 0.85rem; padding-top: 22px; }
    .pie .frase { margin: 0; font-weight: 700; line-height: 1.5; transition: opacity 0.5s, transform 0.5s; }
    .pie .frase.out { opacity: 0; transform: translateY(6px); }
    .pie .ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
    .pie .ops > :last-child:nth-child(odd) { grid-column: 1 / -1; }
    .pie .op { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 6px 10px; border-radius: 14px; font: 700 0.8rem/1.25 var(--font-body); text-align: center; text-wrap: balance; cursor: pointer; }
    .pie .ver { margin: 14px 0 0; font-size: 0.75rem; } .pie .ver a { color: inherit; }
    .controles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .controles button { min-height: 44px; }

    /* 1 · Hoy: the footer as it is */
    .v-hoy .frase { color: var(--ink); font-size: 1rem; }
    .v-hoy .regla { display: flex; align-items: center; gap: 10px; margin: 16px 0 -6px; opacity: 0.55; }
    .v-hoy .regla::before, .v-hoy .regla::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
    .v-hoy .op { border: 1px solid rgba(255,255,255,0.12); background: none; color: var(--muted); }
    .v-hoy .op.cafe { border-color: rgba(255,210,63,0.3); }

    /* 2 · Naipe: the phrase is a playing card on the table */
    .v-naipe .carta { position: relative; margin: 4px auto 0; max-width: 300px; background: var(--card); color: var(--card-ink); border-radius: 14px; padding: 26px 26px 24px; transform: rotate(-2deg); box-shadow: 0 10px 24px rgba(0,0,0,0.45); }
    .v-naipe .carta::before, .v-naipe .carta::after { position: absolute; font: 1.05rem/1 var(--font-display); color: var(--red); white-space: pre; text-align: center; }
    .v-naipe .carta::before { content: 'A\A♥'; top: 8px; left: 10px; }
    .v-naipe .carta::after { content: 'A\A♥'; bottom: 8px; right: 10px; transform: rotate(180deg); }
    .v-naipe .frase { font-size: 0.98rem; font-weight: 800; }
    .v-naipe .ops { margin-top: 22px; }
    .v-naipe .op { background: rgba(255,253,247,0.06); border: 1px solid rgba(255,253,247,0.18); color: var(--ink); }
    .v-naipe .op.cafe { border-color: rgba(255,210,63,0.45); }

    /* 3 · Paño verde: the end of the page is the card table's felt */
    .v-pano { margin: 0 -14px -18px; padding: 24px 18px 18px; background: radial-gradient(120% 90% at 50% 0%, #1d6b4c, #0e3b2b 70%); border-top: 3px solid #c9a646; box-shadow: inset 0 0 0 6px rgba(0,0,0,0.12), inset 0 0 0 7px rgba(201,166,70,0.35); color: rgba(255,248,225,0.75); }
    .v-pano .frase { color: #fff8e1; font-size: 1rem; }
    .v-pano .op { background: rgba(0,0,0,0.22); border: 1px dashed rgba(201,166,70,0.55); color: #fff8e1; border-radius: 999px; }
    .v-pano .op.cafe { background: rgba(201,166,70,0.18); border-style: solid; }

    /* 4 · Neón de bar: a sign that glows, the options lit in two colors */
    .v-neon .frase { color: #ffe1f0; font-size: 1.02rem; text-shadow: 0 0 6px rgba(255,46,136,0.85), 0 0 18px rgba(255,46,136,0.45); }
    .v-neon .op { background: rgba(0,0,0,0.25); color: var(--ink); border: 1.5px solid var(--cyan); box-shadow: 0 0 10px rgba(46,230,214,0.35), inset 0 0 8px rgba(46,230,214,0.15); }
    .v-neon .op.cafe { border-color: var(--yellow); box-shadow: 0 0 10px rgba(255,210,63,0.35), inset 0 0 8px rgba(255,210,63,0.15); }
    .v-neon .ver { color: rgba(255,255,255,0.5); }

    /* 5 · Boleto: the footer is a cream ticket with torn edges */
    .v-boleto .ticket { position: relative; background: var(--card); color: #5b4a3a; border-radius: 12px; padding: 20px 18px 16px;
      -webkit-mask: radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
              mask: radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
    .v-boleto .sello { font: 1.05rem var(--font-display); letter-spacing: 0.12em; color: var(--pink-deep); margin: 0 0 6px; }
    .v-boleto .frase { color: var(--card-ink); font-size: 0.98rem; font-weight: 800; }
    .v-boleto .ops { border-top: 2px dashed rgba(91,74,58,0.3); padding-top: 14px; }
    .v-boleto .op { background: none; border: 1.5px solid rgba(26,26,26,0.25); color: var(--card-ink); }
    .v-boleto .op.cafe { background: var(--yellow); border-color: transparent; }
    .v-boleto .ver { color: var(--muted); }

    /* 6 · Atardecer: the night ends in a warm glow, the options in the categories' colors */
    .v-atardecer { margin: 0 -14px -18px; padding: 26px 18px 18px; background: linear-gradient(180deg, transparent, rgba(255,46,136,0.22) 55%, rgba(255,122,26,0.35)); }
    .v-atardecer .frase { color: var(--yellow); font-size: 1.05rem; font-weight: 900; }
    .v-atardecer .op { background: rgba(255,255,255,0.1); border: 0; color: var(--ink); backdrop-filter: blur(6px); }
    .v-atardecer .op .ic { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; vertical-align: middle; margin-right: 2px; }
    .v-atardecer .op.buzon .ic { background: rgba(46,230,214,0.35); } .v-atardecer .op.cafe .ic { background: rgba(255,122,26,0.5); } .v-atardecer .op.extra .ic { background: rgba(157,255,58,0.35); }
    .v-atardecer .ver { color: rgba(255,255,255,0.8); }

    /* 7 · Bocadillo: the phrase is a comic speech bubble that the 🎲 says */
    .v-bocadillo .globo { position: relative; margin: 0 auto 30px; max-width: 320px; background: var(--ink); color: var(--card-ink); border-radius: 22px; padding: 16px 18px; border: 3px solid var(--card-ink); box-shadow: 4px 4px 0 var(--pink); }
    .v-bocadillo .globo::after { content: ''; position: absolute; bottom: -16px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top: 14px solid var(--ink); border-bottom: 0; }
    .v-bocadillo .habla { font-size: 2rem; margin: -18px 0 0; }
    .v-bocadillo .frase { font-size: 0.98rem; font-weight: 800; }
    .v-bocadillo .op { background: var(--glass); border: 1px solid var(--glass-border); color: var(--ink); }
    .v-bocadillo .op.cafe { box-shadow: 3px 3px 0 var(--yellow); border-color: rgba(255,210,63,0.5); }
    .v-bocadillo .op.buzon { box-shadow: 3px 3px 0 var(--cyan); }
    .v-bocadillo .op.extra { box-shadow: 3px 3px 0 var(--lime); }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-volver">‹ Laboratorio</a>
      <div class="tools"><span class="chip">🎲</span></div>
    </div>
    <section class="pie-hoja stack" id="hoja">
      <h1 class="display rainbow">El pie de la portada</h1>
      <p class="lead" style="margin:0;text-align:center">Siete maneras de terminar la portada: la frase que va cambiando, las opciones (💬 y ☕) y la versión. Se ve como al final de la lista de juegos.</p>
      <div class="controles">
        <button type="button" class="btn btn--ghost" id="btn-frase">🔀 Otra frase</button>
        <button type="button" class="btn btn--ghost" id="btn-extra" aria-pressed="false">＋ Una tercera opción</button>
      </div>
    </section>
  </main>
  <script type="module">
    import { FRASES } from '../../assets/js/frases.js';
    import { el } from '../../assets/js/ui.js';

    const VARIANTS = [
      { id: 'hoy', name: '1 · Hoy', lead: 'El pie como está en la portada: frase, una línea con el 🎲 y dos botones delineados.',
        op: 'Ordenado, pero apagado: la frase y los botones se pierden en el morado y el pie no tiene personalidad propia.' },
      { id: 'naipe', name: '2 · Naipe', lead: 'La frase es un as de corazones sobre la mesa, un poco ladeado. Los botones, como hoy pero en crema.',
        op: 'Mi favorita. Dice "juegos de salón" sin explicar nada, la frase se lee mejor (tinta sobre crema) y el naipe es un objeto: no se confunde con una tarjeta de juego.' },
      { id: 'pano', name: '3 · Paño verde', lead: 'El final de la página es el paño de la mesa de cartas, con borde dorado. Los botones son fichas.',
        op: 'Muy de salón y cálido. El verde rompe con la paleta morada: se siente como otro lugar, lo que es bueno para un pie, pero es el cambio más grande.' },
      { id: 'neon', name: '4 · Neón de bar', lead: 'La frase brilla como un letrero rosado; los botones, encendidos en cian y amarillo.',
        op: 'La más fiel a la paleta actual y lo más fácil de llevar. El brillo cansa en frases largas y compite con los juegos.' },
      { id: 'boleto', name: '5 · Boleto', lead: 'Un boleto crema con bordes troquelados: la frase arriba, las opciones bajo una línea punteada.',
        op: 'Muy legible y simpático. El café en amarillo lleno llama mucho la atención: pide más de lo que el sitio quiere pedir.' },
      { id: 'atardecer', name: '6 · Atardecer', lead: 'La página termina en un resplandor rosado y naranja; la frase en amarillo y cada opción con su color.',
        op: 'Bonito y sin objetos nuevos. Pero la frase en amarillo grueso cansa, y el resplandor se pelea con la temporada (el naranjo de Halloween).' },
      { id: 'bocadillo', name: '7 · Bocadillo', lead: 'El 🎲 dice la frase en un globo de cómic, con sombra rosada; los botones con sombra de color.',
        op: 'Lo más divertido: la frase tiene quien la diga. El globo blanco pesa mucho visualmente en una pantalla oscura.' },
    ];

    const frases = (FRASES.es || []).slice().sort(() => Math.random() - 0.5);
    let i = 0;
    const frase = () => frases[i % frases.length] || '';
    let extra = false;

    // The icon goes inside the text, so a long label wraps in two lines and not three
    const op = (cls, ic, label) => el('span', { class: `op ${cls}` }, el('span', {}, el('span', { class: 'ic' }, ic), ' ', label));
    const ops = () => [
      op('buzon', '💬', 'Sugerencias y comentarios'),
      op('cafe', '☕', 'Invítame a un café'),
      ...(extra ? [op('extra', '📲', 'Instalar la app')] : []),
    ];
    const ver = () => el('p', { class: 'ver' }, 'v0.218.20 · ', el('a', { href: 'https://github.com/ellokojavi/juegos-de-salon' }, 'código en GitHub'));
    const p = () => el('p', { class: 'frase' }, frase());

    const BODY = {
      hoy: () => [p(), el('div', { class: 'regla', 'aria-hidden': 'true' }, '🎲'), el('div', { class: 'ops' }, ...ops()), ver()],
      naipe: () => [el('div', { class: 'carta' }, p()), el('div', { class: 'ops' }, ...ops()), ver()],
      pano: () => [p(), el('div', { class: 'ops' }, ...ops()), ver()],
      neon: () => [p(), el('div', { class: 'ops' }, ...ops()), ver()],
      boleto: () => [el('div', { class: 'ticket' }, el('p', { class: 'sello' }, '🎟️ ADMITE UNO'), p(), el('div', { class: 'ops' }, ...ops())), ver()],
      atardecer: () => [p(), el('div', { class: 'ops' }, ...ops()), ver()],
      bocadillo: () => [el('div', { class: 'globo' }, p()), el('p', { class: 'habla', 'aria-hidden': 'true' }, '🎲'), el('div', { class: 'ops' }, ...ops()), ver()],
    };

    const hoja = document.getElementById('hoja');
    const draw = () => {
      hoja.querySelectorAll('.pie-op').forEach(n => n.remove());
      for (const v of VARIANTS) {
        hoja.append(el('section', { class: 'pie-op', id: `pie-${v.id}` },
          el('h2', {}, v.name), el('p', {}, v.lead),
          el('div', { class: 'marco' },
            el('div', { class: 'fantasma', 'aria-hidden': 'true' }, el('span', {}, '🪢'), el('b', {}, 'EL AHORCADO')),
            el('footer', { class: `pie v-${v.id}` }, ...BODY[v.id]())),
          el('p', { class: 'muted opinion' }, `💭 ${v.op}`)));
      }
    };
    draw();

    const swap = () => {
      document.querySelectorAll('.pie .frase').forEach(n => n.classList.add('out'));
      setTimeout(() => { i++; document.querySelectorAll('.pie .frase').forEach(n => { n.textContent = frase(); n.classList.remove('out'); }); }, 500);
    };
    document.getElementById('btn-frase').addEventListener('click', swap);
    document.getElementById('btn-extra').addEventListener('click', e => { extra = !extra; e.currentTarget.setAttribute('aria-pressed', String(extra)); draw(); });
    // Like the home page: a new phrase every 10 seconds
    setInterval(() => { if (!document.hidden) swap(); }, 10000);
  </script>
</body>
</html>
