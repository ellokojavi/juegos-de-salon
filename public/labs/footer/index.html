<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150726">
  <!-- El laboratorio no se anuncia: no está en el menú ni en los buscadores (D-101), y sin la llave no se entra (D-281) -->
  <script src="../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>El pie de la portada 🎲 · Laboratorio</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <script src="../../assets/js/vigia.js"></script>
  <link rel="preload" href="../../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    /* A sheet of footer variants for the home page: each frame is the end of the home page (the last
       game card, dimmed) and a footer with the rotating phrase, the options and the version. */
    .pie-hoja { display: grid; gap: 22px; }
    .pie-hoja > h1 { margin: 0; text-align: center; }
    .pie-op h2 { margin: 0; font: 1.5rem var(--font-display); letter-spacing: 0.04em; color: var(--yellow); }
    .pie-op > p { margin: 2px 0 10px; color: var(--muted); font-size: 0.9rem; }
    .pie-op .opinion { font-size: 0.82rem; margin-top: 8px; }
    .marco { border-radius: 22px; overflow: hidden; border: 1px solid var(--glass-border); background: linear-gradient(170deg, #2a0a4a, #150726 60%, #0b1e3f); padding: 14px 14px 18px; }
    .fantasma { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-border); opacity: 0.45; margin-bottom: 8px; }
    .fantasma b { font: 1.3rem var(--font-display); letter-spacing: 0.04em; } .fantasma span { font-size: 2rem; text-align: center; }
    .pie { text-align: center; color: var(--muted); font-size: 0.85rem; padding-top: 22px; }
    .pie .frase { margin: 0; font-weight: 700; line-height: 1.5; transition: opacity 0.5s, transform 0.5s; }
    .pie .frase.out { opacity: 0; transform: translateY(6px); }
    .pie .ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
    .pie .ops > :last-child:nth-child(odd) { grid-column: 1 / -1; }
    .pie .op { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 6px 10px; border-radius: 14px; font: 700 0.8rem/1.25 var(--font-body); text-align: center; text-wrap: balance; cursor: pointer; }
    .pie .ver { margin: 14px 0 0; font-size: 0.75rem; } .pie .ver a { color: inherit; }
    .controles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .controles button { min-height: 44px; }

    /* 1 · Hoy: the footer as it is */
    .v-hoy .frase { color: var(--ink); font-size: 1rem; }
    .v-hoy .regla { display: flex; align-items: center; gap: 10px; margin: 16px 0 -6px; opacity: 0.55; }
    .v-hoy .regla::before, .v-hoy .regla::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
    .v-hoy .op { border: 1px solid rgba(255,255,255,0.12); background: none; color: var(--muted); }
    .v-hoy .op.cafe { border-color: rgba(255,210,63,0.3); }

    .familia { margin: 18px 0 -8px; font: 1.9rem var(--font-display); letter-spacing: 0.04em; text-align: center; }

    /* Hoy, con color: the same layout, with a warmer phrase and each option in its color */
    .v-hoy-color .frase { color: #fff3d6; font-size: 1.04rem; }
    .v-hoy-color .regla { display: flex; align-items: center; gap: 10px; margin: 16px 0 -6px; }
    .v-hoy-color .regla::before, .v-hoy-color .regla::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,46,136,0.6)); }
    .v-hoy-color .regla::after { transform: scaleX(-1); }
    .v-hoy-color .op { background: rgba(255,255,255,0.04); color: var(--ink); border: 1px solid rgba(46,230,214,0.35); }
    .v-hoy-color .op.cafe { border-color: rgba(255,210,63,0.45); } .v-hoy-color .op.extra { border-color: rgba(157,255,58,0.35); }

    /* Neón de bar: the phrase glows pink, the options are lit in cyan and yellow */
    .v-neon .frase { color: #ffe1f0; font-size: 1.02rem; text-shadow: 0 0 6px rgba(255,46,136,0.85), 0 0 18px rgba(255,46,136,0.45); }
    .v-neon .op { background: rgba(0,0,0,0.25); color: var(--ink); border: 1.5px solid var(--cyan); box-shadow: 0 0 10px rgba(46,230,214,0.35), inset 0 0 8px rgba(46,230,214,0.15); }
    .v-neon .op.cafe { border-color: var(--yellow); box-shadow: 0 0 10px rgba(255,210,63,0.35), inset 0 0 8px rgba(255,210,63,0.15); }
    .v-neon .op.extra { border-color: var(--lime); box-shadow: 0 0 10px rgba(157,255,58,0.3), inset 0 0 8px rgba(157,255,58,0.12); }

    /* Neón, letrero: only a short sign glows; the phrase is plain and calm */
    .v-neon-letrero .letrero { display: inline-block; margin: 0 0 10px; padding: 2px 12px; font: 1.25rem var(--font-display); letter-spacing: 0.12em; color: #ffd9ec; border: 2px solid var(--pink); border-radius: 10px; text-shadow: 0 0 6px var(--pink), 0 0 16px rgba(255,46,136,0.6); box-shadow: 0 0 10px rgba(255,46,136,0.5), inset 0 0 10px rgba(255,46,136,0.35); animation: parpadeo 6s infinite; }
    @keyframes parpadeo { 0%, 92%, 96%, 100% { opacity: 1; } 94% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .v-neon-letrero .letrero { animation: none; } }
    .v-neon-letrero .frase { color: var(--ink); font-size: 1rem; }
    .v-neon-letrero .op { background: none; color: var(--ink); border: 1.5px solid rgba(46,230,214,0.6); }
    .v-neon-letrero .op.cafe { border-color: rgba(255,210,63,0.7); } .v-neon-letrero .op.extra { border-color: rgba(157,255,58,0.6); }

    /* Neón, tubo: the phrase sits inside a glowing pink tube */
    .v-neon-tubo .tubo { border: 2px solid var(--pink); border-radius: 18px; padding: 14px 16px; box-shadow: 0 0 12px rgba(255,46,136,0.55), inset 0 0 12px rgba(255,46,136,0.3); background: rgba(0,0,0,0.2); }
    .v-neon-tubo .frase { color: var(--ink); font-size: 1rem; }
    .v-neon-tubo .op { background: var(--glass); color: var(--ink); border: 1px solid var(--glass-border); }
    .v-neon-tubo .op .ic { filter: drop-shadow(0 0 6px rgba(46,230,214,0.9)); } .v-neon-tubo .op.cafe .ic { filter: drop-shadow(0 0 6px rgba(255,210,63,0.9)); }

    /* Atardecer: the page ends in a warm glow, the options in the categories' colors */
    .v-atardecer, .v-atardecer-violeta, .v-madrugada { margin: 0 -14px -18px; padding: 26px 18px 18px; }
    .v-atardecer { background: linear-gradient(180deg, transparent, rgba(255,46,136,0.22) 55%, rgba(255,122,26,0.35)); }
    .v-atardecer .frase { color: var(--yellow); font-size: 1.05rem; font-weight: 900; }
    .v-atardecer .op, .v-atardecer-violeta .op, .v-madrugada .op { background: rgba(255,255,255,0.1); border: 0; color: var(--ink); backdrop-filter: blur(6px); }
    .pie .op .ic { display: inline-block; }
    .v-atardecer .op .ic, .v-atardecer-violeta .op .ic, .v-madrugada .op .ic { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; vertical-align: middle; margin-right: 2px; }
    .v-atardecer .op.buzon .ic, .v-atardecer-violeta .op.buzon .ic, .v-madrugada .op.buzon .ic { background: rgba(46,230,214,0.35); }
    .v-atardecer .op.cafe .ic, .v-atardecer-violeta .op.cafe .ic, .v-madrugada .op.cafe .ic { background: rgba(255,122,26,0.5); }
    .v-atardecer .op.extra .ic, .v-atardecer-violeta .op.extra .ic, .v-madrugada .op.extra .ic { background: rgba(157,255,58,0.35); }
    /* The color circle sits above the label in every button, so they all line up */
    .v-atardecer .op > span, .v-atardecer-violeta .op > span, .v-madrugada .op > span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .v-atardecer .op .ic, .v-atardecer-violeta .op .ic, .v-madrugada .op .ic { margin-right: 0; }
    .v-atardecer .ver, .v-atardecer-violeta .ver, .v-madrugada .ver { color: rgba(255,255,255,0.8); }

    /* Atardecer violeta: the same glow in the site's own purple and pink, the phrase in white */
    .v-atardecer-violeta { background: linear-gradient(180deg, transparent, rgba(138,77,255,0.28) 50%, rgba(255,46,136,0.32)); }
    .v-atardecer-violeta .frase { color: var(--ink); font-size: 1.04rem; font-weight: 800; }

    /* Madrugada: the night ends in a cold cyan light at the very bottom */
    .v-madrugada { background: linear-gradient(180deg, transparent, rgba(11,30,63,0.7) 50%, rgba(46,230,214,0.22)); }
    .v-madrugada .frase { color: #fff3d6; font-size: 1.04rem; font-weight: 800; }

    /* Bocadillo: the 🎲 says the phrase in a white comic bubble */
    .v-bocadillo .globo { position: relative; margin: 0 auto 30px; max-width: 320px; background: var(--ink); color: var(--card-ink); border-radius: 22px; padding: 16px 18px; border: 3px solid var(--card-ink); box-shadow: 4px 4px 0 var(--pink); }
    .v-bocadillo .globo::after { content: ''; position: absolute; bottom: -16px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top: 14px solid var(--ink); border-bottom: 0; }
    .habla { font-size: 2rem; margin: -18px 0 0; }
    .v-bocadillo .frase, .v-bocadillo-lateral .frase { font-size: 0.98rem; font-weight: 800; }
    .v-bocadillo .op, .v-bocadillo-oscuro .op, .v-bocadillo-lateral .op { background: var(--glass); border: 1px solid var(--glass-border); color: var(--ink); }
    .v-bocadillo .op.cafe, .v-bocadillo-oscuro .op.cafe, .v-bocadillo-lateral .op.cafe { box-shadow: 3px 3px 0 var(--yellow); border-color: rgba(255,210,63,0.5); }
    .v-bocadillo .op.buzon, .v-bocadillo-oscuro .op.buzon, .v-bocadillo-lateral .op.buzon { box-shadow: 3px 3px 0 var(--cyan); }
    .v-bocadillo .op.extra, .v-bocadillo-oscuro .op.extra, .v-bocadillo-lateral .op.extra { box-shadow: 3px 3px 0 var(--lime); }

    /* Bocadillo oscuro: the same bubble in the night's colors, outlined in pink */
    .v-bocadillo-oscuro .globo { position: relative; margin: 0 auto 30px; max-width: 320px; background: #2a0a4a; color: var(--ink); border-radius: 22px; padding: 16px 18px; border: 2px solid var(--pink); box-shadow: 4px 4px 0 rgba(255,46,136,0.45); }
    .v-bocadillo-oscuro .globo::before { content: ''; position: absolute; bottom: -12px; left: 50%; width: 18px; height: 18px; margin-left: -9px; background: #2a0a4a; border-right: 2px solid var(--pink); border-bottom: 2px solid var(--pink); transform: rotate(45deg); }
    .v-bocadillo-oscuro .frase { font-size: 1rem; font-weight: 800; position: relative; }

    /* Pensamiento: the 🎲 thinks the phrase, in a soft cloud with two little bubbles */
    .v-pensamiento .nube { position: relative; margin: 0 auto 34px; max-width: 320px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); border-radius: 30px; padding: 16px 20px; }
    .v-pensamiento .nube::before, .v-pensamiento .nube::after { content: ''; position: absolute; left: 50%; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); }
    .v-pensamiento .nube::before { width: 16px; height: 16px; bottom: -22px; margin-left: -4px; }
    .v-pensamiento .nube::after { width: 9px; height: 9px; bottom: -34px; margin-left: 4px; }
    .v-pensamiento .frase { color: var(--ink); font-size: 1rem; font-style: italic; }
    .v-pensamiento .habla { margin-top: -6px; }
    .v-pensamiento .op { background: none; border: 1px solid rgba(255,255,255,0.16); color: var(--ink); }
    .v-pensamiento .op.cafe { border-color: rgba(255,210,63,0.45); }

    /* Bocadillo al lado: the 🎲 on the left, the bubble beside it, shorter */
    .v-bocadillo-lateral .fila { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; text-align: left; }
    .v-bocadillo-lateral .fila .habla { margin: 0; text-align: center; }
    .v-bocadillo-lateral .globo { position: relative; background: var(--ink); color: var(--card-ink); border-radius: 18px; padding: 12px 14px; border: 3px solid var(--card-ink); box-shadow: 3px 3px 0 var(--pink); }
    .v-bocadillo-lateral .globo::after { content: ''; position: absolute; left: -13px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 11px solid var(--ink); border-left: 0; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-volver">‹ Laboratorio</a>
      <div class="tools"><span class="chip">🎲</span></div>
    </div>
    <section class="pie-hoja stack" id="hoja">
      <h1 class="display rainbow">El pie de la portada</h1>
      <p class="lead" style="margin:0;text-align:center">Doce maneras de terminar la portada, en cuatro familias: la frase que va cambiando, las opciones (💬 y ☕) y la versión. Se ve como al final de la lista de juegos.</p>
      <div class="controles">
        <button type="button" class="btn btn--ghost" id="btn-frase">🔀 Otra frase</button>
        <button type="button" class="btn btn--ghost" id="btn-extra" aria-pressed="false">＋ Una tercera opción</button>
      </div>
    </section>
  </main>
  <script type="module">
    import { FRASES } from '../../assets/js/frases.js';
    import { el } from '../../assets/js/ui.js';

    const VARIANTS = [
      { family: '📏 Hoy', id: 'hoy', name: 'Hoy', lead: 'El pie como está en la portada: frase, una línea con el 🎲 y dos botones delineados.',
        op: 'Ordenado, pero apagado: la frase y los botones se pierden en el morado.' },
      { family: '📏 Hoy', id: 'hoy-color', name: 'Hoy, con color', lead: 'El mismo orden, con la frase en crema, la línea en rosado y cada botón con el borde de su color.',
        op: 'El cambio más chico que se nota: no agrega objetos y el pie gana calidez. Buena base si se quiere algo seguro.' },
      { family: '💡 Neón', id: 'neon', name: 'Neón de bar', lead: 'La frase brilla como un letrero rosado; los botones, encendidos en cian y amarillo.',
        op: 'Llamativo, pero el brillo cansa en frases largas y compite con los juegos.' },
      { family: '💡 Neón', id: 'neon-letrero', name: 'Neón, letrero', lead: 'Solo un letrero corto brilla (y parpadea cada tanto); la frase va tranquila en blanco y los botones, delineados en color.',
        op: 'Mi favorita de las nuevas. El brillo queda en tres palabras, así que la frase se lee bien, y el letrero le da al pie la cara de un bar de juegos.' },
      { family: '💡 Neón', id: 'neon-tubo', name: 'Neón, tubo', lead: 'La frase va dentro de un tubo de neón rosado; los íconos de los botones brillan.',
        op: 'Lindo marco, pero un rectángulo con borde vuelve a parecerse a una tarjeta.' },
      { family: '🌅 Atardecer', id: 'atardecer', name: 'Atardecer', lead: 'La página termina en un resplandor rosado y naranja; la frase en amarillo y cada opción con su color.',
        op: 'Bonito, pero el amarillo grueso cansa y el naranjo se pelea con Halloween.' },
      { family: '🌅 Atardecer', id: 'atardecer-violeta', name: 'Atardecer violeta', lead: 'El mismo resplandor en el morado y rosado del sitio; la frase en blanco.',
        op: 'Arregla lo del atardecer: usa solo colores de la casa y la frase se lee tranquila. Muy elegante, aunque menos juguetón.' },
      { family: '🌅 Atardecer', id: 'madrugada', name: 'Madrugada', lead: 'La noche termina en una luz cian fría abajo; la frase en crema.',
        op: 'Original y calmo, como el final de una noche de juegos. El cian frío puede verse triste.' },
      { family: '💬 Bocadillo', id: 'bocadillo', name: 'Bocadillo', lead: 'El 🎲 dice la frase en un globo de cómic blanco, con sombra rosada; los botones con sombra de color.',
        op: 'Lo más divertido, pero el globo blanco pesa mucho en la pantalla oscura.' },
      { family: '💬 Bocadillo', id: 'bocadillo-oscuro', name: 'Bocadillo oscuro', lead: 'El mismo globo en morado noche, con borde y sombra rosados.',
        op: 'Mi favorita en general. Conserva la gracia (el 🎲 habla), pero ya no encandila. Las sombras de color de los botones lo hacen juguetón sin que parezcan juegos.' },
      { family: '💬 Bocadillo', id: 'pensamiento', name: 'Pensamiento', lead: 'El 🎲 piensa la frase en una nube suave, en cursiva.',
        op: 'Suave y simpático; la cursiva le queda bien a las frases. Algo menos visible que el globo.' },
      { family: '💬 Bocadillo', id: 'bocadillo-lateral', name: 'Bocadillo al lado', lead: 'El 🎲 a la izquierda y el globo blanco a su lado, más bajo.',
        op: 'Ocupa menos alto, pero a 320 px el globo queda angosto y la frase se parte en muchas líneas.' },
    ];

    const frases = (FRASES.es || []).slice().sort(() => Math.random() - 0.5);
    let i = 0;
    const frase = () => frases[i % frases.length] || '';
    let extra = false;

    // The icon goes inside the text, so a long label wraps in two lines and not three
    const op = (cls, ic, label) => el('span', { class: `op ${cls}` }, el('span', {}, el('span', { class: 'ic' }, ic), ' ', label));
    const ops = () => [
      op('buzon', '💬', 'Sugerencias y comentarios'),
      op('cafe', '☕', 'Invítame a un café'),
      ...(extra ? [op('extra', '📲', 'Instalar la app')] : []),
    ];
    const ver = () => el('p', { class: 'ver' }, 'v0.218.20 · ', el('a', { href: 'https://github.com/ellokojavi/juegos-de-salon' }, 'código en GitHub'));
    const p = () => el('p', { class: 'frase' }, frase());

    const ops2 = () => el('div', { class: 'ops' }, ...ops());
    const dado = () => el('p', { class: 'habla', 'aria-hidden': 'true' }, '🎲');
    const BODY = {
      'hoy': () => [p(), el('div', { class: 'regla', 'aria-hidden': 'true' }, '🎲'), ops2(), ver()],
      'hoy-color': () => [p(), el('div', { class: 'regla', 'aria-hidden': 'true' }, '🎲'), ops2(), ver()],
      'neon': () => [p(), ops2(), ver()],
      'neon-letrero': () => [el('p', { class: 'letrero', 'aria-hidden': 'true' }, 'ABIERTO HASTA TARDE'), p(), ops2(), ver()],
      'neon-tubo': () => [el('div', { class: 'tubo' }, p()), ops2(), ver()],
      'atardecer': () => [p(), ops2(), ver()],
      'atardecer-violeta': () => [p(), ops2(), ver()],
      'madrugada': () => [p(), ops2(), ver()],
      'bocadillo': () => [el('div', { class: 'globo' }, p()), dado(), ops2(), ver()],
      'bocadillo-oscuro': () => [el('div', { class: 'globo' }, p()), dado(), ops2(), ver()],
      'pensamiento': () => [el('div', { class: 'nube' }, p()), dado(), ops2(), ver()],
      'bocadillo-lateral': () => [el('div', { class: 'fila' }, dado(), el('div', { class: 'globo' }, p())), ops2(), ver()],
    };

    const hoja = document.getElementById('hoja');
    const draw = () => {
      hoja.querySelectorAll('.pie-op').forEach(n => n.remove());
      let family = '';
      for (const v of VARIANTS) {
        if (v.family !== family) { family = v.family; hoja.append(el('h2', { class: 'familia pie-op' }, family)); }
        hoja.append(el('section', { class: 'pie-op', id: `pie-${v.id}` },
          el('h2', {}, v.name), el('p', {}, v.lead),
          el('div', { class: 'marco' },
            el('div', { class: 'fantasma', 'aria-hidden': 'true' }, el('span', {}, '🪢'), el('b', {}, 'EL AHORCADO')),
            el('footer', { class: `pie v-${v.id}` }, ...BODY[v.id]())),
          el('p', { class: 'muted opinion' }, `💭 ${v.op}`)));
      }
    };
    draw();

    const swap = () => {
      document.querySelectorAll('.pie .frase').forEach(n => n.classList.add('out'));
      setTimeout(() => { i++; document.querySelectorAll('.pie .frase').forEach(n => { n.textContent = frase(); n.classList.remove('out'); }); }, 500);
    };
    document.getElementById('btn-frase').addEventListener('click', swap);
    document.getElementById('btn-extra').addEventListener('click', e => { extra = !extra; e.currentTarget.setAttribute('aria-pressed', String(extra)); draw(); });
    // Like the home page: a new phrase every 10 seconds
    setInterval(() => { if (!document.hidden) swap(); }, 10000);
  </script>
</body>
</html>
