<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0610">
  <!-- El laboratorio no se anuncia: no está en el menú ni en los buscadores (D-101), y sin la llave no se entra (D-281) -->
  <script src="../../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>El tren bala de Tren en Vilo 🚅 · Laboratorio</title>
  <link rel="icon" href="../../../assets/icon.svg" type="image/svg+xml">
  <script src="../../../assets/js/vigia.js"></script>
  <link rel="preload" href="../../../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    .tren-hoja { display: grid; gap: 14px; }
    .tren-hoja h1 { margin: 0; text-align: center; }
    .tren-op { display: grid; gap: 8px; }
    .tren-op h2 { margin: 0; font: 1.4rem var(--font-display); letter-spacing: 0.04em; color: var(--yellow); }
    .tren-op canvas { width: 100%; display: block; border-radius: 14px; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../../" id="btn-volver">‹ Laboratorio</a>
      <div class="tools"><span class="chip">🚅</span></div>
    </div>
    <section class="tren-hoja stack" id="hoja">
      <h1 class="display rainbow">El tren bala</h1>
      <p class="lead" style="margin:0;text-align:center">El mismo tren, en distintos colores. Tiene nariz en las dos puntas: puede ir para cualquier lado.</p>
    </section>
  </main>
  <script type="module">import './sheet.js';</script>
</body>
</html>
