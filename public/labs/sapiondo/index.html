<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Saporín 🐸 · Juegos de Salón</title>
  <!-- A lab game (D-395): behind the lab's door (D-281) and not indexed -->
  <script src="../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <!-- No language flash (D-194): the page waits for the chosen language's texts, 1.5 s at most -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* no storage: it paints as always */ }
    })();
  </script>
  <!-- generated: og · rewritten by node tools/release/og.mjs cards -->
  <meta name="description" content="Cruza la autopista esquivando autos, agarra frutas y haz dash con estilo. Un jugador, 1–2 min. Gratis, sin instalar y sin cuenta.">

  <meta property="og:type" content="website">

  <meta property="og:url" content="https://juegosdesalon.cl/labs/sapiondo/">

  <meta name="twitter:image" content="https://juegosdesalon.cl/assets/og/sapiondo.jpg">
  <meta name="twitter:image:alt" content="Sapiondo: Cruza la autopista esquivando autos, agarra frutas y haz dash con estilo.">
  <!-- /generated -->
  <link rel="manifest" href="../../manifest.webmanifest">
  <script>
    // The chosen language's manifest, before the browser reads it (D-222)
    (function () {
      try {
        var l = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('juegos-de-salon:lang') || '').toLowerCase();
        var m = document.querySelector('link[rel="manifest"]');
        if (m && /^(en|pt)$/.test(l)) m.href = m.href.replace(/manifest\.webmanifest$/, 'manifest.' + l + '.webmanifest');
      } catch (_) { /* the Spanish one stays */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B8%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  <script src="../../assets/js/vigia.js"></script>
  <link rel="preload" href="../../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/ranking.css">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Juegos de Salón">
  <script type="module">import '../../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../../" id="btn-menu" data-i18n="menu">‹ Laboratorio</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">🐸 Saporín</span><span id="sound-slot"></span></div>
    </div>

    <!-- ============ INTRO ============ -->
    <section class="screen stack active" id="screen-intro">
      <div class="intro-hero">
        <div class="sapiondo-logo" aria-hidden="true">🐸</div>
        <h1 class="display display--xl rainbow" data-i18n="title">Saporín</h1>
        <p class="lead" data-i18n="lead"></p>
        <div id="lang-slot"></div>
      </div>
      <div class="stack">
        <div id="resume-slot"></div>
        <div class="seg" id="diff-seg" role="group"></div>
        <div class="modes" id="modes"></div>
        <p class="best-line" id="best-cover" hidden></p>
        <!-- The rules go after the main action (U-39): the goal first and three points (U-18) -->
        <div class="panel">
          <p class="lead" data-i18n="howTitle"></p>
          <ol class="how" id="how"></ol>
        </div>
        <div id="pie" class="pie"></div>
      </div>
    </section>

    <!-- ============ PLAY ============ -->
    <section class="screen" id="screen-play">
      <div class="stage" id="stage" data-tablero="highway" tabindex="0">
        <canvas id="canvas"></canvas>

        <div class="hud">
          <div class="hud-pill hud-left">
            <span id="hud-dist">0/33</span>
            <small id="hud-sector"></small>
            <div class="hud-lives" id="hud-lives">❤️❤️❤️</div>
            <div class="hud-lives" id="hud-dashes">⚡⚡⚡</div>
          </div>
          <div class="hud-center">
            <div class="hud-score" id="hud-score">0</div>
          </div>
          <div class="hud-right">
            <div class="hud-pill">
              <span id="hud-time">0.0s</span>
            </div>
            <button type="button" class="hud-pause" id="btn-pause" aria-label="Pausa">⏸</button>
          </div>
        </div>

        <div class="pause-layer" id="pause-layer" hidden>
          <div class="display display--lg" id="pause-title"></div>
          <p class="muted" id="pause-hint"></p>
        </div>
      </div>
    </section>

    <!-- ============ RESULT (C-19) ============ -->
    <section class="screen stack" id="screen-result">
      <div class="result-hero">
        <div class="sapiondo-logo" aria-hidden="true">🐸</div>
        <div class="display display--md" id="result-title">—</div>
      </div>
      <div class="panel score-card" id="score-card">
        <div class="score-row"><span id="lbl-stat-dist"></span><b id="val-dist">0</b></div>
        <div class="score-row"><span id="lbl-stat-bonus"></span><b id="val-bonus">0</b></div>
        <div class="score-row"><span id="lbl-stat-lives"></span><b id="val-lives">0</b></div>
        <div class="score-row"><span id="lbl-stat-time"></span><b id="val-time">0</b></div>
        <hr class="score-sep">
        <div class="score-row score-total"><span id="lbl-stat-total"></span><b id="val-total">0</b></div>
        <p class="muted score-meta" id="val-meta"></p>
      </div>
      <div class="stack" id="result-actions"></div>
      <div id="result-exits"></div>
      <section class="stack" id="ranking"></section>
    </section>
  </main>

  <script type="module">import './game.js';</script>
</body>
</html>
