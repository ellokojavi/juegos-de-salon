<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150726">
  <!-- El laboratorio no se anuncia: no está en el menú ni en los buscadores (D-101), y sin la llave no se entra (D-281) -->
  <script src="../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>☕ Juegos de Salón</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <script src="../../assets/js/vigia.js"></script>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    /* The support page (support.js): who it is for, what it pays for, one button to Stripe */
    .hero { text-align: center; padding: 6px 0 4px; }
    .hero .icon { font-size: 3.6rem; display: block; }
    .hero h1 { margin: 4px 0; }
    .puntos { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .btn { text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .nota { margin: 0; text-align: center; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="../../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span id="lang-slot"></span></div>
    </div>
    <div class="hero">
      <span class="icon" id="apoyo-icono">☕</span>
      <h1 class="display display--lg rainbow" id="apoyo-titulo"></h1>
    </div>
    <div class="stack" id="apoyo"></div>
  </main>

  <script type="module">
    import { el, sparkles } from '../../assets/js/ui.js';
    import { getLang, langToggle, applyStatic, COMMON } from '../../assets/js/i18n.js';
    import { initSound, SFX } from '../../assets/js/sound.js';
    import { trackVisit } from '../../assets/js/transport/stats.js';
    import { tiene } from '../../assets/js/parametros.js';
    import { PAYMENT_LINK, texts, supportOpened, supportPaid, trackSupport } from '../../assets/js/support.js';
    trackVisit();
    sparkles();
    initSound();
    document.getElementById('lang-slot').append(langToggle());
    const lang = getLang();
    document.documentElement.lang = lang;
    applyStatic(COMMON[lang] || COMMON.es);
    const T = texts(lang);
    document.addEventListener('click', e => { if (e.target.closest('a')) SFX.tap(); });

    // Stripe sends the donor back here with ?thanks (set as the Payment Link's confirmation page)
    const thanks = new URLSearchParams(location.search).has('thanks');
    const caja = document.getElementById('apoyo');
    if (thanks) {
      document.getElementById('apoyo-icono').textContent = '💛';
      document.getElementById('apoyo-titulo').textContent = T.thanksTitle;
      caja.append(
        el('p', { class: 'lead', style: 'text-align:center' }, T.thanks),
        el('a', { class: 'btn btn--yellow', id: 'btn-apoyo-volver', href: '../../' }, T.back));
      // Counted once: a reload of the thank-you page is not another coffee. ?test never counts
      if (!tiene('test')) { supportPaid(); trackSupport('thanks'); }
      history.replaceState(null, '', location.pathname);
    } else {
      document.getElementById('apoyo-titulo').textContent = T.title;
      const pagar = el('a', { class: 'btn btn--yellow', id: 'btn-apoyo-pagar', href: PAYMENT_LINK || '?thanks&test' }, T.pay);
      // Without a link the button only simulates a payment (?test: nothing is counted or remembered)
      if (PAYMENT_LINK) pagar.addEventListener('click', () => trackSupport('pay'));
      caja.append(
        el('p', { class: 'lead', style: 'text-align:center' }, T.lead),
        el('div', { class: 'panel' }, el('ul', { class: 'puntos' }, T.points.map(p => el('li', {}, p)))),
        pagar,
        el('p', { class: 'muted nota' }, PAYMENT_LINK ? T.payNote : T.labNote));
      if (!tiene('test')) { supportOpened(); trackSupport('open'); }
    }
    document.title = `☕ ${thanks ? T.thanksTitle : T.title} · Juegos de Salón`;
  </script>
</body>
</html>
