<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <!-- The lab is not announced: it is not in the menu or the search engines (D-101), and without the key nobody gets in (D-281) -->
  <script src="../../assets/js/labs-puerta.js"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>Aletazo 🐤 · Laboratorio</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <script src="../../assets/js/vigia.js"></script>
  <link rel="preload" href="../../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/ranking.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-volver">‹ Laboratorio</a>
      <div class="tools"><span class="chip">🐤</span><span id="sound-slot"></span></div>
    </div>

    <!-- The stage: a tap anywhere on it flaps; the cover and the result float over it -->
    <section class="escenario" id="escenario" tabindex="0" aria-label="Aletazo">
      <canvas id="lienzo"></canvas>
      <div class="hud" id="hud" hidden>
        <div class="vidas" id="vidas" aria-live="polite"></div>
        <div class="nivel" id="nivel"></div>
        <div class="marcador" id="marcador">0</div>
        <div class="aviso" id="aviso"></div>
      </div>
      <div class="pista" id="pista" hidden></div>

      <div class="capa" id="portada">
        <div class="tarjeta" id="tarjeta-portada">
          <h1 class="titulo-aletazo"><span class="logo" aria-hidden="true">🐤</span><span class="display rainbow">Aletazo</span></h1>
          <p class="lema" id="lema"></p>
          <p class="credito" id="credito"></p>
          <button type="button" class="link-btn como" id="btn-como" aria-expanded="false" aria-controls="pasos"></button>
          <ul class="pasos" id="pasos"></ul>
          <div class="idioma" id="lang-slot"></div>
          <button type="button" class="btn btn--yellow" id="btn-jugar"></button>
          <div class="mejor" id="mejor-portada"></div>
        </div>
      </div>

      <div class="capa" id="resultado" hidden>
        <div class="tarjeta">
          <p class="sello" id="res-sello"></p>
          <div class="score-big" id="res-puntos">0</div>
          <p class="veredicto" id="res-veredicto"></p>
          <div class="mejor" id="res-mejor"></div>
          <button type="button" class="btn btn--yellow" id="btn-otra"></button>
          <div id="res-salidas"></div>
        </div>
      </div>

      <div class="pausa" id="pausa" hidden>
        <div class="display" id="pausa-titulo"></div>
        <div id="pausa-seguir"></div>
      </div>
    </section>
    <!-- The game's ranking and signing in, under the stage (below the fold), like every game played alone (D-212, D-249) -->
    <section class="ranking-aletazo stack" id="ranking"></section>
    <div id="pie" class="pie"></div>
  </main>
  <script type="module">import './game.js';</script>
</body>
</html>
