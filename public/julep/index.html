<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Julepe 🍹 · Juegos de Salón</title>
  <!--
    Sin destello de idioma (D-194): el HTML trae los textos en español y los módulos los cambian
    al cargar. Si el idioma elegido es otro, la página no se pinta hasta que estén puestos: los
    módulos corren antes de DOMContentLoaded. El tope de 1,5 s la muestra igual si algo falla.
  -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* sin almacenamiento: se pinta como siempre */ }
    })();
  </script>
  <!-- generado: og · lo reescribe node tools/release/og.mjs tarjetas -->
  <meta name="description" content="Dices si vas o te pasas. Si vas y no haces dos bazas, te tomas todo el plato. 1–6 jugadores, 15–30 min. Gratis, sin instalar y sin cuenta.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Juegos de Salón">
  <meta property="og:url" content="https://juegosdesalon.cl/julep/">
  <meta property="og:title" content="Julepe 🍹 · Juegos de Salón">
  <meta property="og:description" content="Dices si vas o te pasas. Si vas y no haces dos bazas, te tomas todo el plato. 1–6 jugadores, 15–30 min. Gratis, sin instalar y sin cuenta.">

  <meta property="og:image:type" content="image/jpeg">

  <meta property="og:image:height" content="630">

  <meta property="og:locale" content="es_CL">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">
  <meta property="og:locale:alternate" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Julepe 🍹 · Juegos de Salón">
  <meta name="twitter:description" content="Dices si vas o te pasas. Si vas y no haces dos bazas, te tomas todo el plato. 1–6 jugadores, 15–30 min. Gratis, sin instalar y sin cuenta.">
  <meta name="twitter:image" content="https://juegosdesalon.cl/assets/og/julepe.jpg">
  <meta name="twitter:image:alt" content="Julepe: Dices si vas o te pasas. Si vas y no haces dos bazas, te tomas todo el plato.">
  <!-- /generado -->
  <link rel="manifest" href="../manifest.webmanifest">
  <script>
    // El manifest del idioma elegido, antes de que el navegador lo lea: cambiarlo después no siempre alcanza (D-222)
    (function () {
      try {
        var l = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('juegos-de-salon:lang') || '').toLowerCase();
        var m = document.querySelector('link[rel="manifest"]');
        if (m && /^(en|pt|de)$/.test(l)) m.href = m.href.replace(/manifest\.webmanifest$/, 'manifest.' + l + '.webmanifest');
      } catch (_) { /* queda el del español */ }
    })();
  </script>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/ranking.css">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Juegos de Salón">
  <script type="module">import '../assets/js/instalable.js';</script>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">🍹 Julepe</span><span id="sound-slot"></span></div>
    </div>

    <!-- INTRO -->
    <section class="screen active" id="screen-intro">
      <div class="intro-hero">
        <span class="icon">🍹</span>
        <h1 class="display display--xl rainbow" data-i18n="title">Julepe</h1>
        <p class="lead" data-i18n="lead"></p>
        <p class="muted" data-i18n="leadExplain"></p>
        <div id="lang-slot" style="margin-top:6px"></div>
      </div>
      <div class="stack">
        <div class="panel">
          <p class="lead" style="margin:0 0 6px" data-i18n="beforeTitle">🍹 Antes de partir</p>
          <p class="muted" data-i18n-html="beforeText"></p>
        </div>
        <details class="panel">
          <summary data-i18n="rulesSummary">🍹 ¿Cómo se juega?</summary>
          <ol class="rules-list" id="rules-list"></ol>
        </details>
        <div id="resume-slot"></div>
        <div class="modes" id="modes"></div>
        <div class="stack" id="rk-slot"></div>
      </div>
    </section>

    <!-- CONFIGURACIÓN -->
    <section class="screen" id="screen-setup">
      <h2 class="display display--lg center" data-i18n="whoPlays">¿Quiénes juegan?</h2>
      <p class="setup-hint" data-i18n="setupHint"></p>
      <div class="panel" id="setup-form"></div>
      <div class="form-error" id="setup-error"></div>
      <div class="stack" id="setup-actions"></div>
    </section>

    <!-- SALA (varios celulares) -->
    <section class="screen" id="screen-lobby">
      <h2 class="display display--lg center" data-i18n="lobbyTitle">Sala creada</h2>
      <div class="panel center" id="lobby-box"></div>
    </section>

    <!-- PARTIDA -->
    <section class="screen" id="screen-play">
      <div class="table-top" id="table-top"></div>
      <div class="seats" id="seats"></div>
      <div class="status"><div class="who" id="status-who"></div><div class="sub" id="status-sub"></div></div>
      <div class="trick" id="trick"></div>
      <div class="mine" id="mine"></div>
      <div class="actions-bar" id="actions"></div>
    </section>

    <!-- RESULTADO -->
    <section class="screen" id="screen-result">
      <div class="result-hero"><span class="trophy" id="result-trophy">🏆</span><h2 class="display display--lg" id="result-title"></h2><p class="lead" id="result-sub"></p></div>
      <div class="panel" id="result-board"></div>
      <div class="stack" style="margin-top:14px" id="result-actions"></div>
      <details class="panel replay" id="result-history">
        <summary data-i18n="historyTitle">🍹 Mano por mano</summary>
        <ol class="hist" id="history-list"></ol>
      </details>
    </section>
  </main>

  <div id="chat" hidden></div>
  <div class="handoff" id="handoff" hidden></div>
  <div class="cover" id="cover" hidden></div>
  <script type="module">import './game.js';</script>
</body>
</html>
