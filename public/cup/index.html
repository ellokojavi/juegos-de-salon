<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>La Copa 🏆 · Juegos de Salón</title>
  <!--
    Sin destello de idioma (D-194): el HTML trae los textos en español y los módulos los cambian
    al cargar. Si el idioma elegido es otro, la página no se pinta hasta que estén puestos: los
    módulos corren antes de DOMContentLoaded. El tope de 1,5 s la muestra igual si algo falla.
  -->
  <script>
    (function () {
      try {
        var u = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
        var l = u || localStorage.getItem('juegos-de-salon:lang') || 'es';
        if (l === 'es') return;
        var h = document.documentElement, listo = function () { h.classList.remove('i18n-pendiente'); };
        h.classList.add('i18n-pendiente');
        document.addEventListener('DOMContentLoaded', listo);
        setTimeout(listo, 1500);
      } catch (_) { /* sin almacenamiento: se pinta como siempre */ }
    })();
  </script>
  <!-- generado: og · lo reescribe node tools/release/og.mjs tarjetas -->
  <meta name="description" content="Un torneo de una semana entre amigos, con un juego distinto cada día. 2–10 jugadores, 7 días. Gratis, sin instalar y sin cuenta.">

  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">

<body>
  <main class="app" id="app">
    <div class="topbar">
      <a class="back" href="../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="chip">🏆 La Copa</span><span id="sound-slot"></span></div>
    </div>

    <!-- PORTADA -->
    <section class="screen" id="screen-intro">
      <div class="intro-hero">
        <span class="icon">🏆</span>
        <h1 class="display display--xl rainbow" data-i18n="title">La Copa</h1>
        <p class="lead" data-i18n="lead"></p>
      </div>
      <div class="stack" id="intro-body"></div>
    </section>

    <!-- CREAR -->
    <section class="screen" id="screen-crear">
      <h2 class="display display--lg center" data-i18n="createTitle"></h2>
      <div class="stack" id="crear-body"></div>
    </section>

    <!-- INVITACIÓN / ENTRAR -->
    <section class="screen" id="screen-entrar">
      <div class="stack" id="entrar-body"></div>
    </section>

    <!-- TABLERO DE LA COPA -->
    <section class="screen" id="screen-tablero">
      <div class="stack" id="tablero-body"></div>
    </section>

    <!-- JUGAR UN DÍA -->
    <section class="screen" id="screen-jugar">
      <div class="jugar-head" id="jugar-head"></div>
      <div id="jugar-body"></div>
      <!-- Las reglas del juego, plegadas debajo del tablero (D-133) -->
      <div id="jugar-reglas"></div>
    </section>

    <!-- RESULTADO DEL DÍA -->
    <section class="screen" id="screen-resultado">
      <div class="stack" id="resultado-body"></div>
    </section>

    <!-- ADMINISTRAR -->
    <section class="screen" id="screen-admin">
      <h2 class="display display--md center" data-i18n="adminTitle"></h2>
      <div class="stack" id="admin-body"></div>
    </section>

    <!-- REPORTAR UN PROBLEMA O COMENTAR -->
    <section class="screen" id="screen-reporte">
      <div class="stack" id="reporte-body"></div>
    </section>

    <!-- CARGANDO O ERROR -->
    <section class="screen" id="screen-espera">
      <div class="stack center" id="espera-body"></div>
    </section>
  </main>

  <div class="handoff" id="handoff" hidden></div>
  <div class="cover" id="cover" hidden></div>
  <script type="module">import './game.js';</script>
</body>
</html>
