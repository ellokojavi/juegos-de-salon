<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- "Se vienen cositas": 6 s en bucle con los cuatro juegos que se vienen, sin nombrarlos (render(t) es
     determinista). Una sola escena: una grilla de 2×2 donde cada tablero hace su jugada por turno.
     Se dibuja con construir-video.mjs; abierta sin ?render se mueve sola. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #150726; }
  #t { width: 540px; height: 540px; transform-origin: 0 0; position: relative; overflow: hidden; font-family: 'Nunito', sans-serif; color: #fff;
    background: radial-gradient(circle at 80% 18%, rgba(255, 111, 168, 0.20), transparent 42%),
      radial-gradient(circle at 12% 88%, rgba(46, 230, 214, 0.16), transparent 40%),
      linear-gradient(160deg, #1d0a36, #2a0a4a 55%, #0b1e3f); }
  .p { position: absolute; border-radius: 50%; opacity: 0.35; }
  #titulo { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font: 62px/1 'Bangers'; letter-spacing: 0.03em; white-space: nowrap; }
  #titulo span { background: linear-gradient(90deg, #ffd23f, #ff6fa8, #2ee6d6, #9dff3a); background-size: 100% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0,0,0,0.4)); padding: 0 4px; }
  /* Una sola escena (v2): los cuatro tableros fijos en una grilla de 2×2; cada uno hace su jugada por
     turno, iluminado, mientras los otros esperan apagados */
  #grilla4 { position: absolute; left: 67px; top: 110px; width: 406px; height: 406px; transform-origin: 203px 0; }
  .baldosa { position: absolute; width: 196px; height: 196px; transform-origin: 50% 50%; }
  .esc { position: absolute; left: 0; top: 0; width: 330px; height: 330px; transform-origin: 0 0; }
  .tablero { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; }
  /* Rutas */
  #rutas .tablero { background: #0b0f1a; border: 2px solid rgba(255,255,255,0.14); }
  #rutas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Pintar */
  #pinta .grilla { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap: 5px; }
  .cel { border-radius: 8px; border: 2px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05);
    display: grid; place-items: center; font: 900 18px 'Nunito'; color: rgba(255,255,255,0.75); }
  .cel.lleno { border-color: #ff8fa0; background: #ff3b4f; box-shadow: 0 0 10px rgba(255, 59, 79, 0.55); color: transparent; }
  .cel.lleno.verde { border-color: #b6f07a; background: #5cc02a; box-shadow: 0 0 10px rgba(92, 192, 42, 0.55); }
  /* Números */
  #nums .grilla { position: absolute; inset: 20px 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; align-content: center; }
  .num { aspect-ratio: 1; border-radius: 10px; border: 3px solid; background: rgba(40, 10, 40, 0.75);
    display: grid; place-items: center; font: 900 30px 'Nunito'; color: #fff; }
  .num.sel { background: rgba(255, 210, 63, 0.35); border-color: #ffd23f !important; }
  .boom { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; pointer-events: none; z-index: 4; }
  .boom svg { width: 100%; height: 100%; }
  .boom b { position: absolute; inset: 0; display: grid; place-items: center; font: 34px 'Bangers'; color: #2a0a1a; letter-spacing: 0.04em; transform: rotate(-8deg); }
  .chispa { position: absolute; width: 9px; height: 9px; border-radius: 2px; z-index: 4; }
  /* Loteo · Servicios: lotes iguales, cada uno con su ⚡ y su 💧 */
  #lote .tablero { background: #0b0f1a; border: 2px solid rgba(255,255,255,0.14); }
  .lcel { position: absolute; border-radius: 10px; border: 2px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04); }
  .llote { position: absolute; border-radius: 14px; border: 3px solid rgba(255,255,255,0.75); box-shadow: 0 0 14px rgba(255,255,255,0.18); }
  .licono { position: absolute; display: grid; place-items: center; font-size: 44px; line-height: 1; }
  #lmarco { position: absolute; border-radius: 14px; border: 4px solid #ffd23f; background: rgba(255,210,63,0.14); }
  /* El dedo */
  #dedo { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,0.32);
    border: 3px solid rgba(255,255,255,0.95); box-shadow: 0 4px 14px rgba(0,0,0,0.45); pointer-events: none; z-index: 5; }
  #onda { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px solid #fff; pointer-events: none; z-index: 5; }
  /* El final */
  #pronto { position: absolute; left: 0; right: 0; top: 402px; text-align: center; font: 64px/1 'Bangers'; letter-spacing: 0.06em; color: #ffd23f;
    text-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 24px rgba(255, 210, 63, 0.45); }
  #pie { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 900 20px 'Nunito'; letter-spacing: 0.02em; }
  #pie small { display: block; font: 700 13px 'Nunito'; color: rgba(255,255,255,0.7); margin-top: 3px; }
  #negro { position: absolute; inset: 0; background: #1d0a36; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div id="t">
  <span class="p" style="left:40px;top:120px;width:8px;height:8px;background:#ffd23f"></span>
  <span class="p" style="left:490px;top:260px;width:10px;height:10px;background:#2ee6d6"></span>
  <span class="p" style="left:470px;top:470px;width:6px;height:6px;background:#ff6fa8"></span>
  <span class="p" style="left:60px;top:420px;width:6px;height:6px;background:#9dff3a"></span>
  <div id="titulo"><span>¡Se vienen cositas!</span></div>

  <div id="grilla4">
    <div class="baldosa" id="b-rutas"><div class="esc" id="rutas"><div class="tablero"><svg viewBox="0 0 300 300" id="rsvg"></svg></div></div></div>
    <div class="baldosa" id="b-pinta"><div class="esc" id="pinta"><div class="grilla" id="pgrilla"></div></div></div>
    <div class="baldosa" id="b-nums"><div class="esc" id="nums"><div class="grilla" id="ngrilla"></div></div></div>
    <div class="baldosa" id="b-lote"><div class="esc" id="lote"><div class="tablero" id="ltablero"></div></div></div>
  </div>

  <div id="dedo"></div><div id="onda"></div>
  <div id="pronto">Próximamente</div>
  <p id="pie">juegosdesalon.cl<small>Juegos de Salón</small></p>
  <div id="negro"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const ajustar = () => { $('t').style.transform = `scale(${Math.min(innerWidth, innerHeight) / 540})`; };
  ajustar(); addEventListener('resize', ajustar);
  window.FPS = 30; window.DURATION = 6;
  const clamp = x => Math.max(0, Math.min(1, x));
  const fase = (t, a, b) => clamp((t - a) / (b - a));
  const out = x => 1 - Math.pow(1 - x, 3);
  const inout = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = (tag, at, padre) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); padre?.appendChild(e); return e; };

  // ---------- Rutas: tres líneas de metro en un plano de 3×3; el rectángulo del medio está dado vuelta
  const R = $('rsvg');
  const defs = svg('defs', {}, R);
  const lineas = svg('g', { id: 'lineas' }, defs);
  const LIN = [
    ['#2ee6d6', 'M0 50 C 60 50, 90 40, 110 70 S 170 150, 210 150 S 250 60, 250 0'],
    ['#ffd23f', 'M50 300 C 50 240, 60 200, 100 180 S 190 160, 200 120 S 230 40, 300 50'],
    ['#7ddc3a', 'M0 250 C 70 250, 110 260, 150 230 S 220 200, 300 210'],
  ];
  for (const [c, d] of LIN) svg('path', { d, fill: 'none', stroke: c, 'stroke-width': 11, 'stroke-linecap': 'round' }, lineas);
  const PARADAS = [[110, 70], [210, 150], [100, 180], [200, 120], [150, 230], [250, 214]];
  for (const [x, y] of PARADAS) svg('circle', { cx: x, cy: y, r: 6.5, fill: '#fff', stroke: '#0b0f1a', 'stroke-width': 2.5 }, lineas);
  for (let i = 0; i < 9; i++) {
    const cp = svg('clipPath', { id: 'c' + i }, defs);
    svg('rect', { x: (i % 3) * 100, y: Math.floor(i / 3) * 100, width: 100, height: 100 }, cp);
  }
  const fijas = svg('g', {}, R), giro = svg('g', {}, R);
  for (let i = 0; i < 9; i++) {
    const padre = (i === 4 || i === 5) ? giro : fijas;
    const g = svg('g', { 'clip-path': `url(#c${i})` }, padre);
    svg('use', { href: '#lineas' }, g);
  }
  for (const k of [100, 200]) { svg('line', { x1: k, y1: 0, x2: k, y2: 300, stroke: '#1d2333', 'stroke-width': 2.5 }, R); svg('line', { x1: 0, y1: k, x2: 300, y2: k, stroke: '#1d2333', 'stroke-width': 2.5 }, R); }
  const marco = svg('rect', { x: 102, y: 102, width: 96, height: 96, rx: 8, fill: 'rgba(255,210,63,0.12)', stroke: '#ffd23f', 'stroke-width': 4 }, R);

  // ---------- Pintar: dos cerezas en 7×7, rojas con el tallo verde (como en el modo difícil del juego);
  // las casillas vacías dicen cuántas pintadas tocan
  const CEREZA = ['...GG..', '..G..G.', '.G...G.', '.R...R.', 'RRR.RRR', 'RRR.RRR', '.R...R.'];
  const PG = $('pgrilla'), PCEL = [];
  const esX = (r, c) => /[RG]/.test(CEREZA[r]?.[c] || '');
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
    let n = 0; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if ((dr || dc) && esX(r + dr, c + dc)) n++;
    const e = document.createElement('div'); e.className = 'cel'; e.textContent = esX(r, c) ? '' : (n ? n : '');
    if (CEREZA[r][c] === 'G') e.classList.add('verde');
    PG.appendChild(e); PCEL.push({ e, r, c, x: esX(r, c) });
  }
  // El orden en que se pintan: en serpentina, fila por fila
  const ORDEN = [];
  for (let r = 0; r < 7; r++) { const fila = PCEL.filter(p => p.r === r && p.x); if (r % 2) fila.reverse(); ORDEN.push(...fila); }
  const celCentro = (r, c) => [105 + (c + 0.5) * (330 / 7), 122 + (r + 0.5) * (330 / 7)];

  // ---------- Números: de a pares iguales o que suman 10
  const NUMS = [[9, 4, 6, 2, 8, 5], [1, 7, 3, 9, 2, 6], [8, 2, 5, 4, 1, 3], [6, 9, 5, 7, 8, 2], [3, 1, 4, 2, 9, 7]];
  const BORDE = { 1: '#d63a7a', 9: '#d63a7a', 2: '#3aa6b6', 8: '#3aa6b6', 3: '#d9952e', 7: '#d9952e', 4: '#8fb52e', 6: '#8fb52e', 5: '#e0733a' };
  const NG = $('ngrilla'), NCEL = {};
  NUMS.forEach((fila, r) => fila.forEach((v, c) => { const e = document.createElement('div'); e.className = 'num'; e.textContent = v; e.style.borderColor = BORDE[v]; NG.appendChild(e); NCEL[r + ',' + c] = e; }));
  const nCentro = (r, c) => { const lado = (330 - 5 * 7) / 6; return [105 + c * (lado + 7) + lado / 2, 122 + 165 - (5 * lado + 4 * 7) / 2 + r * (lado + 7) + lado / 2]; };
  const PARES = [{ a: [1, 1], b: [1, 2], ta: 3.38, tb: 3.58 }, { a: [2, 2], b: [3, 2], ta: 3.92, tb: 4.1 }];
  const BOOMS = PARES.map(() => {
    const d = document.createElement('div'); d.className = 'boom';
    d.innerHTML = '<svg viewBox="-50 -50 100 100"><polygon fill="#ffd23f" stroke="#ff6f3a" stroke-width="4" points="' +
      Array.from({ length: 24 }, (_, i) => { const a = i * Math.PI / 12, rr = i % 2 ? 26 : 46; return `${(Math.cos(a) * rr).toFixed(1)},${(Math.sin(a) * rr).toFixed(1)}`; }).join(' ') + '"/></svg><b>¡BOOM!</b>';
    $('t').appendChild(d);
    const ch = Array.from({ length: 12 }, (_, i) => { const s = document.createElement('div'); s.className = 'chispa'; s.style.background = ['#ffd23f', '#ff6fa8', '#2ee6d6', '#9dff3a'][i % 4]; $('t').appendChild(s); return s; });
    return { d, ch };
  });

  const dedo = $('dedo'), onda = $('onda');
  const ponerDedo = (x, y, vis, toque) => {
    dedo.style.left = x + 'px'; dedo.style.top = y + 'px'; dedo.style.opacity = vis;
    dedo.style.transform = `scale(${toque ? 0.82 : 1})`;
  };
  const ponerOnda = (x, y, k) => { onda.style.left = x + 'px'; onda.style.top = y + 'px'; onda.style.opacity = k > 0 && k < 1 ? 1 - k : 0; onda.style.transform = `scale(${1 + 1.4 * k})`; };

  // ---------- Loteo · Servicios: un 4×4 en lotes de 4; tres ya puestos y el dedo dibuja el último (2×2)
  const LT = $('ltablero'), LADO_L = 4, PASO = 330 / LADO_L, MARGEN = 6;
  const LOTES = [   // [f1, c1, f2, c2, color]
    [0, 0, 3, 0, '#ff9fb8'], [0, 1, 1, 2, '#8fd3ff'], [0, 3, 3, 3, '#ffd166'], [2, 1, 3, 2, '#9be58f'],
  ];
  const ICONOS = [[0, 0, '⚡'], [2, 0, '💧'], [0, 1, '💧'], [1, 2, '⚡'], [1, 3, '⚡'], [3, 3, '💧'], [2, 2, '⚡'], [3, 1, '💧']];
  const caja = (f1, c1, f2, c2, m = MARGEN) => ({ left: c1 * PASO + m, top: f1 * PASO + m, width: (c2 - c1 + 1) * PASO - 2 * m, height: (f2 - f1 + 1) * PASO - 2 * m });
  const poner = (e, b) => { for (const k in b) e.style[k] = b[k] + 'px'; return e; };
  for (let f = 0; f < LADO_L; f++) for (let c = 0; c < LADO_L; c++) { const e = document.createElement('div'); e.className = 'lcel'; LT.appendChild(poner(e, caja(f, c, f, c, 4))); }
  const LDIV = LOTES.map(([f1, c1, f2, c2, col]) => { const e = document.createElement('div'); e.className = 'llote'; e.style.background = col; LT.appendChild(poner(e, caja(f1, c1, f2, c2))); return e; });
  const lmarco = document.createElement('div'); lmarco.id = 'lmarco'; LT.appendChild(lmarco);
  for (const [f, c, ic] of ICONOS) { const e = document.createElement('div'); e.className = 'licono'; e.textContent = ic; LT.appendChild(poner(e, caja(f, c, f, c, 0))); }
  const lCentro = (f, c) => [105 + (c + 0.5) * PASO, 122 + (f + 0.5) * PASO];

  // ---------- La grilla de 2×2: cada juego en su baldosa (196 px; el tablero mide 330 y se achica)
  const BAL = 196, ESC = BAL / 330;
  const BALDOSA = { rutas: [0, 0], pinta: [210, 0], nums: [0, 210], lote: [210, 210] };
  // El turno de cada uno: cuándo está iluminado, y cuánto se corre su reloj para que su jugada caiga ahí
  const TURNO = { rutas: [0.4, 1.55, 0], pinta: [1.55, 2.68, 0.42], nums: [2.68, 3.95, 0.58], lote: [3.95, 4.85, 0] };
  const FINAL = 4.85;
  for (const id in BALDOSA) {
    const [x, y] = BALDOSA[id];
    $('b-' + id).style.left = x + 'px'; $('b-' + id).style.top = y + 'px';
    $(id).style.transform = `scale(${ESC})`;
  }
  // Un punto del tablero (en las coordenadas en que se dibujó: el tablero en 105,122 y de 330) a la página
  let G = 1, LUZ = {};
  const aPagina = (id, px, py) => {
    const [bx, by] = BALDOSA[id], z = LUZ[id] || 1;
    let x = bx + 98 + ((px - 105) * ESC - 98) * z, y = by + 98 + ((py - 122) * ESC - 98) * z;
    x = 203 + (x - 203) * G; y = y * G;
    return [67 + x, 110 + y];
  };
  const escala = id => ESC * (LUZ[id] || 1) * G;

  window.render = t => {
    // El título
    const ti = fase(t, 0.05, 0.4);
    $('titulo').style.opacity = clamp(ti * 2);
    $('titulo').style.transform = `scale(${lerp(0.4, 1, back(ti))}) rotate(${(1 - ti) * -6 + Math.sin(t * 3) * 1.2}deg)`;

    // La grilla: entra de a una baldosa; en su turno, cada una se enciende y crece un poco; al final, las
    // cuatro encendidas y la grilla se achica para dejar lugar a "Próximamente"
    const fin = fase(t, FINAL, FINAL + 0.35);
    G = lerp(1, 0.69, out(fin));
    $('grilla4').style.transform = `scale(${G})`;
    Object.keys(BALDOSA).forEach((id, k) => {
      const [a, b] = TURNO[id];
      const entra = out(fase(t, 0.12 + 0.07 * k, 0.4 + 0.07 * k));
      const luz = t >= FINAL ? 1 : clamp(Math.min(fase(t, a - 0.12, a + 0.05), 1 - fase(t, b - 0.08, b + 0.08)));
      const z = 1 + 0.07 * luz * (t < FINAL ? 1 : 1 - fin);
      LUZ[id] = z;
      const e = $('b-' + id);
      e.style.opacity = entra * (t >= FINAL ? lerp(0.45, 1, out(fin)) : lerp(0.45, 1, luz));
      e.style.transform = `scale(${lerp(0.7, 1, entra) * z})`;
      e.style.zIndex = luz > 0.5 ? 2 : 1;
    });
    const tP = t + TURNO.pinta[2], tN = t + TURNO.nums[2];

    // ----- Rutas: el dedo arrastra del centro a la derecha, el rectángulo da media vuelta y todo calza
    const sel = fase(t, 0.55, 0.85), gira = inout(fase(t, 0.92, 1.3));
    const ancho = 96 + 100 * out(sel);
    marco.setAttribute('width', ancho); marco.setAttribute('opacity', t < 0.5 ? 0 : (1 - fase(t, 1.28, 1.42)));
    giro.setAttribute('transform', `rotate(${180 * (1 - gira)} 200 150)`);
    const listo = fase(t, 1.3, 1.5);
    $('rsvg').style.filter = listo > 0 && listo < 1 ? `drop-shadow(0 0 ${8 * Math.sin(Math.PI * listo)}px rgba(255,255,255,0.7)) brightness(${1 + 0.35 * Math.sin(Math.PI * listo)})` : '';
    // ----- Pintar: el dedo recorre las cerezas y cada casilla se pinta al pasar
    const pin = fase(tP, 2.0, 2.85), cuantas = Math.floor(pin * ORDEN.length + 0.001);
    ORDEN.forEach((p, i) => p.e.classList.toggle('lleno', i < cuantas));
    const latido = fase(tP, 2.88, 3.12);
    $('pgrilla').style.transform = `scale(${1 + 0.06 * Math.sin(Math.PI * latido)})`;
    // ----- Números: dos pares estallan
    for (const k in NCEL) { NCEL[k].classList.remove('sel'); NCEL[k].style.opacity = 1; NCEL[k].style.transform = ''; }
    PARES.forEach((p, i) => {
      const ea = NCEL[p.a], eb = NCEL[p.b];
      if (tN >= p.ta && tN < p.tb + 0.02) ea.classList.add('sel');
      const k = fase(tN, p.tb + 0.02, p.tb + 0.3);
      if (tN >= p.tb + 0.02) for (const e of [ea, eb]) { e.style.opacity = 1 - out(k); e.style.transform = `scale(${1 + 0.6 * k})`; }
      const [ax, ay] = nCentro(...p.a), [bx, by] = nCentro(...p.b);
      const [cx, cy] = aPagina('nums', (ax + bx) / 2, (ay + by) / 2), sc = escala('nums') * 1.25;
      const bm = BOOMS[i], kb = fase(tN, p.tb + 0.02, p.tb + 0.42), fuera = t > FINAL;
      bm.d.style.left = cx + 'px'; bm.d.style.top = cy + 'px';
      bm.d.style.opacity = kb > 0 && kb < 1 && !fuera ? (kb < 0.7 ? 1 : (1 - kb) / 0.3) : 0;
      bm.d.style.transform = `scale(${lerp(0.3, 1.1, out(kb)) * sc}) rotate(${-10 + 20 * kb}deg)`;
      bm.ch.forEach((s, j) => {
        const ang = j / bm.ch.length * Math.PI * 2 + i, dist = (30 + 90 * out(kb)) * sc;
        s.style.left = (cx + Math.cos(ang) * dist) + 'px'; s.style.top = (cy + Math.sin(ang) * dist + 60 * kb * kb * sc) + 'px';
        s.style.opacity = kb > 0 && kb < 1 && !fuera ? 1 - kb : 0; s.style.transform = `rotate(${kb * 400 + j * 30}deg)`;
      });
    });
    const tiembla = Math.max(...PARES.map(p => tN >= p.tb + 0.02 ? 1 - fase(tN, p.tb + 0.02, p.tb + 0.25) : 0));
    $('ngrilla').style.transform = tiembla > 0 && t < FINAL ? `translate(${Math.sin(t * 90) * 5 * tiembla}px, ${Math.cos(t * 70) * 4 * tiembla}px)` : '';
    // ----- Loteo: el dedo arrastra de una esquina a la otra del lote que falta; se pinta y el tablero brilla
    const LA = 4.08, LB = 4.45, arr = inout(fase(t, LA, LB));
    const pintado = t >= LB + 0.05;
    LDIV.forEach((e, i) => { e.style.opacity = i < 3 ? 1 : (pintado ? out(fase(t, LB + 0.05, LB + 0.25)) : 0); e.style.transform = i === 3 && pintado ? `scale(${1 + 0.12 * Math.sin(Math.PI * fase(t, LB + 0.05, LB + 0.3))})` : ''; });
    // El marco crece con el dedo, de la primera casilla al lote entero
    if (t >= LA - 0.05 && !pintado) { lmarco.style.opacity = 1; const b0 = caja(2, 1, 2, 1); poner(lmarco, { ...b0, width: b0.width + PASO * arr, height: b0.height + PASO * arr }); }
    else lmarco.style.opacity = 0;
    const brillo = fase(t, LB + 0.15, LB + 0.45);
    LT.style.filter = brillo > 0 && brillo < 1 ? `drop-shadow(0 0 ${10 * Math.sin(Math.PI * brillo)}px rgba(255,255,255,0.7)) brightness(${1 + 0.3 * Math.sin(Math.PI * brillo)})` : '';

    // ----- El dedo, en las coordenadas del tablero del turno y llevado a la página
    let dv = 0, punto = null, tq = false, ondaEn = null, kOnda = 0;
    const [c4x, c4y] = [105 + 165, 122 + 165], [c5x] = [105 + 275];
    if (t >= 0.42 && t < 1.05) {
      dv = clamp(fase(t, 0.42, 0.5)) * (1 - fase(t, 0.95, 1.05));
      punto = ['rutas', lerp(c4x, c5x, out(sel)), c4y]; tq = t > 0.52 && t < 0.9; ondaEn = ['rutas', c4x, c4y]; kOnda = fase(t, 0.52, 0.8);
    } else if (tP >= 1.92 && tP < 2.98) {
      dv = clamp(fase(tP, 1.92, 2.0)) * (1 - fase(tP, 2.88, 2.98));
      const idx = Math.min(ORDEN.length - 1, Math.max(0, pin * ORDEN.length - 0.5)), i0 = Math.floor(idx), f = idx - i0;
      const a = celCentro(ORDEN[i0].r, ORDEN[i0].c), b = celCentro(ORDEN[Math.min(i0 + 1, ORDEN.length - 1)].r, ORDEN[Math.min(i0 + 1, ORDEN.length - 1)].c);
      punto = ['pinta', lerp(a[0], b[0], f), lerp(a[1], b[1], f)]; tq = tP > 2.0 && tP < 2.86;
      ondaEn = ['pinta', ...celCentro(ORDEN[0].r, ORDEN[0].c)]; kOnda = fase(tP, 2.0, 2.25);
    } else if (tN >= 3.28 && tN < 4.3) {
      dv = clamp(fase(tN, 3.28, 3.34)) * (1 - fase(tN, 4.18, 4.3));
      const pts = [[3.28, ...nCentro(1, 1)], [3.38, ...nCentro(1, 1)], [3.5, ...nCentro(1, 2)], [3.58, ...nCentro(1, 2)], [3.8, ...nCentro(2, 2)], [3.92, ...nCentro(2, 2)], [4.02, ...nCentro(3, 2)], [4.3, ...nCentro(3, 2)]];
      let x = pts[0][1], y = pts[0][2];
      for (let i = 0; i < pts.length - 1; i++) if (tN >= pts[i][0] && tN <= pts[i + 1][0]) { const k = inout(fase(tN, pts[i][0], pts[i + 1][0])); x = lerp(pts[i][1], pts[i + 1][1], k); y = lerp(pts[i][2], pts[i + 1][2], k); }
      punto = ['nums', x, y];
      const toque = PARES.flatMap(p => [p.ta, p.tb]).find(v => tN >= v && tN < v + 0.25);
      tq = toque !== undefined && tN < toque + 0.1;
      if (toque !== undefined) { ondaEn = ['nums', x, y]; kOnda = fase(tN, toque, toque + 0.25); }
    } else if (t >= 3.98 && t < LB + 0.25) {
      dv = clamp(fase(t, 3.98, 4.05)) * (1 - fase(t, LB + 0.1, LB + 0.25));
      const [ax, ay] = lCentro(2, 1), [bx, by] = lCentro(3, 2);
      punto = ['lote', lerp(ax, bx, arr), lerp(ay, by, arr)]; tq = t > LA && t < LB;
      ondaEn = ['lote', ax, ay]; kOnda = fase(t, LA, LA + 0.25);
    }
    if (punto) { const [x, y] = aPagina(...punto); ponerDedo(x, y, dv, tq); } else ponerDedo(0, 0, 0, false);
    if (ondaEn && kOnda > 0) { const [x, y] = aPagina(...ondaEn); ponerOnda(x, y, kOnda); } else ponerOnda(0, 0, 0);

    // ----- El final: los cuatro encendidos, "Próximamente" y el sitio
    const pr = fase(t, FINAL + 0.15, FINAL + 0.4);
    $('pronto').style.opacity = clamp(pr * 2);
    $('pronto').style.transform = `scale(${lerp(2.2, 1, out(pr))}) rotate(${lerp(-12, -3, out(pr)) + (pr >= 1 ? Math.sin(t * 6) * 1.2 : 0)}deg)`;
    $('pie').style.opacity = clamp(fase(t, FINAL + 0.35, FINAL + 0.6));
    // Fundido al color del fondo al principio y al final, para que se repita en bucle sin salto
    $('negro').style.opacity = Math.max(1 - fase(t, 0, 0.12), fase(t, 5.78, 6.0));
  };
  window.render(0);
  if (!location.search.includes('render')) {
    const ini = performance.now(); const loop = () => { window.render(((performance.now() - ini) / 1000) % window.DURATION); requestAnimationFrame(loop); }; loop();
  }
})();
