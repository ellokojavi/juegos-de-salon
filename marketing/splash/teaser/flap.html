<!doctype html>
<!--
  The teaser of flap for the splash (D-351), on the teaser engine (_teaser.js, TEASERS.md) with the
  game's own scene (public/labs/flap/scene.js): the bird glides calmly over the city from day,
  over the sea in the afternoon, into the night under the moon and back to day, in a seamless loop. No hoops, walls, flaps of play or score.
  Made by `node marketing/splash/teaser.mjs new flap labs/flap`.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teaser · flap</title>
<style>
  body { margin: 0; background: #14081f; display: grid; place-items: center; min-height: 100vh; }
  .marco { position: relative; width: 512px; height: 320px; }
  .marco canvas { position: absolute; inset: 0; width: 512px; height: 320px; }
</style>
</head>
<body>
<div class="marco"><canvas id="fondo"></canvas><canvas id="juego"></canvas></div>
<script type="module">
import { teaser, beats, W, H } from './_teaser.js';
// The game's own scene (TEASERS.md, rule 1), in its loop mode: over the clip every layer of the city
// moves by whole repeats and every flicker runs whole cycles, so the end leads into the start unseen
import { newGame, SKY_EVERY } from '../../../public/labs/flap/engine.js';
import { escena } from '../../../public/labs/flap/scene.js';

const SECONDS = 24, FPS = 30, FRAMES = SECONDS * FPS;
const SCROLL = 13.2;  // how far the city scrolls in one loop: about the game's first-level speed
// The story (the owner's request): day, the sea in the afternoon, the night and day again, endlessly.
// The sky index keeps rising (3 is day again in the scene's cycle), so night eases into day
const STORY = [[0, 'day'], [5.2, 'afternoon'], [11.6, 'night'], [17.2, 'day again']];
const SKY = { day: 0, afternoon: 1, night: 2, 'day again': 3 };

// The bird's sparkle trail is random: the same seed every loop, and a first loop played unseen, so
// the sparkles at the start are the ones the end left
let seed = 1;
Math.random = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

function fly(s, i) {
  const t = i / FPS, g = s.g, dt = 1 / FPS, b = g.bird;
  if (i === 0) seed = 1;
  g.clock = t;
  g.scroll = (t / SECONDS) * SCROLL;
  g.score = SKY[beats(STORY, t, SECONDS).name] * SKY_EVERY;
  // A calm glide, four slow waves a loop, and a wing beat every second and a half
  const w = (2 * Math.PI * 4) / SECONDS;
  b.y = 0.45 + Math.sin(t * w) * 0.05; b.vy = Math.cos(t * w) * 0.05 * w;
  b.rot = Math.max(-0.12, Math.min(0.12, b.vy * 1.5));
  b.flapT = i % 45 === 0 ? 1 : Math.max(0, b.flapT - dt / 0.2);
  s.sc.tick(dt, g);
  s.sc.draw(g);
}

teaser({
  seconds: SECONDS,
  fps: FPS,
  loop: true,
  setup(canvas) {
    const sc = escena(canvas, { loop: { scroll: SCROLL, seconds: SECONDS } });
    const w = sc.measure();
    const g = newGame({ W: w, mode: 'glide', random: () => 0.5 });
    g.bird.x = w * 0.36;
    const s = { sc, g };
    for (let i = 0; i < FRAMES; i++) fly(s, i);   // the unseen first loop
    return s;
  },
  // The scene paints its own sky: behind it, the app's night
  background(ctx) {
    ctx.fillStyle = '#14081f'; ctx.fillRect(0, 0, W, H);
  },
  draw(s, t) { fly(s, Math.round(t * FPS)); },
});
</script>
</body>
</html>
