<!doctype html>
<!--
  🐤 Aletazo's launch clip for the splash `aletazo-ya` (the owner's request, 2026-11-08: a loop seamless to
  the pixel, through the times of day). On the teaser engine (_teaser.js, TEASERS.md) with the game's own
  engine and scene (public/cup/games/flap/), in the scene's loop mode: over the clip the city moves by
  whole repeats and every flicker runs whole cycles, and the course is periodic too, twelve gates that
  come back exactly where they started, so the last frame leads into the first.
  The bird flies through every hoop dead center, a hop of a flap at a time; the sky goes from day to the
  afternoon over the sea, to the night and back to day. Not a teaser (it shows the play: the game is out),
  but made the same way. Recorded with `node marketing/splash/teaser.mjs flap-play`.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clip · flap-play</title>
<style>
  body { margin: 0; background: #14081f; display: grid; place-items: center; min-height: 100vh; }
  .marco { position: relative; width: 512px; height: 320px; }
  .marco canvas { position: absolute; inset: 0; width: 512px; height: 320px; }
</style>
</head>
<body>
<div class="marco"><canvas id="fondo"></canvas><canvas id="juego"></canvas></div>
<script type="module">
import { teaser, beats } from './_teaser.js';
import { newGame, SKY_EVERY, NEON } from '../../../public/cup/games/flap/engine.js';
import { escena } from '../../../public/cup/games/flap/scene.js';

const SECONDS = 24, FPS = 30, FRAMES = SECONDS * FPS;
const N = 12, GAP = 1.1, SCROLL = N * GAP;   // twelve gates a loop, at the first level's pace (0.55 a second)
const SPEED = SCROLL / SECONDS, T_GAP = GAP / SPEED;   // 2 s between gates
const HOPS = 4;                                       // flaps between two gates
// The hoops' heights, and which are a hoop set in a wall or a bare gap: twelve, so the colors (six) repeat too
const Y = [0.45, 0.36, 0.5, 0.6, 0.48, 0.32, 0.42, 0.58, 0.66, 0.5, 0.38, 0.47];
const KIND = ['', '', 'wall', '', '', 'bare', '', '', 'wall', '', '', ''];
// The story: day, the sea in the afternoon, the night and day again (3 is day in the scene's cycle)
const STORY = [[0, 'day'], [5.2, 'afternoon'], [11.6, 'night'], [17.2, 'day again']];
const SKY = { day: 0, afternoon: 1, night: 2, 'day again': 3 };

// The sparkles are random: the same seed every loop, and a first loop played unseen, so those at the
// start are the ones the end left
let seed = 1;
Math.random = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const mod = (a, n) => ((a % n) + n) % n;
const smooth = k => k * k * (3 - 2 * k);

/** Where the bird is at time t: through gate k's middle at t = 1 + 2k, hopping (a flap, then a fall) between. */
function birdAt(t) {
  const u = mod(t - 1, SECONDS) / T_GAP, k = Math.floor(u), s = u - k;
  const y0 = Y[k % N], y1 = Y[(k + 1) % N];
  const base = y0 + (y1 - y0) * smooth(s);
  const h = mod(s * HOPS, 1);                         // where in its hop
  return { y: base - 0.045 * Math.sin(Math.PI * h) * (1 - h * 0.35), hop: Math.floor(s * HOPS) };
}

function fly(s, i) {
  const t = i / FPS, g = s.g, dt = 1 / FPS, b = g.bird;
  if (i === 0) seed = 1;
  g.clock = t;
  g.scroll = (t / SECONDS) * SCROLL;
  g.score = SKY[beats(STORY, t, SECONDS).name] * SKY_EVERY;
  const now = birdAt(t), next = birdAt(t + dt);
  b.y = now.y; b.vy = (next.y - now.y) / dt;
  b.rot = Math.max(-0.45, Math.min(0.6, b.vy * 0.55));
  if (now.hop !== s.hop) { s.hop = now.hop; b.flapT = 1; s.sc.fx({ type: 'flap' }, g); }
  else b.flapT = Math.max(0, b.flapT - dt / 0.2);
  // The gates: gate k is at the bird at t = 1 + 2k, every loop; drawn with its copies a loop either side
  g.gates = [];
  for (let k = 0; k < N; k++) for (const m of [-1, 0, 1]) {
    const tc = 1 + T_GAP * k + m * SECONDS;
    const x = b.x + (tc - t) * SPEED;
    if (x < -0.4 || x > g.W + 0.6) continue;
    const passed = t >= tc, since = t - tc;
    g.gates.push({ x, y: Y[k], baseY: Y[k], r: KIND[k] === 'bare' ? 0.13 : 0.15, amp: 0, color: NEON[k % NEON.length],
      wall: !!KIND[k], bare: KIND[k] === 'bare', done: passed, hit: false, ok: passed ? (KIND[k] === 'bare' ? 1 : 2) : 0,
      flash: passed ? Math.max(0, 1 - since * 2) : 0 });
  }
  // The crossing celebrates as in the game: dead center through a hoop, a plain pass through a bare gap
  const k = Math.round((t - 1) / T_GAP);
  if (k >= 0 && k < N && Math.abs(t - (1 + T_GAP * k)) < dt / 2) {
    s.sc.fx({ type: KIND[k] === 'bare' ? 'pass' : 'perfect', x: b.x, y: Y[k], color: KIND[k] === 'bare' ? '#2ee6d6' : NEON[k % NEON.length] }, g);
  }
  s.sc.tick(dt, g);
  s.sc.draw(g);
}

teaser({
  seconds: SECONDS,
  fps: FPS,
  loop: true,
  setup(canvas) {
    const sc = escena(canvas, { loop: { scroll: SCROLL, seconds: SECONDS } });
    const w = sc.measure();
    const g = newGame({ W: w, mode: 'play', random: () => 0.5 });
    g.gates = []; g.spikes = []; g.bird.x = w * 0.3;
    const s = { sc, g, hop: -1 };
    for (let i = 0; i < FRAMES; i++) fly(s, i);   // the unseen first loop
    return s;
  },
  background(ctx) { ctx.fillStyle = '#14081f'; ctx.fillRect(0, 0, 512, 320); },
  draw(s, t) { fly(s, Math.round(t * FPS)); },
});
</script>
</body>
</html>
