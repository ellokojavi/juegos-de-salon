<!doctype html>
<!--
  The teaser of 🥷 Stick Ninja for the splash (D-351), on the teaser engine (_teaser.js, TEASERS.md)
  with the game's own scene (public/labs/stick/scene.js): under the night's moon the ninja dashes to
  the edge of its pillar and stops there, looking across the gap at the next one, and stays. No stick
  grows or falls: the play is not given away (TEASERS.md, rule 2).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teaser · Stick Ninja</title>
<style>
  body { margin: 0; background: #14081f; display: grid; place-items: center; min-height: 100vh; }
  .marco { position: relative; width: 512px; height: 320px; }
  .marco canvas { position: absolute; inset: 0; width: 512px; height: 320px; }
</style>
</head>
<body>
<div class="marco"><canvas id="fondo"></canvas><canvas id="juego"></canvas></div>
<script type="module">
import { teaser, W, H } from './_teaser.js';
import { newGame, current, restX } from '../../../public/labs/stick/engine.js';
import { escena } from '../../../public/labs/stick/scene.js';

const SEED = 7, RUN_AT = 1.2;   // when the ninja dashes to the edge (seconds)

teaser({
  setup(canvas) {
    const sc = escena(canvas, { compacto: true });
    const g = newGame(SEED, 0); sc.empezar(g);
    // The ninja starts back from the edge and runs to it, with no stick: a walk of the game's own, its
    // stick 0 long, that is never advanced, so it stops at the edge and stays
    const cur = current(g);
    g.stick = 0; g.phase = 'walking';
    g.walk = { t0: RUN_AT * 1000, from: cur.x + 14, to: restX(cur), kind: 'land', tip: cur.x + cur.w, ok: true, done: false };
    return { g, sc };
  },
  // The app's night behind the transparent scene, as the game's page has it
  background(ctx) {
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#3a1450'); gr.addColorStop(0.55, '#1f0c3c'); gr.addColorStop(1, '#170a2e');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  },
  draw: ({ g, sc }, t) => sc.draw(g, t * 1000),
});
</script>
</body>
</html>
