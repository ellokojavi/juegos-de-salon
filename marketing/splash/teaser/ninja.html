<!doctype html>
<!--
  The teaser of 🥷 Stick Ninja for the splash (D-351): under a full moon a ninja waits at the edge of
  a rooftop pillar, a gap and a far pillar with its red flag ahead. The stick grows up out of the
  pillar, trembles, tips over… and the moon goes dark the instant before it lands: does it reach?
  The game is never named or shown playing. marketing/splash/teaser.mjs captures it frame by frame;
  opened by hand (python3 -m http.server -d . from the repo root), it plays in a loop.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teaser · Stick Ninja</title>
<style>
  body { margin: 0; background: #14081f; display: grid; place-items: center; min-height: 100vh; }
  canvas { image-rendering: pixelated; width: 512px; height: 320px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { W, H, scene, rect, noise, ease, fade, ask } from './_common.js';

const SECONDS = 8;
const SKY = ['#0b0716', '#140a26', '#1d0f38', '#28144a', '#331a58'];
const TOP = 52;                    // the pillars' top
const A = { x: 14, w: 22 };        // the near pillar, the ninja on its edge
const B = { x: 84, w: 14 };        // the far one, with the flag in its middle
const REACH = B.x + B.w / 2 - (A.x + A.w);   // the stick that lands on the flag
const T_GROW = 1.6, T_HOLD = 4.2, T_TIP = 4.9, T_DARK = 5.25;
// The ninja: 6×8, a black body with the red band and its tails, eyes white
const NINJA = ['..##..', '.####.', '.#ww#.', 'rrrrrr', '.####.', '######', '.####.', '.#..#.'];
const COL = { '#': '#05030a', w: '#f4f1ff', r: '#ff2e88' };

function draw(ctx, t) {
  for (let y = 0; y < H; y++) rect(ctx, 0, y, W, 1, SKY[Math.min(SKY.length - 1, Math.floor(y / H * SKY.length))]);
  // Stars that twinkle
  for (let k = 0; k < 40; k++) { const x = Math.floor(noise(k, 1) * W), y = Math.floor(noise(k, 2) * 44); if (noise(k, Math.floor(t * 4)) > 0.25) rect(ctx, x, y, 1, 1, noise(k, 3) > 0.7 ? '#fff6c8' : '#8f86c4'); }
  // The moon, big behind the gap; it goes dark at the end (a cloud crosses it)
  const dark = Math.min(1, Math.max(0, (t - T_DARK) / 0.35));
  ctx.globalAlpha = 1 - dark * 0.85;
  ctx.fillStyle = 'rgba(255,240,190,0.12)'; ctx.beginPath(); ctx.arc(70, 30, 22, 0, 7); ctx.fill();
  ctx.fillStyle = '#fbeec2'; ctx.beginPath(); ctx.arc(70, 30, 16, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8d79e'; for (const [x, y, r] of [[64, 25, 3], [75, 34, 4], [72, 22, 2]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // A far skyline of pagoda roofs
  for (let x = 0; x < W; x++) { const h = 8 + Math.floor(noise(Math.floor(x / 9), 5) * 10); rect(ctx, x, H - h - 6, 1, h + 6, '#1a0e30'); }
  // The two pillars, fading to the night at the bottom
  for (const p of [A, B]) {
    rect(ctx, p.x, TOP, p.w, H - TOP, '#07040e');
    rect(ctx, p.x, TOP, p.w, 1, '#3d2a6b');
  }
  // The flag on the far pillar, waving
  const fx = B.x + B.w / 2;
  rect(ctx, fx, TOP - 7, 1, 7, '#c9c3e6');
  for (let i = 0; i < 4; i++) rect(ctx, fx + 1 + i, TOP - 7 + Math.round(Math.sin(t * 6 + i) * 0.6), 1, 3, '#ff3b5c');
  // The stick: grows straight up, trembles at the top, then tips over toward the flag
  const len = REACH * ease((t - T_GROW) / (T_HOLD - T_GROW - 0.6));
  const tip = ease((t - T_HOLD - 0.05) / (T_TIP - T_HOLD)) ** 1.6;
  const shake = t > T_HOLD - 0.6 && t < T_HOLD ? Math.sin(t * 60) * 0.03 : 0;
  if (t > T_GROW) {
    const ang = -Math.PI / 2 + tip * Math.PI / 2 * 0.93 + shake;   // stops short of flat: the dark comes first
    const ox = A.x + A.w - 1, oy = TOP;
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox + 0.5, oy); ctx.lineTo(ox + 0.5 + Math.cos(ang) * len, oy + Math.sin(ang) * len); ctx.stroke();
  }
  // The ninja, breathing; its band's tails blow in the wind
  const nx = A.x + A.w - 8, ny = TOP - 8 - (Math.floor(t * 2) % 2 && t < T_GROW ? 1 : 0);
  NINJA.forEach((row, j) => [...row].forEach((c, i) => { if (COL[c]) rect(ctx, nx + i, ny + j, 1, 1, COL[c]); }));
  for (let i = 1; i <= 3; i++) rect(ctx, nx - i, ny + 3 + Math.round(Math.sin(t * 8 + i) * 0.7), 1, 1, '#ff2e88');
  // The moon is out: only the stick's glint and a "?" over the ninja
  if (dark > 0) rect(ctx, 0, 0, W, H, `rgba(5,3,10,${(dark * 0.75).toFixed(3)})`);
  if (t > T_DARK + 0.35) { const k = t - T_DARK - 0.35; ask(ctx, nx, ny - 11 - (k < 0.12 ? 3 : k < 0.25 ? 1 : 0)); }
  fade(ctx, t, SECONDS);
}
scene({ seconds: SECONDS, draw });
</script>
</body>
</html>
