<!doctype html>
<!--
  The teaser of 🧱 Stack for the splash (D-351), on the teaser engine (_teaser.js, TEASERS.md) with the
  game's own scene (public/labs/stack/scene.js): a tall tower of neon slabs, already built, that the
  view circles and climbs, from dusk at its foot past the clouds to its top among the stars. Nothing
  slides, drops or is cut: the play is not given away (TEASERS.md, rule 2).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teaser · Stack</title>
<style>
  body { margin: 0; background: #14081f; display: grid; place-items: center; min-height: 100vh; }
  .marco { position: relative; width: 512px; height: 320px; }
  .marco canvas { position: absolute; inset: 0; width: 512px; height: 320px; }
</style>
</head>
<body>
<div class="marco"><canvas id="fondo"></canvas><canvas id="juego"></canvas></div>
<script type="module">
import { teaser, beats, ease, noise, W, H } from './_teaser.js';
import { newGame, perfectTime, drop, score, SLAB } from '../../../public/labs/stack/engine.js';
import { escena } from '../../../public/labs/stack/scene.js';

const SECONDS = 8, N = 34;   // the tower's slabs
// The story: the foot of the tower at dusk, the climb around it, the top among the stars
const STORY = [[0, 'foot'], [0.6, 'climb'], [6.8, 'top']];

/** The sky: dusk at the foot, night as the view climbs, the stars coming out, clouds sinking past. */
function sky(ctx, k) {
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, `rgb(${mix([58, 22, 92], [10, 5, 26])})`);
  gr.addColorStop(1, `rgb(${mix([255, 112, 140], [40, 16, 80])})`);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) if (noise(i, 4) < k * 1.1) {
    ctx.fillStyle = noise(i, 7) > 0.3 ? 'rgba(255,246,200,0.9)' : 'rgba(150,140,210,0.8)';
    ctx.fillRect(Math.floor(noise(i, 5) * W), Math.floor(noise(i, 6) * H), 2, 2);
  }
  for (let c = 0; c < 3; c++) {
    const y = 40 + c * 110 + k * 420 - 160, x = (c * 173 + 60) % W;
    ctx.fillStyle = 'rgba(255,210,230,0.14)';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + i * 22, y - (i % 2) * 8, 16 + (i % 2) * 8, 0, 7); ctx.fill(); }
  }
}
const climb = t => { const b = beats(STORY, t, SECONDS); return b.name === 'foot' ? 0 : b.name === 'top' ? 1 : ease(b.k); };

teaser({
  seconds: SECONDS,
  setup(canvas) {
    // The tower, built once: mostly near-perfect drops, a small cut now and then, so its sides are uneven
    const g = newGame(0);
    for (let n = 0, t = 0; n < N; n++) { t = perfectTime(g, t + 1); drop(g, t + (n % 3 === 1 ? 45 : n % 5 === 3 ? -35 : 0)); }
    g.moving = null;
    return { g, sc: escena(canvas, { zoom: 0.62 }), alto: score(g) * SLAB };
  },
  background: (ctx, t) => sky(ctx, climb(t)),
  draw({ g, sc, alto }, t) {
    // The view climbs from the foot to just over the top, and swings around the tower as it goes
    sc.camara({ y: -0.25 + climb(t) * (alto + 0.1), yaw: 0.62 * Math.sin((t / SECONDS) * Math.PI * 2) });
    sc.draw(g, t * 1000);
  },
});
</script>
</body>
</html>
