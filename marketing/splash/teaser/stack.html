<!doctype html>
<!--
  The teaser of 🧱 Stack for the splash (D-351), drawn with the game's own scene
  (public/labs/stack/scene.js), so it looks like the game: the isometric tower, each slab sliding in
  along x, then z, the overhang sliced off and falling. The tower climbs and the view climbs with it,
  from dusk past the clouds into the stars. At the top the last slab swings over a sliver… and stops
  in the air: how high does it go? The game is never named.
  marketing/splash/teaser.mjs captures it frame by frame; opened by hand, it plays in a loop.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teaser · Stack</title>
<style>
  body { margin: 0; background: #14081f; display: grid; place-items: center; min-height: 100vh; }
  .marco { position: relative; width: 512px; height: 320px; }
  .marco canvas { position: absolute; inset: 0; width: 512px; height: 320px; }
</style>
</head>
<body>
<div class="marco"><canvas id="cielo" width="512" height="320"></canvas><canvas id="torre"></canvas></div>
<script type="module">
import { newGame, perfectTime, score, RANGE, speed } from '../../../public/labs/stack/engine.js';
import { escena, soltar } from '../../../public/labs/stack/scene.js';
import { noise } from './_common.js';

const W = 512, H = 320, FPS = 30, SECONDS = 8, FRAMES = FPS * SECONDS;
const N = 15;                 // slabs dropped before the last one
const NEAR = 0.5;   // how far from the tower each slab enters
// A miss (ms off the perfect moment) for each drop: mostly small cuts, a perfect now and then
const MISS = [0, 60, -50, 0, 70, -60, 50, 0, -70, 60, -50, 70, 0, -60, 60];

const cielo = document.getElementById('cielo').getContext('2d');
const torre = document.getElementById('torre');
let g, sc, hecho, alto, fin;

/** A new run: the game's state and scene, from nothing, so the loop starts over cleanly. */
function empezar() {
  sc?.cerrar();
  sc = escena(torre, { zoom: 0.78 });
  g = newGame(0); hecho = 0; alto = null; fin = null;
  acercar(300);
}
/** The next slab enters already near the tower (the game's swing is too slow for 8 seconds). */
function acercar(t) { g.moving.t0 = t - (RANGE - NEAR) / speed(g.moving.level) * 1000; }

/** The sky: dusk at the ground, night as the tower climbs, the stars coming out, clouds sinking past. */
function pintarCielo(sube) {
  const k = Math.min(1, sube);
  const mezcla = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const gr = cielo.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, `rgb(${mezcla([58, 22, 92], [12, 6, 30])})`);
  gr.addColorStop(1, `rgb(${mezcla([255, 112, 140], [44, 18, 84])})`);
  cielo.fillStyle = gr; cielo.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) if (noise(i, 4) < k) {
    cielo.fillStyle = noise(i, 7) > 0.3 ? 'rgba(255,246,200,0.9)' : 'rgba(150,140,210,0.8)';
    cielo.fillRect(Math.floor(noise(i, 5) * W), Math.floor(noise(i, 6) * H), 2, 2);
  }
  for (let c = 0; c < 3; c++) {
    const y = 60 + c * 90 + sube * 260 - 120, x = (c * 173 + 60) % W;
    cielo.fillStyle = `rgba(255,210,230,${0.16 * (1 - k * 0.5)})`;
    for (let i = 0; i < 4; i++) { cielo.beginPath(); cielo.arc(x + i * 22, y - (i % 2) * 8, 16 + (i % 2) * 8, 0, 7); cielo.fill(); }
  }
}

/** The "?" over the stopped slab, in the house's yellow, outlined. */
function pregunta(ctx, x, y) {
  ctx.save(); ctx.font = '900 44px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 7; ctx.strokeStyle = '#14081f'; ctx.strokeText('?', x, y);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('?', x, y); ctx.restore();
}

const salida = Object.assign(document.createElement('canvas'), { width: W, height: H });
function frame(i) {
  if (i === 0 || !g) empezar();
  const t = (i / FPS) * 1000;
  // Every drop due by now, at its moment: the game's own drop, its cut piece falling, its perfect shining
  while (hecho < N && g.moving) {
    const at = perfectTime(g, g.moving.t0) + MISS[hecho];
    if (at > t) break;
    soltar(g, sc, at, t);
    hecho++;
    if (g.moving) acercar(at);
  }
  // The last slab swings, then stops in the air over the sliver
  if (hecho === N && fin == null) fin = t;
  if (fin != null && t - fin >= 900 && alto == null) alto = t;
  const reloj = alto ?? t;
  sc.draw(g, t, reloj);
  pintarCielo(Math.max(0, score(g) - 4) / (N - 4));
  const o = salida.getContext('2d');
  o.drawImage(document.getElementById('cielo'), 0, 0);
  o.drawImage(torre, 0, 0, W, H);
  if (alto != null && t - alto > 300) pregunta(o, W / 2, 70 - (t - alto < 420 ? 6 : 0));
  // In and out of black, so the loop starts over cleanly
  const s = t / 1000, f = Math.max(0, 1 - s / 0.4, 1 - (SECONDS - s) / 0.5);
  if (f > 0) { o.fillStyle = `rgba(11,7,22,${Math.min(1, f).toFixed(3)})`; o.fillRect(0, 0, W, H); }
  return salida;
}

window.frame = i => frame(i).toDataURL('image/png');
window.FRAMES = FRAMES; window.FPS = FPS; window.SCALE = 1; window.ready = true;
if (!new URLSearchParams(location.search).has('capture')) {
  const vista = document.getElementById('cielo').getContext('2d');
  let i = 0; setInterval(() => { vista.drawImage(frame(i), 0, 0); i = (i + 1) % FRAMES; }, 1000 / FPS);
}
</script>
</body>
</html>
