<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Juegos de Salón 🎲</title>
  <meta name="description" content="Juegos de salón para jugar con amigos: elige un juego, ingresa a los jugadores y deja que el celular guíe la partida.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <script type="importmap" id="importmap">{"imports": {"./assets/js/ui.js": "./assets/js/ui.js?v=0.8.0", "./assets/js/i18n.js": "./assets/js/i18n.js?v=0.8.0", "./assets/js/sound.js": "./assets/js/sound.js?v=0.8.0", "./assets/js/games.js": "./assets/js/games.js?v=0.8.0", "./assets/js/firebase-config.js": "./assets/js/firebase-config.js?v=0.8.0", "./assets/js/frases.js": "./assets/js/frases.js?v=0.8.0", "./cuarto-rey/game.js": "./cuarto-rey/game.js?v=0.8.0", "./cuarto-rey/rules.js": "./cuarto-rey/rules.js?v=0.8.0", "./toque-y-fama/game.js": "./toque-y-fama/game.js?v=0.8.0", "./toque-y-fama/rules.js": "./toque-y-fama/rules.js?v=0.8.0", "./toque-y-fama/engine.js": "./toque-y-fama/engine.js?v=0.8.0", "./assets/js/transport/local.js": "./assets/js/transport/local.js?v=0.8.0", "./assets/js/transport/firebase.js": "./assets/js/transport/firebase.js?v=0.8.0", "./assets/js/handoff.js": "./assets/js/handoff.js?v=0.8.0", "./assets/js/session.js": "./assets/js/session.js?v=0.8.0", "./batalla-naval/game.js": "./batalla-naval/game.js?v=0.8.0", "./batalla-naval/rules.js": "./batalla-naval/rules.js?v=0.8.0", "./batalla-naval/engine.js": "./batalla-naval/engine.js?v=0.8.0", "./linea-de-tiempo/game.js": "./linea-de-tiempo/game.js?v=0.8.0", "./linea-de-tiempo/rules.js": "./linea-de-tiempo/rules.js?v=0.8.0", "./linea-de-tiempo/engine.js": "./linea-de-tiempo/engine.js?v=0.8.0", "./linea-de-tiempo/decks/index.js": "./linea-de-tiempo/decks/index.js?v=0.8.0", "./linea-de-tiempo/decks/historia.js": "./linea-de-tiempo/decks/historia.js?v=0.8.0", "./linea-de-tiempo/decks/musica.js": "./linea-de-tiempo/decks/musica.js?v=0.8.0"}}</script>
  <link rel="stylesheet" href="assets/css/base.css?v=0.8.0">
  <style>
    .hero { text-align: center; padding: 28px 0 18px; }
    .hero .emoji { font-size: 3.2rem; display: block; margin-bottom: 6px; }
    .emoji-swap { display: inline-block; transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
    .emoji-swap.out { opacity: 0; transform: scale(0.3) rotate(-40deg); }
    .hero .sub { color: var(--muted); font-weight: 700; margin-top: 10px; }
    .games { display: grid; gap: 14px; margin-top: 10px; }
    .game-card {
      display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
      text-decoration: none; color: var(--ink);
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius);
      padding: 16px; transition: transform 0.12s, border-color 0.2s;
      animation: slideUp 0.4s ease-out both;
    }
    .game-card:active { transform: scale(0.98); }
    .game-card .emoji {
      font-size: 2.6rem; width: 64px; height: 64px; display: grid; place-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
      border-radius: 18px;
    }
    .game-card h2 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; }
    .game-card .tag { color: var(--muted); font-size: 0.95rem; margin: 2px 0 6px; }
    .game-card .meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .game-card .meta span { font-size: 0.78rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,0.25); }
    .game-card .go { font-family: var(--font-display); font-size: 2rem; color: var(--yellow); }
    .game-card.soon { opacity: 0.55; pointer-events: none; }
    .game-card.soon .go { visibility: hidden; }
    footer { margin-top: auto; padding-top: 28px; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .footer-msg { min-height: 3.2em; font-size: 1rem; line-height: 1.5; color: var(--ink); opacity: 0.9; transition: opacity 0.5s ease, transform 0.5s ease; font-weight: 700; }
    .footer-msg.out { opacity: 0; transform: translateY(6px); }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar" style="justify-content:flex-end"><div class="tools"><div id="lang-slot"></div><span id="sound-slot"></span></div></div>
    <header class="hero">
      <span class="emoji bounce"><span class="emoji-swap" id="hero-emoji" aria-hidden="true">🎲</span></span>
      <h1 class="display display--xl rainbow" data-i18n="appTitle">Juegos de Salón</h1>
      <p class="sub" data-i18n="appSub">Elige un juego, ingresa a los jugadores y deja que el celular guíe la partida.</p>
    </header>

    <section class="games" id="games" aria-label="Lista de juegos"></section>

    <footer>
      <p class="footer-msg" id="footer-msg" aria-live="polite">Toma con responsabilidad y con agua a mano. Si manejas, no tomas. 🚕</p>
      <p class="muted">v0.8.0 · <a href="https://github.com/ellokojavi/juegos-de-salon" style="color:inherit" data-i18n="code">código en GitHub</a></p>
    </footer>
  </main>

  <script type="module">
    import { GAMES } from './assets/js/games.js';
    import { sparkles, el } from './assets/js/ui.js';
    import { getLang, langToggle, applyStatic, pickLang, COMMON } from './assets/js/i18n.js';
    import { FRASES } from './assets/js/frases.js';
    import { SFX, soundToggle, initSound } from './assets/js/sound.js';
    sparkles();
    initSound();
    document.getElementById('sound-slot').append(soundToggle());
    document.addEventListener('click', e => { if (e.target.closest('.game-card, .lang-toggle button')) SFX.tap(); });
    const lang = getLang();
    document.documentElement.lang = lang;
    const T = COMMON[lang];
    applyStatic(T);
    document.title = `${T.appTitle} 🎲`;
    document.getElementById('lang-slot').append(langToggle());

    // 1) Lo importante primero: la lista de juegos.
    const list = document.getElementById('games');
    GAMES.forEach((g, i) => {
      const card = el('a', { class: 'game-card' + (g.available ? '' : ' soon'), href: g.path, style: `animation-delay:${i * 80}ms` },
        el('div', { class: 'emoji' }, g.emoji),
        el('div', {},
          el('h2', {}, pickLang(g.name, lang)),
          el('div', { class: 'tag' }, pickLang(g.tagline, lang)),
          el('div', { class: 'meta' },
            g.players && el('span', {}, `👥 ${g.players} ${T.players}`),
            g.duration && el('span', {}, `⏱ ${g.duration} ${T.minutes}`),
          ),
        ),
        el('div', { class: 'go' }, '›'),
      );
      list.append(card);
    });

    // 2) Decoraciones: si algo falla aquí, el menú sigue funcionando.
    try {
      // Emoji del encabezado: el dado se transforma suavemente en otros emojis festivos cada 3 segundos.
      const heroEmojis = ['🎲', '🍻', '🎯', '🍸', '🎈', '🍣', '🃏', '🎉', '🥳', '🍕', '🎤', '🔢', '🍹', '🕺', '🎊'];
      const heroEl = document.getElementById('hero-emoji');
      let heroIdx = 0;
      setInterval(() => {
        if (document.hidden) return;
        heroEl.classList.add('out');
        setTimeout(() => { heroIdx = (heroIdx + 1) % heroEmojis.length; heroEl.textContent = heroEmojis[heroIdx]; heroEl.classList.remove('out'); }, 350);
      }, 3000);
      // Mensajes rotativos del pie: uno al azar al cargar, luego uno nuevo cada 10 segundos con fundido.
      // 100 frases por idioma, barajadas en cada carga para que cada visita empiece distinto.
      const msgs = (FRASES[lang] || [T.footer]).slice().sort(() => Math.random() - 0.5);
      const msgEl = document.getElementById('footer-msg');
      let idx = 0;
      msgEl.textContent = msgs[idx];
      if (msgs.length > 1) setInterval(() => {
        if (document.hidden) return;
        msgEl.classList.add('out');
        setTimeout(() => { idx = (idx + 1) % msgs.length; msgEl.textContent = msgs[idx]; msgEl.classList.remove('out'); }, 500);
      }, 10000);
    } catch (e) { console.warn('decoraciones del menú:', e); }
  </script>
</body>
</html>
