<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Laboratorio · Línea de Tiempo ⏳</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../linea-de-tiempo/style.css">
  <link rel="stylesheet" href="../lab.css?r=2">
</head>
<body>
  <main class="app" id="app">
    <div class="lab-bar"><span>🧪 Laboratorio</span><a href="../../linea-de-tiempo/">ir al juego real</a></div>
    <div class="topbar">
      <a class="back" href="../" id="btn-menu" data-i18n="menu">‹ Menú</a>
      <div class="tools"><span class="chip" data-i18n="gameChip">⏳ Línea de Tiempo</span><span id="sound-slot"></span></div>
    </div>

    <section class="screen active" id="screen-intro">
      <div class="intro-hero">
        <span class="icon">⏳</span>
        <h1 class="display display--xl rainbow" data-i18n="title">Línea de Tiempo</h1>
        <p class="lead" data-i18n="lead"></p>
        <div id="lang-slot" style="margin-top:6px"></div>
      </div>
      <div class="stack">
        <div class="panel">
          <p class="lead" style="margin-bottom:6px" data-i18n="howTitle"></p>
          <p class="muted" data-i18n-html="howText"></p>
        </div>
        <div id="resume-slot"></div>
        <div class="modes" id="modes"></div>
      </div>
    </section>

    <section class="screen" id="screen-setup">
      <h2 class="display display--lg center" data-i18n="setupTitle"></h2>
      <div class="panel" id="setup-form"></div>
      <div class="form-error" id="setup-error"></div>
      <div class="stack" id="setup-actions"></div>
    </section>

    <section class="screen" id="screen-lobby">
      <h2 class="display display--lg center" data-i18n="lobbyTitle"></h2>
      <div class="panel center" id="lobby-box"></div>
    </section>

    <section class="screen" id="screen-play">
      <div class="status"><div class="who" id="status-who"></div><div class="sub" id="status-sub"></div></div>
      <div class="score" id="score"></div>
      <div class="hand-title"><b id="hand-title"></b><small id="pool-left"></small></div>
      <div class="hand" id="hand"></div>
      <div class="line-wrap" id="line-wrap"><div class="line" id="line"></div></div>
      <div class="place-row" id="place-row"></div>
    </section>

    <section class="screen" id="screen-result">
      <div class="result-hero"><span class="trophy" id="result-trophy">🏆</span><h2 class="display display--lg" id="result-title"></h2><p class="lead" id="result-sub"></p><p class="muted" id="result-note" hidden></p></div>
      <div class="panel"><p class="lead center" style="margin-bottom:4px" data-i18n="ranking"></p><ol class="ranking" id="result-ranking"></ol></div>
      <details class="panel replay" id="result-replay"><summary data-i18n="finalLine"></summary><div class="line" id="result-line"></div></details>
      <div class="stack" style="margin-top:14px" id="result-actions"></div>
    </section>
  </main>

  <div id="chat" hidden></div>
  <div class="handoff" id="handoff" hidden></div>
  <div class="cover" id="cover" hidden></div>
  <script type="module">import '../../linea-de-tiempo/game.js';</script>
</body>
</html>
