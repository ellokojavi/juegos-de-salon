<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Sin esto, Chrome en modo móvil asume una ventana de 980 px y encoge la tarjeta -->
  <meta name="viewport" content="width=600, initial-scale=1">
  <title>Tarjeta social</title>
  <!--
    La imagen que se ve cuando alguien pega un link de la app en WhatsApp o en un chat.
    Se dibuja acá con los estilos y los datos reales (assets/js/games.js), y `node tools/og.mjs
    imagenes` la fotografía a 1200×630. No se abre a mano: se mira con la captura.
      /tools/og/tarjeta.html?juego=dudo   una tarjeta por juego
      /tools/og/tarjeta.html              la del menú
  -->
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* El lienzo es de 600×315 y se fotografía al doble: 1200×630, la medida que piden las redes */
    html, body { margin: 0; padding: 0; width: 600px; height: 315px; overflow: hidden; }
    body { display: grid; place-items: center; }
    /*
      El margen lateral es de 12% y no de un par de píxeles porque **la imagen no se ve entera**:
      cada chat la recorta al alto de su propia ventanita, y el que se come los bordes es el de
      los lados. Con 1200×630 (1,91:1) recortada a 1,5:1 se van 127 px por lado, y ahí es donde
      quedaba justa la última letra del título. Todo lo que se tenga que leer vive adentro de esa
      franja; el degradado del fondo es lo único que puede perderse.
    */
    .tarjeta { width: 600px; height: 315px; padding: 30px 72px; box-sizing: border-box; display: grid; align-content: center; gap: 10px; position: relative; }

    /* ---- Tarjeta de un juego: el emoji manda y al lado va de qué se trata ---- */
    .juego { grid-template-columns: 118px 1fr; align-items: center; gap: 22px; align-content: center; }
    .juego .emoji { font-size: 100px; line-height: 1; text-align: center; filter: drop-shadow(0 0 26px rgba(255, 210, 63, 0.55)); }
    .juego .nombre { font-family: var(--font-display); font-size: 52px; line-height: 0.92; letter-spacing: 0.03em; margin: 0 0 8px; }
    .juego .bajada { color: var(--ink); font-weight: 800; font-size: 17px; line-height: 1.3; margin: 0 0 12px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip2 { font-weight: 900; font-size: 14px; padding: 5px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); }

    /* ---- Tarjeta del menú: el nombre de la app y los juegos que hay ---- */
    .menu { justify-items: center; text-align: center; gap: 14px; }
    .menu .titulo { font-family: var(--font-display); font-size: 60px; line-height: 0.9; letter-spacing: 0.02em; margin: 0; }
    .menu .bajada { color: var(--ink); font-weight: 800; font-size: 18px; margin: 0; text-wrap: balance; }
    .menu .fila { display: flex; gap: 12px; font-size: 38px; line-height: 1; }
    .menu .fila span { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45)); }

    .pie { position: absolute; left: 72px; right: 72px; bottom: 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 15px; color: var(--muted); }
    .pie .dominio { color: var(--yellow); letter-spacing: 0.04em; }
    /* La animación del degradado deja el título de un color distinto en cada foto */
    .rainbow { animation: none; }
  </style>
</head>
<body>
  <div class="tarjeta" id="tarjeta"></div>
  <script type="module">
    import { GAMES } from '/assets/js/games.js';
    import { COMMON, getLang } from '/assets/js/i18n.js';

    const id = new URLSearchParams(location.search).get('juego');
    // El idioma se pide con ?lang= en la URL, pero se lee con getLang(): i18n.js lo aplica al
    // cargar y saca el parámetro de la barra, así que para cuando corre esto ya no está (D-74).
    const lang = getLang();
    const caja = document.getElementById('tarjeta');
    const el = (tag, clase, ...hijos) => {
      const n = document.createElement(tag);
      if (clase) n.className = clase;
      hijos.forEach(h => n.append(h));
      return n;
    };
    // La misma frase que el pie de la tarjeta de cada juego, en los tres idiomas
    const GRATIS = { es: 'Gratis y sin instalar', en: 'Free, no install', pt: 'De graça, sem instalar' };
    const pie = (izq) => {
      const p = el('div', 'pie');
      p.append(el('span', null, izq), el('span', 'dominio', 'juegosdesalon.cl'));
      return p;
    };

    if (id) {
      const g = GAMES.find(x => x.id === id);
      if (!g) throw new Error(`No existe el juego "${id}"`);
      caja.classList.add('juego');
      const texto = el('div');
      texto.append(
        el('h1', 'nombre rainbow', g.name[lang]),
        el('p', 'bajada', g.tagline[lang]),
      );
      const chips = el('div', 'chips');
      chips.append(
        el('span', 'chip2', `👥 ${g.players} ${COMMON[lang].players}`),
        el('span', 'chip2', `⏱ ${g.duration} ${COMMON[lang].minutes}`),
      );
      texto.append(chips);
      caja.append(el('div', 'emoji', g.emoji), texto, pie(GRATIS[lang]));
    } else {
      caja.classList.add('menu');
      const fila = el('div', 'fila');
      GAMES.filter(g => g.available).forEach(g => fila.append(el('span', null, g.emoji)));
      caja.append(
        fila,
        el('h1', 'titulo rainbow', COMMON[lang].appTitle),
        el('p', 'bajada', COMMON[lang].appSub.replace(/\.$/, '')),
        pie(GRATIS[lang]),
      );
    }
    document.fonts.ready.then(() => { document.body.dataset.listo = '1'; });
  </script>
</body>
</html>
