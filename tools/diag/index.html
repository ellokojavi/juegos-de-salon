<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Las mismas etiquetas que usan las páginas de verdad: acá interesa medir lo que ellas miden -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#150726">
<title>Diagnóstico de alto · Juegos de Salón</title>
<!--
  Página de diagnóstico. No se publica ni se enlaza: se mira desde un celular de verdad
  sirviendo el árbol de trabajo por Tailscale (D-67):

      python3 -m http.server 8765
      tailscale serve --bg 8765      →  https://<equipo>.<tailnet>.ts.net/tools/diag/

  Por qué existe: un error de alto que solo aparece en un celular con barras de sistema no lo ve
  ninguna prueba —en Chrome headless las muescas valen 0— y simularlas con variables CSS no es lo
  mismo que tenerlas: no mueve el viewport ni el 100dvh. Esto imprime los números del aparato.
-->
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #150726; color: #fff; font: 15px/1.45 -apple-system, system-ui, sans-serif;
    min-height: 100dvh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  }
  .app { padding: 16px 18px 32px; min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom)); display: flex; flex-direction: column; }
  h1 { font-size: 17px; margin: 0 0 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .75; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.12); vertical-align: baseline; }
  td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
  tr:nth-last-child(2) td:last-child { white-space: normal; font-size: 11px; font-weight: 600; opacity: .8; }
  .mal { color: #ff5d8f; }
  .bien { color: #6ee7b7; }
  .nota { margin-top: 14px; opacity: .7; font-size: 13px; }
  .fin { margin-top: auto; padding-top: 24px; }
  .fin b { display: block; background: linear-gradient(180deg,#ffd23f,#ff9f1c); color: #2b1400;
           text-align: center; padding: 18px; border-radius: 999px; font-size: 17px; }
</style>
</head>
<body>
<div class="app">
  <h1>Diagnóstico de alto</h1>
  <table id="t"></table>
  <p class="nota">Saca una captura de esta pantalla completa. Lo que importa es si la página mide
     más que la ventana: ahí es donde se va el botón de apostar.</p>
  <div class="fin"><b>Este bloque se apoya abajo</b></div>
</div>
<script>
  const px = n => Math.round(n) + ' px';
  const medir = prop => {
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;visibility:hidden;height:${prop}`;
    document.body.append(d);
    const h = d.getBoundingClientRect().height;
    d.remove();
    return h;
  };
  const cs = getComputedStyle(document.documentElement);
  const doc = document.documentElement;
  const sobra = doc.scrollHeight - innerHeight;
  const filas = [
    ['ventana (innerHeight)', px(innerHeight)],
    ['visualViewport', visualViewport ? px(visualViewport.height) : '—'],
    ['100dvh', px(medir('100dvh'))],
    ['100svh', px(medir('100svh'))],
    ['100lvh', px(medir('100lvh'))],
    ['100vh', px(medir('100vh'))],
    ['safe-area arriba', cs.getPropertyValue('--safe-top').trim() || '0px'],
    ['safe-area abajo', cs.getPropertyValue('--safe-bottom').trim() || '0px'],
    ['alto de la página', px(doc.scrollHeight)],
    ['se pasa de la ventana', sobra > 1 ? `⚠️ ${px(sobra)}` : 'no'],
    ['pantalla del aparato', `${screen.width}×${screen.height} · dpr ${devicePixelRatio}`],
    ['navegador', navigator.userAgent],
    ['instalada como app', matchMedia('(display-mode: standalone)').matches ? 'sí' : 'no'],
  ];
  document.getElementById('t').innerHTML = filas.map(([k, v]) =>
    `<tr><td>${k}</td><td class="${/⚠️/.test(v) ? 'mal' : ''}">${v}</td></tr>`).join('');
</script>
</body>
</html>
